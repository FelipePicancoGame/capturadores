<style>
:root{--bg:#f6f1e6;--card:#fff;--ink:#2b2418;--mut:#6d6250;--ac:#2f7a36;--bd:#ddd2bd;--err:#b3261e}
@media (prefers-color-scheme:dark){:root{--bg:#1c1a16;--card:#27241f;--ink:#f1eadb;--mut:#b3a88f;--ac:#6cc070;--bd:#3d382f;--err:#ff8a80}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,sans-serif}
main{max-width:760px;margin:0 auto;padding:16px}
h1{font-size:22px;margin:4px 0 2px}p.s{margin:0 0 14px;color:var(--mut)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin:0 0 14px}
.card h2{font-size:16px;margin:0 0 10px}
input,select,button{font:inherit}input[type=password],input[type=text]{width:100%;padding:10px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--ink)}
button{padding:10px 14px;border:0;border-radius:10px;background:var(--ac);color:#fff;font-weight:600;cursor:pointer}
button.sec{background:transparent;color:var(--ink);border:1px solid var(--bd)}button:disabled{opacity:.45}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:8px 0}
.role{display:grid;grid-template-columns:90px 1fr auto;gap:8px;align-items:center;padding:6px 0;border-top:1px solid var(--bd)}
.role:first-of-type{border-top:0}.role b{font-size:14px}.role select{width:100%;padding:8px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--ink);min-width:0}
.mini{padding:6px 10px;font-size:14px}
#st{white-space:pre-wrap;color:var(--mut);font-size:14px}.err{color:var(--err)}

.ln small{color:var(--mut);display:block}.ok{color:var(--ac)}
progress{width:100%;height:14px}
</style></head><body><main>
<h1>Gravador em Inglês</h1>
<p class="s">Capturadores do Vale · Tutorial com o Tio Felipe · 174 falas · ~10.772 letras (créditos)</p>

<div class="card"><h2>1. Sua chave da ElevenLabs</h2>
<input id="key" type="password" placeholder="Cole aqui a API key (sk_...)" autocomplete="off">
<div class="row"><label><input id="lembrar" type="checkbox" checked> lembrar neste aparelho</label><button id="bLoad">Entrar</button></div>

<p class="s" style="font-size:13px">A chave fica só neste navegador. Ela não é enviada para ninguém além da ElevenLabs.</p></div>

<div class="card"><h2>2. Vozes de cada personagem</h2><div id="cast"><p class="s">Entre primeiro com a chave.</p></div></div>

<div class="card"><h2>3. Gravar</h2>
<div class="row"><button id="bRec" disabled>Gravar tudo</button><button id="bZip" class="sec" disabled>Baixar ZIP</button><button id="bStop" class="sec" disabled>Parar</button></div>
<progress id="pg" value="0" max="1"></progress><div id="st"></div>
<div id="lines"></div></div>
</main>
<script>
const LINES=[{"id": "f0001_narr", "role": "narr", "text": "7 new monsters: Coralet and Ferritus (sea), Toxik (forest), Pugmin (mountain), Flakelet and Pengwee (new ICE type!) and Emberkit (volcano). Each area has its own monsters.", "tts": "7 new monsters: Coralet and Ferritus (sea), Toxik (forest), Pugmin (mountain), Flakelet and Pengwee (new ICE type!) and Emberkit (volcano). Each area has its own monsters.", "key": "newmonsterscoraletandferritusseatoxikforestpugminmountainflakeletandpengweenewicetypeandemberkitvolcanoeachareahasitsownmonsters", "g": ""}, {"id": "f0002_teo", "role": "teo", "text": "Even Chirpip tried to sing louder. It didn't help.", "tts": "Even Chirpip tried to sing louder. It didn't help.", "key": "evenchirpiptriedtosinglouderitdidnthelp", "g": ""}, {"id": "f0003_capitao2", "role": "capitao2", "text": "Ahoy! The sea is calm today like a sleeping Ripplo.", "tts": "Ahoy! The sea is calm today like a sleeping Ripplo.", "key": "ahoytheseaiscalmtodaylikeasleepingripplo", "g": ""}, {"id": "f0004_capitao2", "role": "capitao2", "text": "By Ripplo's beard! A horde of monsters is coming out of the sea!", "tts": "By Ripplo's beard! A horde of monsters is coming out of the sea!", "key": "byripplosbeardahordeofmonstersiscomingoutofthesea", "g": ""}, {"id": "f0005_celeste3", "role": "celeste3", "text": "A little Spookle got lost from its family and is crying in the south of the forest.", "tts": "A little Spookle got lost from its family and is crying in the south of the forest.", "key": "alittlespooklegotlostfromitsfamilyandiscryinginthesouthoftheforest", "g": ""}, {"id": "f0006_teo", "role": "teo", "text": "So it wasn't Chirpip? I was about to ask it to sing more quietly.", "tts": "So it wasn't Chirpip? I was about to ask it to sing more quietly.", "key": "soitwasntchirpipiwasabouttoaskittosingmorequietly", "g": ""}, {"id": "f0007_narr", "role": "narr", "text": "Pick 1 card: it counts for ALL towers", "tts": "Pick 1 card: it counts for ALL towers", "key": "pickcarditcountsforalltowers", "g": ""}, {"id": "f0008_narr", "role": "narr", "text": "Phase 2: it got faster", "tts": "Phase 2: it got faster", "key": "phaseitgotfaster", "g": ""}, {"id": "f0009_fe", "role": "fe", "text": "Hydration is everything! Even Ripplo agrees.", "tts": "Hydration is everything! Even Ripplo agrees.", "key": "hydrationiseverythingevenripploagrees", "g": ""}, {"id": "f0010_narr", "role": "narr", "text": "hits the whole line, pushes and can stun", "tts": "hits the whole line, pushes and can stun", "key": "hitsthewholelinepushesandcanstun", "g": ""}, {"id": "f0011_kai3", "role": "kai3", "text": "My Pengwee got strong! Battle me? I want to be a guardian like you!", "tts": "My Pengwee got strong! Battle me? I want to be a guardian like you!", "key": "mypengweegotstrongbattlemeiwanttobeaguardianlikeyou", "g": ""}, {"id": "f0012_nina", "role": "nina", "text": "Did you know Chirpip sleeps with one eye open? It's true!", "tts": "Did you know Chirpip sleeps with one eye open? It's true!", "key": "didyouknowchirpipsleepswithoneeyeopenitstrue", "g": ""}, {"id": "f0013_narr", "role": "narr", "text": "The bell rings. The doors open and the square comes to life. Chirpip answers with a cheerful song.", "tts": "The bell rings. The doors open and the square comes to life. Chirpip answers with a cheerful song.", "key": "thebellringsthedoorsopenandthesquarecomestolifechirpipanswerswithacheerfulsong", "g": ""}, {"id": "f0014_narr", "role": "narr", "text": "POW! 👊 What a punch! Each punch takes a little HP. If the wall breaks, the monsters lose!", "tts": "POW!  What a punch! Each punch takes a little HP. If the wall breaks, the monsters lose!", "key": "powwhatapuncheachpunchtakesalittlehpifthewallbreaksthemonsterslose", "g": ""}, {"id": "f0015_narr", "role": "narr", "text": "For 20 min: +15% speed and +10% attack. Use it in the Backpack.", "tts": "For 20 min: +15% speed and +10% attack. Use it in the Backpack.", "key": "forminspeedandattackuseitinthebackpack", "g": ""}, {"id": "f0016_teo", "role": "teo", "text": "My monster is a little bird called Chirpip. Will you train with us? That way you learn how to battle!", "tts": "My monster is a little bird called Chirpip. Will you train with us? That way you learn how to battle!", "key": "mymonsterisalittlebirdcalledchirpipwillyoutrainwithusthatwayyoulearnhowtobattle", "g": ""}, {"id": "f0017_narr", "role": "narr", "text": "All done! Everyone is healed. Come back anytime!", "tts": "All done! Everyone is healed. Come back anytime!", "key": "alldoneeveryoneishealedcomebackanytime", "g": ""}, {"id": "f0018_narr", "role": "narr", "text": "The aurora is back. I wanted the whole village to see the sky from the observatory.", "tts": "The aurora is back. I wanted the whole village to see the sky from the observatory.", "key": "theauroraisbackiwantedthewholevillagetoseetheskyfromtheobservatory", "g": ""}, {"id": "f0019_narr", "role": "narr", "text": "The letter can be picked up without going into the water and without catching Ripplo.", "tts": "The letter can be picked up without going into the water and without catching Ripplo.", "key": "thelettercanbepickedupwithoutgoingintothewaterandwithoutcatchingripplo", "g": ""}, {"id": "f0020_narr", "role": "narr", "text": "The sunset light looks golden. These are diary notes, not new crystal powers.", "tts": "The sunset light looks golden. These are diary notes, not new crystal powers.", "key": "thesunsetlightlooksgoldenthesearediarynotesnotnewcrystalpowers", "g": ""}, {"id": "f0021_narr", "role": "narr", "text": "This is the best part of helping.", "tts": "This is the best part of helping.", "key": "thisisthebestpartofhelping", "g": ""}, {"id": "f0022_narr", "role": "narr", "text": "The nut holds the wheel after the axle is in place.", "tts": "The nut holds the wheel after the axle is in place.", "key": "thenutholdsthewheelaftertheaxleisinplace", "g": ""}, {"id": "f0023_narr", "role": "narr", "text": "The first card shows one star.", "tts": "The first card shows one star.", "key": "thefirstcardshowsonestar", "g": ""}, {"id": "f0024_narr", "role": "narr", "text": "The wheel is fine, but I mixed up the axle parts. Without it, today's delivery can't go out.", "tts": "The wheel is fine, but I mixed up the axle parts. Without it, today's delivery can't go out.", "key": "thewheelisfinebutimixeduptheaxlepartswithoutittodaysdeliverycantgoout", "g": ""}, {"id": "f0025_narr", "role": "narr", "text": "The third shows three. The note says to sort from the smallest amount to the largest.", "tts": "The third shows three. The note says to sort from the smallest amount to the largest.", "key": "thethirdshowsthreethenotesaystosortfromthesmallestamounttothelargest", "g": ""}, {"id": "f0026_narr", "role": "narr", "text": "The wide trail goes to the village. The narrow path ends at the lake.", "tts": "The wide trail goes to the village. The narrow path ends at the lake.", "key": "thewidetrailgoestothevillagethenarrowpathendsatthelake", "g": ""}, {"id": "f0027_narr", "role": "narr", "text": "The plank near the bank is loose and bangs against the support.", "tts": "The plank near the bank is loose and bangs against the support.", "key": "theplanknearthebankislooseandbangsagainstthesupport", "g": ""}, {"id": "f0028_narr", "role": "narr", "text": "The water by the bank stopped flowing. Something is stuck in the little channel.", "tts": "The water by the bank stopped flowing. Something is stuck in the little channel.", "key": "thewaterbythebankstoppedflowingsomethingisstuckinthelittlechannel", "g": ""}, {"id": "f0029_narr", "role": "narr", "text": "The river water looks blue in the drawing.", "tts": "The river water looks blue in the drawing.", "key": "theriverwaterlooksblueinthedrawing", "g": ""}, {"id": "f0030_narr", "role": "narr", "text": "I thought a big adventure always ended with a big battle.", "tts": "I thought a big adventure always ended with a big battle.", "key": "ithoughtabigadventurealwaysendedwithabigbattle", "g": ""}, {"id": "f0031_narr", "role": "narr", "text": "Now I get it. They're not just decoration. The lights show the way.", "tts": "Now I get it. They're not just decoration. The lights show the way.", "key": "nowigetittheyrenotjustdecorationthelightsshowtheway", "g": ""}, {"id": "f0032_narr", "role": "narr", "text": "Now nobody has to guess the way back.", "tts": "Now nobody has to guess the way back.", "key": "nownobodyhastoguessthewayback", "g": ""}, {"id": "f0033_narr", "role": "narr", "text": "Now nobody will end up at the lake by accident!", "tts": "Now nobody will end up at the lake by accident!", "key": "nownobodywillendupatthelakebyaccident", "g": ""}, {"id": "f0034_narr", "role": "narr", "text": "Now you have a story nobody else can live for you.", "tts": "Now you have a story nobody else can live for you.", "key": "nowyouhaveastorynobodyelsecanliveforyou", "g": ""}, {"id": "f0035_narr", "role": "narr", "text": "I took the rock hit! Just got a little bump on my head.", "tts": "I took the rock hit! Just got a little bump on my head.", "key": "itooktherockhitjustgotalittlebumponmyhead", "g": ""}, {"id": "f0036_narr", "role": "narr", "text": "Good thing. I can't reach the stars.", "tts": "Good thing. I can't reach the stars.", "key": "goodthingicantreachthestars", "g": ""}, {"id": "f0037_narr", "role": "narr", "text": "Blackberries! I promise to share, Téo. Almost all of them.", "tts": "Blackberries! I promise to share, Téo. Almost all of them.", "key": "blackberriesipromisetoshareteoalmostallofthem", "g": ""}, {"id": "f0038_narr", "role": "narr", "text": "The yellow ones stay in the market basket. They're not in this recipe.", "tts": "The yellow ones stay in the market basket. They're not in this recipe.", "key": "theyellowonesstayinthemarketbaskettheyrenotinthisrecipe", "g": ""}, {"id": "f0039_narr", "role": "narr", "text": "The sky cards got out of order. I want to get the viewing ready for the villagers.", "tts": "The sky cards got out of order. I want to get the viewing ready for the villagers.", "key": "theskycardsgotoutoforderiwanttogettheviewingreadyforthevillagers", "g": ""}, {"id": "f0040_narr", "role": "narr", "text": "The cards are in order. Celeste sets up the telescope and the viewing can begin.", "tts": "The cards are in order. Celeste sets up the telescope and the viewing can begin.", "key": "thecardsareinordercelestesetsupthetelescopeandtheviewingcanbegin", "g": ""}, {"id": "f0041_narr", "role": "narr", "text": "The marker ribbons came loose. Each color marks a different part of the trail.", "tts": "The marker ribbons came loose. Each color marks a different part of the trail.", "key": "themarkerribbonscamelooseeachcolormarksadifferentpartofthetrail", "g": ""}, {"id": "f0042_narr", "role": "narr", "text": "The ribbons tied to the low posts show the way again. Hero and Yuki head back to the village.", "tts": "The ribbons tied to the low posts show the way again. Hero and Yuki head back to the village.", "key": "theribbonstiedtothelowpostsshowthewayagainheroandyukiheadbacktothevillage", "g": ""}, {"id": "f0043_narr", "role": "narr", "text": "The blue berries are on the list too.", "tts": "The blue berries are on the list too.", "key": "theblueberriesareonthelisttoo", "g": ""}, {"id": "f0044_narr", "role": "narr", "text": "The market berries got mixed up. The recipe only uses the red and blue ones.", "tts": "The market berries got mixed up. The recipe only uses the red and blue ones.", "key": "themarketberriesgotmixeduptherecipeonlyusestheredandblueones", "g": ""}, {"id": "f0045_narr", "role": "narr", "text": "The berries are sorted into bowls. Later, warm bread comes out of the bakery.", "tts": "The berries are sorted into bowls. Later, warm bread comes out of the bakery.", "key": "theberriesaresortedintobowlslaterwarmbreadcomesoutofthebakery", "g": ""}, {"id": "f0046_narr", "role": "narr", "text": "The red berries are on the recipe list.", "tts": "The red berries are on the recipe list.", "key": "theredberriesareontherecipelist", "g": ""}, {"id": "f0047_narr", "role": "narr", "text": "The marks on the left are small and round. The ones on the right are wheel marks.", "tts": "The marks on the left are small and round. The ones on the right are wheel marks.", "key": "themarksontheleftaresmallandroundtheonesontherightarewheelmarks", "g": ""}, {"id": "f0048_narr", "role": "narr", "text": "The three stakes are marked. The trail can be read from far away.", "tts": "The three stakes are marked. The trail can be read from far away.", "key": "thethreestakesaremarkedthetrailcanbereadfromfaraway", "g": ""}, {"id": "f0049_narr", "role": "narr", "text": "Behind the rock, sheltered from the wind, is Iara's notebook.", "tts": "Behind the rock, sheltered from the wind, is Iara's notebook.", "key": "behindtherockshelteredfromthewindisiarasnotebook", "g": ""}, {"id": "f0050_bandido", "role": "bandido", "text": "Get out of here before I call my monsters!", "tts": "Get out of here before I call my monsters!", "key": "getoutofherebeforeicallmymonsters", "g": ""}, {"id": "f0051_narr", "role": "narr", "text": "Welcome to the team, Ratonga. Rule number one: don't chew my backpack.", "tts": "Welcome to the team, Ratonga. Rule number one: don't chew my backpack.", "key": "welcometotheteamratongarulenumberonedontchewmybackpack", "g": ""}, {"id": "f0052_narr", "role": "narr", "text": "Bike fixed! Just don't ask me to change the tire, please.", "tts": "Bike fixed! Just don't ask me to change the tire, please.", "key": "bikefixedjustdontaskmetochangethetireplease", "g": ""}, {"id": "f0053_narr", "role": "narr", "text": "With the trash out of the channel, the water flows again. A wild Ripplo watches from the bank.", "tts": "With the trash out of the channel, the water flows again. A wild Ripplo watches from the bank.", "key": "withthetrashoutofthechannelthewaterflowsagainawildripplowatchesfromthebank", "g": ""}, {"id": "f0054_narr", "role": "narr", "text": "Start with one star and increase the amount.", "tts": "Start with one star and increase the amount.", "key": "startwithonestarandincreasetheamount", "g": ""}, {"id": "f0055_narr", "role": "narr", "text": "Agreed. We should look into more recipes.", "tts": "Agreed. We should look into more recipes.", "key": "agreedweshouldlookintomorerecipes", "g": ""}, {"id": "f0056_narr", "role": "narr", "text": "You're welcome, Lia! And if that bandit shows up again, he'll need training wheels to run away.", "tts": "You're welcome, Lia! And if that bandit shows up again, he'll need training wheels to run away.", "key": "yourewelcomeliaandifthatbanditshowsupagainhellneedtrainingwheelstorunaway", "g": ""}, {"id": "f0057_narr", "role": "narr", "text": "After all that running around, what do you remember about the Valley's landscapes?", "tts": "After all that running around, what do you remember about the Valley's landscapes?", "key": "afterallthatrunningaroundwhatdoyourememberaboutthevalleyslandscapes", "g": ""}, {"id": "f0058_narr", "role": "narr", "text": "As long as the parts come with names. All these nuts look the same to me.", "tts": "As long as the parts come with names. All these nuts look the same to me.", "key": "aslongasthepartscomewithnamesallthesenutslookthesametome", "g": ""}, {"id": "f0059_narr", "role": "narr", "text": "This time the answer goes by boat. No shortcuts across the sea.", "tts": "This time the answer goes by boat. No shortcuts across the sea.", "key": "thistimetheanswergoesbyboatnoshortcutsacrossthesea", "g": ""}, {"id": "f0060_narr", "role": "narr", "text": "Tell him to keep training. I'll come back with new stories.", "tts": "Tell him to keep training. I'll come back with new stories.", "key": "tellhimtokeeptrainingillcomebackwithnewstories", "g": ""}, {"id": "f0061_narr", "role": "narr", "text": "And room to write the next one.", "tts": "And room to write the next one.", "key": "androomtowritethenextone", "g": ""}, {"id": "f0062_narr", "role": "narr", "text": "And on the ground. The supports are low.", "tts": "And on the ground. The supports are low.", "key": "andonthegroundthesupportsarelow", "g": ""}, {"id": "f0063_narr", "role": "narr", "text": "Axle first, fastening next, test last.", "tts": "Axle first, fastening next, test last.", "key": "axlefirstfasteningnexttestlast", "g": ""}, {"id": "f0064_narr", "role": "narr", "text": "Push a rock? Good thing I had breakfast today.", "tts": "Push a rock? Good thing I had breakfast today.", "key": "pusharockgoodthingihadbreakfasttoday", "g": ""}, {"id": "f0065_narr", "role": "narr", "text": "Deliveries out of order and the address forgotten. I need help, sailor.", "tts": "Deliveries out of order and the address forgotten. I need help, sailor.", "key": "deliveriesoutoforderandtheaddressforgottenineedhelpsailor", "g": ""}, {"id": "f0066_narr", "role": "narr", "text": "So it was you taking care of the last delivery.", "tts": "So it was you taking care of the last delivery.", "key": "soitwasyoutakingcareofthelastdelivery", "g": ""}, {"id": "f0067_narr", "role": "narr", "text": "So this was a good one.", "tts": "So this was a good one.", "key": "sothiswasagoodone", "g": ""}, {"id": "f0068_narr", "role": "narr", "text": "Then write it down. The path deserves to be remembered too.", "tts": "Then write it down. The path deserves to be remembered too.", "key": "thenwriteitdownthepathdeservestoberememberedtoo", "g": ""}, {"id": "f0069_narr", "role": "narr", "text": "So today the adventure is helping the next adventurer.", "tts": "So today the adventure is helping the next adventurer.", "key": "sotodaytheadventureishelpingthenextadventurer", "g": ""}, {"id": "f0070_narr", "role": "narr", "text": "It was a repair trying to get attention.", "tts": "It was a repair trying to get attention.", "key": "itwasarepairtryingtogetattention", "g": ""}, {"id": "f0071_narr", "role": "narr", "text": "Left the basket deep in the forest? Of course, where else would it be...", "tts": "Left the basket deep in the forest? Of course, where else would it be...", "key": "leftthebasketdeepintheforestofcoursewhereelsewoulditbe", "g": ""}, {"id": "f0072_narr", "role": "narr", "text": "This one goes to the baker. This one, to the lighthouse keeper. And this one... to you.", "tts": "This one goes to the baker. This one, to the lighthouse keeper. And this one... to you.", "key": "thisonegoestothebakerthisonetothelighthousekeeperandthisonetoyou", "g": ""}, {"id": "f0073_narr", "role": "narr", "text": "Finally a mission that smells like bread.", "tts": "Finally a mission that smells like bread.", "key": "finallyamissionthatsmellslikebread", "g": ""}, {"id": "f0074_narr", "role": "narr", "text": "Stay on firm sand. No letter is worth a dangerous dive.", "tts": "Stay on firm sand. No letter is worth a dangerous dive.", "key": "stayonfirmsandnoletterisworthadangerousdive", "g": ""}, {"id": "f0075_narr", "role": "narr", "text": "Hero and Celeste hang the lanterns on the low posts. Celeste lights one at a time, carefully. The trail lights up all the way to the square.", "tts": "Hero and Celeste hang the lanterns on the low posts. Celeste lights one at a time, carefully. The trail lights up all the way to the square.", "key": "heroandcelestehangthelanternsonthelowpostscelestelightsoneatatimecarefullythetraillightsupallthewaytothesquare", "g": ""}, {"id": "f0076_narr", "role": "narr", "text": "Hero finds the first envelope stuck between two planks in the sand. The second was next to a rock. The seals are still intact.", "tts": "Hero finds the first envelope stuck between two planks in the sand. The second was next to a rock. The seals are still intact.", "key": "herofindsthefirstenvelopestuckbetweentwoplanksinthesandthesecondwasnexttoarockthesealsarestillintact", "g": ""}, {"id": "f0077_narr", "role": "narr", "text": "Hero waits for the water to go back and picks up the envelope from the dry bank.", "tts": "Hero waits for the water to go back and picks up the envelope from the dry bank.", "key": "herowaitsforthewatertogobackandpicksuptheenvelopefromthedrybank", "g": ""}, {"id": "f0078_narr", "role": "narr", "text": "Hero closes the diary. From the temple garden, the aurora lights up the Valley sky.", "tts": "Hero closes the diary. From the temple garden, the aurora lights up the Valley sky.", "key": "heroclosesthediaryfromthetemplegardentheauroralightsupthevalleysky", "g": ""}, {"id": "f0079_narr", "role": "narr", "text": "Hero fixes the sign in the right direction. The fork shows the way again.", "tts": "Hero fixes the sign in the right direction. The fork shows the way again.", "key": "herofixesthesignintherightdirectiontheforkshowsthewayagain", "g": ""}, {"id": "f0080_narr", "role": "narr", "text": "Hero gathers the lanterns among the leaves and rocks. Looking back, he notices the square has almost vanished around the bend.", "tts": "Hero gathers the lanterns among the leaves and rocks. Looking back, he notices the square has almost vanished around the bend.", "key": "herogathersthelanternsamongtheleavesandrockslookingbackhenoticesthesquarehasalmostvanishedaroundthebend", "g": ""}, {"id": "f0081_narr", "role": "narr", "text": "Today the map gets help from the ribbons.", "tts": "Today the map gets help from the ribbons.", "key": "todaythemapgetshelpfromtheribbons", "g": ""}, {"id": "f0082_narr", "role": "narr", "text": "Match the house drawing with the trail that reaches the village.", "tts": "Match the house drawing with the trail that reaches the village.", "key": "matchthehousedrawingwiththetrailthatreachesthevillage", "g": ""}, {"id": "f0083_narr", "role": "narr", "text": "I've gotten lost on my own. I won't help the sign do that to others.", "tts": "I've gotten lost on my own. I won't help the sign do that to others.", "key": "ivegottenlostonmyowniwonthelpthesigndothattoothers", "g": ""}, {"id": "f0084_narr", "role": "narr", "text": "My notebook fell during the hike. The wind already erased half of the footprints.", "tts": "My notebook fell during the hike. The wind already erased half of the footprints.", "key": "mynotebookfellduringthehikethewindalreadyerasedhalfofthefootprints", "g": ""}, {"id": "f0085_narr", "role": "narr", "text": "Monsters chewing tires? Don't they know rubber isn't gum?", "tts": "Monsters chewing tires? Don't they know rubber isn't gum?", "key": "monsterschewingtiresdonttheyknowrubberisntgum", "g": ""}, {"id": "f0086_narr", "role": "narr", "text": "In the letter, Téo says the village is fine and asks when Hero is coming back for more training.", "tts": "In the letter, Téo says the village is fine and asks when Hero is coming back for more training.", "key": "intheletterteosaysthevillageisfineandaskswhenheroiscomingbackformoretraining", "g": ""}, {"id": "f0087_narr", "role": "narr", "text": "In the shade of the rock there's a boot print, still clearly marked.", "tts": "In the shade of the rock there's a boot print, still clearly marked.", "key": "intheshadeoftherocktheresabootprintstillclearlymarked", "g": ""}, {"id": "f0088_narr", "role": "narr", "text": "It wasn't a ghost!", "tts": "It wasn't a ghost!", "key": "itwasntaghost", "g": ""}, {"id": "f0089_narr", "role": "narr", "text": "Ripplo waves from the water and swims off freely through the harbor.", "tts": "Ripplo waves from the water and swims off freely through the harbor.", "key": "ripplowavesfromthewaterandswimsofffreelythroughtheharbor", "g": ""}, {"id": "f0090_narr", "role": "narr", "text": "Téo sent it. The address just says: Hero, wherever he's helping someone.", "tts": "Téo sent it. The address just says: Hero, wherever he's helping someone.", "key": "teosentittheaddressjustsaysherowhereverheshelpingsomeone", "g": ""}, {"id": "f0091_narr", "role": "narr", "text": "The center support is whole, but it needs to be checked before fixing the plank.", "tts": "The center support is whole, but it needs to be checked before fixing the plank.", "key": "thecentersupportiswholebutitneedstobecheckedbeforefixingtheplank", "g": ""}, {"id": "f0092_narr", "role": "narr", "text": "The sky was ready. The table just needed setting.", "tts": "The sky was ready. The table just needed setting.", "key": "theskywasreadythetablejustneededsetting", "g": ""}, {"id": "f0093_narr", "role": "narr", "text": "A house drawing is carved on the wide end of the arrow.", "tts": "A house drawing is carved on the wide end of the arrow.", "key": "ahousedrawingiscarvedonthewideendofthearrow", "g": ""}, {"id": "f0094_narr", "role": "narr", "text": "Now the sea delivers letters too?", "tts": "Now the sea delivers letters too?", "key": "nowtheseadeliversletterstoo", "g": ""}, {"id": "f0095_narr", "role": "narr", "text": "The first marker has a red circle.", "tts": "The first marker has a red circle.", "key": "thefirstmarkerhasaredcircle", "g": ""}, {"id": "f0096_narr", "role": "narr", "text": "The second marker has a blue stripe.", "tts": "The second marker has a blue stripe.", "key": "thesecondmarkerhasabluestripe", "g": ""}, {"id": "f0097_narr", "role": "narr", "text": "The third marker has a yellow star. The order from the village is red, blue, yellow.", "tts": "The third marker has a yellow star. The order from the village is red, blue, yellow.", "key": "thethirdmarkerhasayellowstartheorderfromthevillageisredblueyellow", "g": ""}, {"id": "f0098_narr", "role": "narr", "text": "The brake test only happens with the wheel already attached.", "tts": "The brake test only happens with the wheel already attached.", "key": "thebraketestonlyhappenswiththewheelalreadyattached", "g": ""}, {"id": "f0099_narr", "role": "narr", "text": "The wind knocked down the sign at the fork. If we put it back wrong, the next traveler will end up in the lake.", "tts": "The wind knocked down the sign at the fork. If we put it back wrong, the next traveler will end up in the lake.", "key": "thewindknockeddownthesignattheforkifweputitbackwrongthenexttravelerwillendupinthelake", "g": ""}, {"id": "f0100_narr", "role": "narr", "text": "The wind read it first, but it didn't take the last page.", "tts": "The wind read it first, but it didn't take the last page.", "key": "thewindreaditfirstbutitdidnttakethelastpage", "g": ""}, {"id": "f0101_narr", "role": "narr", "text": "Thank you, mail carrier. The blue uniform is already yours.", "tts": "Thank you, mail carrier. The blue uniform is already yours.", "key": "thankyoumailcarriertheblueuniformisalreadyyours", "g": ""}, {"id": "f0102_narr", "role": "narr", "text": "Workshop saved! And no tire got chewed. Almost none.", "tts": "Workshop saved! And no tire got chewed. Almost none.", "key": "workshopsavedandnotiregotchewedalmostnone", "g": ""}, {"id": "f0103_narr", "role": "narr", "text": "Eight monsters? Easy! The hard part is getting them to sit still for you to draw.", "tts": "Eight monsters? Easy! The hard part is getting them to sit still for you to draw.", "key": "eightmonsterseasythehardpartisgettingthemtositstillforyoutodraw", "g": ""}, {"id": "f0104_narr", "role": "narr", "text": "The villagers gather. Over the observatory, the aurora crosses the sky in bands of color. For a moment, nobody needs to say anything.", "tts": "The villagers gather. Over the observatory, the aurora crosses the sky in bands of color. For a moment, nobody needs to say anything.", "key": "thevillagersgatherovertheobservatorytheauroracrossestheskyinbandsofcolorforamomentnobodyneedstosayanything", "g": ""}, {"id": "f0105_narr", "role": "narr", "text": "To go. And to come back.", "tts": "To go. And to come back.", "key": "togoandtocomeback", "g": ""}, {"id": "f0106_narr", "role": "narr", "text": "For me? I barely learned where the post office is!", "tts": "For me? I barely learned where the post office is!", "key": "formeibarelylearnedwherethepostofficeis", "g": ""}, {"id": "f0107_narr", "role": "narr", "text": "As a place to visit on purpose, it's still a great spot.", "tts": "As a place to visit on purpose, it's still a great spot.", "key": "asaplacetovisitonpurposeitsstillagreatspot", "g": ""}, {"id": "f0108_narr", "role": "narr", "text": "Looks like the wind wanted to join in too.", "tts": "Looks like the wind wanted to join in too.", "key": "lookslikethewindwantedtojoinintoo", "g": ""}, {"id": "f0109_narr", "role": "narr", "text": "Perfect! You have a knack for the workshop.", "tts": "Perfect! You have a knack for the workshop.", "key": "perfectyouhaveaknackfortheworkshop", "g": ""}, {"id": "f0110_narr", "role": "narr", "text": "A friend's gift! You can train me more often, Téo.", "tts": "A friend's gift! You can train me more often, Téo.", "key": "afriendsgiftyoucantrainmemoreoftenteo", "g": ""}, {"id": "f0111_narr", "role": "narr", "text": "First check what holds the bridge up. The test comes last.", "tts": "First check what holds the bridge up. The test comes last.", "key": "firstcheckwhatholdsthebridgeupthetestcomeslast", "g": ""}, {"id": "f0112_narr", "role": "narr", "text": "Look for two clues that belong to the explorer: the boot and the ribbon.", "tts": "Look for two clues that belong to the explorer: the boot and the ribbon.", "key": "lookfortwocluesthatbelongtotheexplorerthebootandtheribbon", "g": ""}, {"id": "f0113_narr", "role": "narr", "text": "Done. Now you can pull!", "tts": "Done. Now you can pull!", "key": "donenowyoucanpull", "g": ""}, {"id": "f0114_narr", "role": "narr", "text": "Done. Even I can follow this path without reading the map upside down.", "tts": "Done. Even I can follow this path without reading the map upside down.", "key": "doneevenicanfollowthispathwithoutreadingthemapupsidedown", "g": ""}, {"id": "f0115_narr", "role": "narr", "text": "That I should have stopped to look more often.", "tts": "That I should have stopped to look more often.", "key": "thatishouldhavestoppedtolookmoreoften", "g": ""}, {"id": "f0116_narr", "role": "narr", "text": "Whoever comes next will thank you without even knowing your name.", "tts": "Whoever comes next will thank you without even knowing your name.", "key": "whoevercomesnextwillthankyouwithoutevenknowingyourname", "g": ""}, {"id": "f0117_narr", "role": "narr", "text": "Gather, hang, and only then light.", "tts": "Gather, hang, and only then light.", "key": "gatherhangandonlythenlight", "g": ""}, {"id": "f0118_narr", "role": "narr", "text": "Remove the worn end, tighten the knot and only then test.", "tts": "Remove the worn end, tighten the knot and only then test.", "key": "removethewornendtightentheknotandonlythentest", "g": ""}, {"id": "f0119_narr", "role": "narr", "text": "Night patrol? I was already in my pajamas, Guard Bento!", "tts": "Night patrol? I was already in my pajamas, Guard Bento!", "key": "nightpatroliwasalreadyinmypajamasguardbento", "g": ""}, {"id": "f0120_narr", "role": "narr", "text": "Stealing a kid's bike? This Shadow Gang has no shame!", "tts": "Stealing a kid's bike? This Shadow Gang has no shame!", "key": "stealingakidsbikethisshadowganghasnoshame", "g": ""}, {"id": "f0121_narr", "role": "narr", "text": "If the stars are mixed up too, that'll be tough.", "tts": "If the stars are mixed up too, that'll be tough.", "key": "ifthestarsaremixeduptoothatllbetough", "g": ""}, {"id": "f0122_narr", "role": "narr", "text": "If it's the bridge asking for a vacation, we should listen.", "tts": "If it's the bridge asking for a vacation, we should listen.", "key": "ifitsthebridgeaskingforavacationweshouldlisten", "g": ""}, {"id": "f0123_narr", "role": "narr", "text": "Finish what you're doing and go back to the map: your friend's room opens by itself.", "tts": "Finish what you're doing and go back to the map: your friend's room opens by itself.", "key": "finishwhatyouredoingandgobacktothemapyourfriendsroomopensbyitself", "g": ""}, {"id": "f0124_narr", "role": "narr", "text": "Every time someone steps on the bridge, I hear three weird knocks.", "tts": "Every time someone steps on the bridge, I hear three weird knocks.", "key": "everytimesomeonestepsonthebridgeihearthreeweirdknocks", "g": ""}, {"id": "f0125_tonho", "role": "tonho", "text": "The Pugmin here climbs const AVOID=/^$/;const AV=x=>AVOID.test(x.name||"");
let TOCANDO=null;function toca(u){try{if(TOCANDO){TOCANDO.pause();TOCANDO.currentTime=0;}}catch(e){}TOCANDO=new Audio(u);TOCANDO.play().catch(()=>{});}
const API='https://api.elevenlabs.io';
let KEY='',MINE=[],CAND={},CAST={},AUD={},stop=false,added={};
const $=id=>document.getElementById(id);
const ls={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}},del(k){try{localStorage.removeItem(k)}catch(e){}}};
const st=(t,err)=>{$('st').innerHTML=err?'<span class="err">'+t+'</span>':t;};
async function api(path,opt={}){const r=await fetch(API+path,{...opt,headers:{'xi-api-key':KEY,...(opt.body?{'Content-Type':'application/json'}:{}),...(opt.headers||{})}});
  if(!r.ok){let t='';try{t=await r.text()}catch(e){}throw new Error(r.status+' '+t.slice(0,240));}return r;}
async function credits(){try{const s=await (await api('/v1/user/subscription')).json();$('cred').textContent='Créditos: '+(s.character_limit-s.character_count).toLocaleString('pt-BR')+' sobrando de '+s.character_limit.toLocaleString('pt-BR')+' (plano '+s.tier+')';}catch(e){$('cred').textContent='';}}
$('key').value=ls.get('cv_el_key')||'';
$('bLoad').onclick=async()=>{KEY=$('key').value.trim();if(!KEY){st('Cole a chave primeiro.',1);return;}
  if($('lembrar').checked)ls.set('cv_el_key',KEY);else ls.del('cv_el_key');
  st('Carregando vozes...');try{
    MINE=(await (await api('/v1/voices')).json()).voices||[];
    for(const r of ROLES){CAND[r.id]=[];
      if(r.mine){const nn=x=>x.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');const v=MINE.find(v=>nn(v.name).startsWith(nn(r.mine)));if(v)CAND[r.id].push({id:v.voice_id,name:v.name,prev:v.preview_url,mine:1});}
      if(r.q){const tries=[...(r.s||[]).map(w=>({language:'en',gender:r.q.gender,age:r.q.age,search:w})),...(r.s||[]).map(w=>({language:'en',gender:r.q.gender,search:w})),{language:'en',...r.q},{language:'en',gender:r.q.gender}];const seen=new Set();
        for(const t of tries){if(CAND[r.id].filter(c=>!c.mine).length>=8)break;const q=new URLSearchParams({page_size:'20',sort:'usage_character_count_1y',...t});
          try{let vs=(await (await api('/v1/shared-voices?'+q)).json()).voices||[];
            vs=vs.filter(v=>(!v.language||/^en/i.test(v.language))&&/american|british|standard|us|uk|en-/i.test((v.accent||'')+' '+(v.locale||''))&&!/indian|hindi|african|nigeria|arab/i.test((v.accent||'')+' '+(v.description||'')));
            
            for(const v of vs){if(seen.has(v.voice_id))continue;seen.add(v.voice_id);CAND[r.id].push({id:v.voice_id,owner:v.public_owner_id,name:v.name.split(' - ')[0]+' · '+(v.accent||v.locale||'pt')+(v.description?' — '+v.description.slice(0,40):''),prev:v.preview_url});}}catch(e){console.warn(e);}}}
      {const ex=MINE.filter(v=>!CAND[r.id].some(c=>c.id===v.voice_id)&&!/premade/i.test(v.category||'')).map(v=>({id:v.voice_id,name:'(minha) '+v.name,prev:v.preview_url,mine:1,extra:1}));const k=CAND[r.id].findIndex(c=>!c.mine);CAND[r.id].splice(k<0?CAND[r.id].length:k,0,...ex);}
    }
    for(const k in CAND){if((ROLES.find(r=>r.id===k)||{}).mine)continue;const ok=CAND[k].filter(x=>!AV(x));if(ok.length)CAND[k]=ok;}drawCast();drawLines();credits();$('bRec').disabled=false;st('Pronto. Escute as vozes (▶), troque se quiser e toque em Gravar tudo.');
  }catch(e){st('Não consegui entrar: '+e.message,1);}};
function drawCast(){const saved=JSON.parse(ls.get('cv_el_cast_en')||'{}');const used=new Set();const box=$('cast');box.innerHTML='';
  const HID=JSON.parse(ls.get('cv_el_hide')||'[]');for(const r of ROLES){const c=(CAND[r.id]||[]).filter(x=>!HID.includes(x.id));let pick=(r.mine&&c.find(x=>x.mine&&x.name.replace(/^\(minha\) /,'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').startsWith(r.mine.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,''))))||c.find(x=>x.id===saved[r.id])||c.find(x=>!x.extra&&!used.has(x.id)&&!AV(x))||c.find(x=>!x.extra&&!AV(x))||c.find(x=>!x.extra&&!used.has(x.id))||c[0];
    if(pick)used.add(pick.id);CAST[r.id]=pick;
    const d=document.createElement('div');d.className='role';d.innerHTML='<b>'+r.nome+'</b>';const s=document.createElement('select');
    c.forEach((x,i)=>{const o=document.createElement('option');o.value=i;o.textContent=x.name;if(x===pick)o.selected=true;s.append(o);});
    s.onchange=()=>{CAST[r.id]=c[s.value];const sv=JSON.parse(ls.get('cv_el_cast_en')||'{}');sv[r.id]=CAST[r.id].id;ls.set('cv_el_cast_en',JSON.stringify(sv));};
    const p=document.createElement('button');p.className='sec mini';p.textContent='▶';p.onclick=()=>{const x=CAST[r.id];if(x&&x.prev)toca(x.prev);};
    const h=document.createElement('button');h.className='sec mini';h.textContent='🚫';h.title='Voz ruim: tirar da lista';h.onclick=()=>{const x=CAST[r.id];if(!x)return;const L=JSON.parse(ls.get('cv_el_hide')||'[]');L.push(x.id);ls.set('cv_el_hide',JSON.stringify(L));const sv=JSON.parse(ls.get('cv_el_cast_en')||'{}');delete sv[r.id];ls.set('cv_el_cast_en',JSON.stringify(sv));drawCast();};d.append(s,p,h);box.append(d);}}
function drawLines(){const box=$('lines');box.innerHTML='';for(const l of LINES){const d=document.createElement('div');d.className='ln';d.id='l_'+l.id;
  d.innerHTML='<span class="ic">'+(AUD[l.id]?'<span class="ok">✓</span>':'·')+'</span><div><small>'+(ROLES.find(r=>r.id===l.role)||{}).nome+'</small>'+l.text.replace(/</g,'&lt;')+'</div>';
  const bt=document.createElement('div');bt.className='row';bt.style.margin='0';const p=document.createElement('button');p.className='sec mini';p.textContent='▶';p.onclick=()=>{if(AUD[l.id])toca(URL.createObjectURL(AUD[l.id]));};
  const r=document.createElement('button');r.className='sec mini';r.textContent='↻';r.title='Gravar de novo';r.onclick=async()=>{r.disabled=true;try{await gen(l);credits();}catch(e){st(e.message,1);}r.disabled=false;};
  bt.append(p,r);d.append(bt);box.append(d);}}
async function ensure(v){if(!v||v.mine||!v.owner||added[v.id])return;try{await api('/v1/voices/add/'+v.owner+'/'+v.id,{method:'POST',body:JSON.stringify({new_name:v.name.split(' — ')[0]})});}catch(e){console.warn('add',e.message);}added[v.id]=1;}
let MODEL='eleven_v3';
async function gen(l){const v=CAST[l.role];if(!v)throw new Error('Sem voz para '+l.role);await ensure(v);
  let text=l.tts;if(MODEL!=='eleven_v3')text=text.replace(/\[[^\]]*\]\s*/g,'');
  let r;try{r=await api('/v1/text-to-speech/'+v.id+'?output_format=mp3_44100_64',{method:'POST',body:JSON.stringify({text,model_id:MODEL})});}
  catch(e){if(MODEL==='eleven_v3'&&/model/i.test(e.message)){MODEL='eleven_multilingual_v2';return gen(l);}throw e;}
  AUD[l.id]=await r.blob();const ic=document.querySelector('#l_'+l.id+' .ic');if(ic)ic.innerHTML='<span class="ok">✓</span>';$('bZip').disabled=false;}
$('bRec').onclick=async()=>{stop=false;$('bRec').disabled=true;$('bStop').disabled=false;const todo=LINES.filter(l=>!AUD[l.id]);$('pg').max=LINES.length;
  for(const l of todo){if(stop)break;st('Gravando '+(Object.keys(AUD).length+1)+' de '+LINES.length+'...');
    let ok=0;for(let t=0;t<3&&!ok;t++){try{await gen(l);ok=1;}catch(e){if(t===2){st('Erro na fala "'+l.text.slice(0,40)+'": '+e.message,1);stop=true;}else await new Promise(r=>setTimeout(r,2000*(t+1)));}}
    $('pg').value=Object.keys(AUD).length;}
  $('bRec').disabled=false;$('bStop').disabled=true;credits();
  if(Object.keys(AUD).length===LINES.length)st('Pronto! Toque em Baixar ZIP e mande o arquivo para o Claude.');};
$('bStop').onclick=()=>{stop=true;};
$('bZip').onclick=async()=>{const z=new JSZip();const man=[];for(const l of LINES){if(!AUD[l.id])continue;z.file(l.id+'.mp3',AUD[l.id]);man.push({...l,voz:(CAST[l.role]||{}).name,modelo:MODEL});}
  z.file('manifest.json',JSON.stringify(man,null,1));const b=await z.generateAsync({type:'blob'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='vozes_ingles_parte2.zip';document.body.append(a);a.click();a.remove();};
