<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gravador da História</title>
<script src="jszip.min.js"></script>
<style>
:root{--bg:#f6f1e6;--card:#fff;--ink:#2b2418;--mut:#6d6250;--ac:#2f7a36;--bd:#ddd2bd;--err:#b3261e}
@media (prefers-color-scheme:dark){:root{--bg:#1c1a16;--card:#27241f;--ink:#f1eadb;--mut:#b3a88f;--ac:#6cc070;--bd:#3d382f;--err:#ff8a80}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,sans-serif}
main{max-width:760px;margin:0 auto;padding:16px}
h1{font-size:22px;margin:4px 0 2px}p.s{margin:0 0 14px;color:var(--mut)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin:0 0 14px}
.card h2{font-size:16px;margin:0 0 10px}
input,select,button{font:inherit}input[type=password],input[type=text]{width:100%;padding:10px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--ink)}
button{padding:10px 14px;border:0;border-radius:10px;background:var(--ac);color:#fff;font-weight:600;cursor:pointer}
button.sec{background:transparent;color:var(--ink);border:1px solid var(--bd)}button:disabled{opacity:.45}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:8px 0}
.role{display:grid;grid-template-columns:90px 1fr auto;gap:8px;align-items:center;padding:6px 0;border-top:1px solid var(--bd)}
.role:first-of-type{border-top:0}.role b{font-size:14px}.role select{width:100%;padding:8px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--ink);min-width:0}
.mini{padding:6px 10px;font-size:14px}
#st{white-space:pre-wrap;color:var(--mut);font-size:14px}.err{color:var(--err)}
.ln{display:grid;grid-template-columns:22px 1fr auto;gap:8px;align-items:start;padding:7px 0;border-top:1px solid var(--bd);font-size:14px}
.ln small{color:var(--mut);display:block}.ok{color:var(--ac)}
progress{width:100%;height:14px}
</style></head><body><main>
<h1>Gravador da História</h1>
<p class="s">Capturadores do Vale · Tutorial com o Tio Felipe · 76 falas · ~5.658 letras (créditos)</p>

<div class="card"><h2>1. Sua chave da ElevenLabs</h2>
<input id="key" type="password" placeholder="Cole aqui a API key (sk_...)" autocomplete="off">
<div class="row"><label><input id="lembrar" type="checkbox" checked> lembrar neste aparelho</label><button id="bLoad">Entrar</button></div>
<div id="cred" class="s"></div>
<p class="s" style="font-size:13px">A chave fica só neste navegador. Ela não é enviada para ninguém além da ElevenLabs.</p></div>

<div class="card"><h2>2. Vozes de cada personagem</h2><div id="cast"><p class="s">Entre primeiro com a chave.</p></div></div>

<div class="card"><h2>3. Gravar</h2>
<div class="row"><button id="bRec" disabled>Gravar tudo</button><button id="bZip" class="sec" disabled>Baixar ZIP</button><button id="bStop" class="sec" disabled>Parar</button></div>
<progress id="pg" value="0" max="1"></progress><div id="st"></div>
<div id="lines"></div></div>
</main>
<script>
const LINES=[{"id": "401_areia2", "role": "areia2", "text": "As dunas sussurram seu nome... Lute comigo!", "tts": "As dunas sussurram seu nome... Lute comigo!", "key": "asdunassussurramseunomelutecomigo", "g": ""}, {"id": "402_areia2", "role": "areia2", "text": "As dunas tinham razão sobre você.", "tts": "As dunas tinham razão sobre você.", "key": "asdunastinhamrazaosobrevoce", "g": ""}, {"id": "449_capitao2", "role": "capitao2", "text": "Aguente a HORDA mais uma vez e eu te dou um prêmio de capitão!", "tts": "Aguente a HORDA mais uma vez e eu te dou um prêmio de capitão!", "key": "aguenteahordamaisumavezeeutedouumpremiodecapitao", "g": ""}, {"id": "450_capitao2", "role": "capitao2", "text": "Ah! Com essa medalha os guardas deixam você passar pra ROTA 3 · DUNAS DO SOL, a leste do Lago Azul. Cuidado com o calor!", "tts": "Ah! Com essa medalha os guardas deixam você passar pra ROTA 3 · DUNAS DO SOL, a leste do Lago Azul. Cuidado com o calor!", "key": "ahcomessamedalhaosguardasdeixamvocepassarprarotadunasdosolalestedolagoazulcuidadocomocalor", "g": ""}, {"id": "451_capitao2", "role": "capitao2", "text": "Ahoy! O mar hoje está calmo como um Marolo dormindo.", "tts": "Ahoy! O mar hoje está calmo como um Marolo dormindo.", "key": "ahoyomarhojeestacalmocomoummarolodormindo", "g": ""}, {"id": "452_capitao2", "role": "capitao2", "text": "Alguém atiçou eles. Segura essa HORDA comigo, marujo!", "tts": "Alguém atiçou eles. Segura essa HORDA comigo, marujo!", "key": "alguematicouelesseguraessahordacomigomarujo", "g": ""}, {"id": "453_capitao2", "role": "capitao2", "text": "Contarei sua história em todos os portos!", "tts": "Contarei sua história em todos os portos!", "key": "contareisuahistoriaemtodososportos", "g": ""}, {"id": "454_capitao2", "role": "capitao2", "text": "Isso que é marujo! Toma, um presente do porto.", "tts": "Isso que é marujo! Toma, um presente do porto.", "key": "issoqueemarujotomaumpresentedoporto", "g": ""}, {"id": "455_capitao2", "role": "capitao2", "text": "Já enfrentei uma onda do tamanho de um farol!", "tts": "Já enfrentei uma onda do tamanho de um farol!", "key": "jaenfrenteiumaondadotamanhodeumfarol", "g": ""}, {"id": "456_capitao2", "role": "capitao2", "text": "Marujo valente! Você tem lugar no meu navio.", "tts": "Marujo valente! Você tem lugar no meu navio.", "key": "marujovalentevocetemlugarnomeunavio", "g": ""}, {"id": "457_capitao2", "role": "capitao2", "text": "Marujo! Os monstrinhos do mar voltaram a encher o cais.", "tts": "Marujo! Os monstrinhos do mar voltaram a encher o cais.", "key": "marujoosmonstrinhosdomarvoltaramaencherocais", "g": ""}, {"id": "458_capitao2", "role": "capitao2", "text": "Meu imediato de confiança!", "tts": "Meu imediato de confiança!", "key": "meuimediatodeconfianca", "g": ""}, {"id": "459_capitao2", "role": "capitao2", "text": "O Bando Sombra tentou roubar meu barco. Ninguém rouba o Capitão!", "tts": "O Bando Sombra tentou roubar meu barco. Ninguém rouba o Capitão!", "key": "obandosombratentouroubarmeubarconinguemroubaocapitao", "g": ""}, {"id": "460_capitao2", "role": "capitao2", "text": "Pelas barbas do Marolo! Uma horda de monstrinhos está saindo do mar!", "tts": "Pelas barbas do Marolo! Uma horda de monstrinhos está saindo do mar!", "key": "pelasbarbasdomaroloumahordademonstrinhosestasaindodomar", "g": ""}, {"id": "461_capitao2", "role": "capitao2", "text": "Quase! Respire e tente de novo.", "tts": "Quase! Respire e tente de novo.", "key": "quaserespireetentedenovo", "g": ""}, {"id": "462_capitao2", "role": "capitao2", "text": "Recuar não é desistir! Prepare-se e volte.", "tts": "Recuar não é desistir! Prepare-se e volte.", "key": "recuarnaoedesistirprepareseevolte", "g": ""}, {"id": "463_capitao2", "role": "capitao2", "text": "Vitória! Achei isso num barco do Bando: um mapa do Bosque Sombrio...", "tts": "Vitória! Achei isso num barco do Bando: um mapa do Bosque Sombrio...", "key": "vitoriaacheiissonumbarcodobandoummapadobosquesombrio", "g": ""}, {"id": "464_capitao2", "role": "capitao2", "text": "Volte amanhã pra revanche, marujo!", "tts": "Volte amanhã pra revanche, marujo!", "key": "volteamanhaprarevanchemarujo", "g": ""}, {"id": "474_corvo2", "role": "corvo2", "text": "Com o fogo deste vulcão vou acordar o Aurorion e prender a aurora pra sempre! O Vale será do BANDO SOMBRA!", "tts": "Com o fogo deste vulcão vou acordar o Aurorion e prender a aurora pra sempre! O Vale será do BANDO SOMBRA!", "key": "comofogodestevulcaovouacordaroaurorioneprenderaauroraprasempreovaleseradobandosombra", "g": ""}, {"id": "475_corvo2", "role": "corvo2", "text": "Então você é o famoso treinador que derrotou meus capangas.", "tts": "Então você é o famoso treinador que derrotou meus capangas.", "key": "entaovoceeofamosotreinadorquederrotoumeuscapangas", "g": ""}, {"id": "476_corvo2", "role": "corvo2", "text": "Impossível... meus cristais...!", "tts": "Impossível... meus cristais...!", "key": "impossivelmeuscristais", "g": ""}, {"id": "477_corvo2", "role": "corvo2", "text": "Não! Os cristais estão rachando!", "tts": "Não! Os cristais estão rachando!", "key": "naooscristaisestaorachando", "g": ""}, {"id": "478_corvo2", "role": "corvo2", "text": "Não... não pode ser!", "tts": "Não... não pode ser!", "key": "naonaopodeser", "g": ""}, {"id": "479_corvo2", "role": "corvo2", "text": "Os cristais já estão prendendo o Aurorion. Com a luz dele, o Bando Sombra vai mandar no Vale pra sempre!", "tts": "Os cristais já estão prendendo o Aurorion. Com a luz dele, o Bando Sombra vai mandar no Vale pra sempre!", "key": "oscristaisjaestaoprendendooaurorioncomaluzdeleobandosombravaimandarnovaleprasempre", "g": ""}, {"id": "480_corvo2", "role": "corvo2", "text": "Se quer ele de volta... venha pegar!", "tts": "Se quer ele de volta... venha pegar!", "key": "sequereledevoltavenhapegar", "g": ""}, {"id": "481_corvo2", "role": "corvo2", "text": "Você de novo?! Chegou tarde, guardião.", "tts": "Você de novo?! Chegou tarde, guardião.", "key": "vocedenovochegoutardeguardiao", "g": ""}, {"id": "482_corvo2", "role": "corvo2", "text": "Você venceu... mas já é tarde! Eu acordei o vulcão! Ha ha ha!", "tts": "Você venceu... mas já é tarde! Eu acordei o vulcão! Ha ha ha!", "key": "vocevenceumasjaetardeeuacordeiovulcaohahaha", "g": ""}, {"id": "517_iara2", "role": "iara2", "text": "Achei pegadas de um monstrinho ANTIGO aqui nas dunas!", "tts": "Achei pegadas de um monstrinho ANTIGO aqui nas dunas!", "key": "acheipegadasdeummonstrinhoantigoaquinasdunas", "g": ""}, {"id": "543_iara2", "role": "iara2", "text": "Acho que tem um fóssil enterrado lá no canto sudeste, perto das pedras. Procura o brilho na areia?", "tts": "Acho que tem um fóssil enterrado lá no canto sudeste, perto das pedras. Procura o brilho na areia?", "key": "achoquetemumfossilenterradolanocantosudestepertodaspedrasprocuraobrilhonaareia", "g": ""}, {"id": "544_iara2", "role": "iara2", "text": "O deserto guarda muitos segredos. Um dia eu acho a Gruta do Eco!", "tts": "O deserto guarda muitos segredos. Um dia eu acho a Gruta do Eco!", "key": "odesertoguardamuitossegredosumdiaeuachoagrutadoeco", "g": ""}, {"id": "545_iara2", "role": "iara2", "text": "Uau! Isso é de um monstrinho de Pedra de milhares de anos atrás! Toma, pela ajuda.", "tts": "Uau! Isso é de um monstrinho de Pedra de milhares de anos atrás! Toma, pela ajuda.", "key": "uauissoedeummonstrinhodepedrademilharesdeanosatrastomapelaajuda", "g": ""}, {"id": "584_capitao2", "role": "capitao2", "text": "Enquanto o lago não ficar limpo, os caixotes do porto ficam aqui na estrada.", "tts": "Enquanto o lago não ficar limpo, os caixotes do porto ficam aqui na estrada.", "key": "enquantoolagonaoficarlimpooscaixotesdoportoficamaquinaestrada", "g": ""}, {"id": "585_capitao2", "role": "capitao2", "text": "Ninguém passa! Uns bandidos sujaram o Lago Azul e espantaram os peixes...", "tts": "Ninguém passa! Uns bandidos sujaram o Lago Azul e espantaram os peixes...", "key": "ninguempassaunsbandidossujaramolagoazuleespantaramospeixes", "g": ""}, {"id": "630_areia2", "role": "areia2", "text": "O deserto é meu lar! Vamos ver se você aguenta o calor!", "tts": "O deserto é meu lar! Vamos ver se você aguenta o calor!", "key": "odesertoemeularvamosversevoceaguentaocalor", "g": ""}, {"id": "631_areia2", "role": "areia2", "text": "Ufa... você é mais quente que o deserto!", "tts": "Ufa... você é mais quente que o deserto!", "key": "ufavoceemaisquentequeodeserto", "g": ""}];
const ROLES=[{"id": "capitao2", "nome": "Capitão Marés (voz nova)", "q": {"gender": "male", "age": "old"}, "s": ["pirata", "capitão", "rouca", "marinheiro", "pirate", "raspy", "gruff"]}, {"id": "corvo2", "nome": "Chefe Corvo (voz nova)", "q": {"gender": "male", "age": "middle_aged"}, "s": ["vilão", "villain", "sombrio", "assustador", "menacing", "dark", "evil"]}, {"id": "iara2", "nome": "Iara (voz nova)", "q": {"gender": "female", "age": "young"}, "s": ["aventureira", "jovem", "animada", "energetic"]}, {"id": "areia2", "nome": "Areia (voz nova)", "q": {"gender": "male", "age": "young"}, "s": ["jovem", "desafiador", "confiante", "energetic"]}];
const AVOID=/^(\(minha\) )?(will|roberta|borges|diego|elvis|luciano|cirilo|keren|raquel|fernanda|jonas|amandoca|ana dias|paulo|bianca|lucas|marianne|victor power|edna|lucinda|noel natal|adriano|marcelo lucas|lendário|lax|carla|sergio|wesley bessa|yasmin|moutella|fernando borges|felipe)\b/i;const AV=x=>AVOID.test(x.name||"");
const API='https://api.elevenlabs.io';
let KEY='',MINE=[],CAND={},CAST={},AUD={},stop=false,added={};
const $=id=>document.getElementById(id);
const ls={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}},del(k){try{localStorage.removeItem(k)}catch(e){}}};
const st=(t,err)=>{$('st').innerHTML=err?'<span class="err">'+t+'</span>':t;};
async function api(path,opt={}){const r=await fetch(API+path,{...opt,headers:{'xi-api-key':KEY,...(opt.body?{'Content-Type':'application/json'}:{}),...(opt.headers||{})}});
  if(!r.ok){let t='';try{t=await r.text()}catch(e){}throw new Error(r.status+' '+t.slice(0,240));}return r;}
async function credits(){try{const s=await (await api('/v1/user/subscription')).json();$('cred').textContent='Créditos: '+(s.character_limit-s.character_count).toLocaleString('pt-BR')+' sobrando de '+s.character_limit.toLocaleString('pt-BR')+' (plano '+s.tier+')';}catch(e){$('cred').textContent='';}}
$('key').value=ls.get('cv_el_key')||'';
$('bLoad').onclick=async()=>{KEY=$('key').value.trim();if(!KEY){st('Cole a chave primeiro.',1);return;}
  if($('lembrar').checked)ls.set('cv_el_key',KEY);else ls.del('cv_el_key');
  st('Carregando vozes...');try{
    MINE=(await (await api('/v1/voices')).json()).voices||[];
    for(const r of ROLES){CAND[r.id]=[];
      if(r.mine){const v=MINE.find(v=>v.name.toLowerCase().startsWith(r.mine.toLowerCase()));if(v)CAND[r.id].push({id:v.voice_id,name:v.name,prev:v.preview_url,mine:1});}
      if(r.q){const tries=[...(r.s||[]).map(w=>({language:'pt',gender:r.q.gender,search:w})),...(r.kid?(r.q.gender==='male'?['menino','criança','infantil','child','boy','kid']:['menina','criança','infantil','child','girl','kid']).map(w=>({language:'pt',gender:r.q.gender,search:w})):[]),{language:'pt',locale:'pt-BR',...r.q},{language:'pt',...r.q},{language:'pt',gender:r.q.gender,age:r.q.age},{language:'pt',gender:r.q.gender}];const seen=new Set();
        for(const t of tries){if(CAND[r.id].filter(c=>!c.mine).length>=8)break;const q=new URLSearchParams({page_size:'20',sort:'usage_character_count_1y',...t});
          try{let vs=(await (await api('/v1/shared-voices?'+q)).json()).voices||[];
            vs=vs.filter(v=>/bra[sz]il|pt-br/i.test((v.accent||'')+' '+(v.locale||''))&&(!v.language||/^pt/i.test(v.language))&&!/indian|hindi|india|african|nigeria|american|british|spanish|mexic/i.test((v.accent||'')+' '+(v.description||'')+' '+v.name));
            vs.sort((a,b)=>(/bra[sz]il|pt-br/i.test((b.accent||'')+(b.locale||''))?1:0)-(/bra[sz]il|pt-br/i.test((a.accent||'')+(a.locale||''))?1:0));
            for(const v of vs){if(seen.has(v.voice_id))continue;seen.add(v.voice_id);CAND[r.id].push({id:v.voice_id,owner:v.public_owner_id,name:v.name.split(' - ')[0]+' · '+(v.accent||v.locale||'pt')+(v.description?' — '+v.description.slice(0,40):''),prev:((v.verified_languages||[]).find(x=>/pt-br|bra[sz]il/i.test((x.locale||'')+(x.accent||''))&&x.preview_url)||{}).preview_url||v.preview_url});}}catch(e){console.warn(e);}}}
      {const ex=MINE.filter(v=>!CAND[r.id].some(c=>c.id===v.voice_id)&&!/premade/i.test(v.category||'')).map(v=>({id:v.voice_id,name:'(minha) '+v.name,prev:v.preview_url,mine:1,extra:1}));const k=CAND[r.id].findIndex(c=>!c.mine);CAND[r.id].splice(k<0?CAND[r.id].length:k,0,...ex);}
    }
    drawCast();drawLines();credits();$('bRec').disabled=false;st('Pronto. Escute as vozes (▶), troque se quiser e toque em Gravar tudo.');
  }catch(e){st('Não consegui entrar: '+e.message,1);}};
function drawCast(){const saved=JSON.parse(ls.get('cv_el_cast')||'{}');const used=new Set();const box=$('cast');box.innerHTML='';
  for(const r of ROLES){const c=CAND[r.id]||[];let pick=c.find(x=>x.id===saved[r.id])||(r.mine&&c.find(x=>x.mine&&x.name.replace(/^\(minha\) /,'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').startsWith(r.mine.toLowerCase())))||c.find(x=>!x.extra&&!used.has(x.id)&&!AV(x))||c.find(x=>!x.extra&&!AV(x))||c.find(x=>!x.extra&&!used.has(x.id))||c[0];
    if(pick)used.add(pick.id);CAST[r.id]=pick;
    const d=document.createElement('div');d.className='role';d.innerHTML='<b>'+r.nome+'</b>';const s=document.createElement('select');
    c.forEach((x,i)=>{const o=document.createElement('option');o.value=i;o.textContent=x.name;if(x===pick)o.selected=true;s.append(o);});
    s.onchange=()=>{CAST[r.id]=c[s.value];const sv=JSON.parse(ls.get('cv_el_cast')||'{}');sv[r.id]=CAST[r.id].id;ls.set('cv_el_cast',JSON.stringify(sv));};
    const p=document.createElement('button');p.className='sec mini';p.textContent='▶';p.onclick=()=>{const x=CAST[r.id];if(x&&x.prev)new Audio(x.prev).play();};
    d.append(s,p);box.append(d);}}
function drawLines(){const box=$('lines');box.innerHTML='';for(const l of LINES){const d=document.createElement('div');d.className='ln';d.id='l_'+l.id;
  d.innerHTML='<span class="ic">'+(AUD[l.id]?'<span class="ok">✓</span>':'·')+'</span><div><small>'+(ROLES.find(r=>r.id===l.role)||{}).nome+'</small>'+l.text.replace(/</g,'&lt;')+'</div>';
  const bt=document.createElement('div');bt.className='row';bt.style.margin='0';const p=document.createElement('button');p.className='sec mini';p.textContent='▶';p.onclick=()=>{if(AUD[l.id])new Audio(URL.createObjectURL(AUD[l.id])).play();};
  const r=document.createElement('button');r.className='sec mini';r.textContent='↻';r.title='Gravar de novo';r.onclick=async()=>{r.disabled=true;try{await gen(l);credits();}catch(e){st(e.message,1);}r.disabled=false;};
  bt.append(p,r);d.append(bt);box.append(d);}}
async function ensure(v){if(!v||v.mine||!v.owner||added[v.id])return;try{await api('/v1/voices/add/'+v.owner+'/'+v.id,{method:'POST',body:JSON.stringify({new_name:v.name.split(' — ')[0]})});}catch(e){console.warn('add',e.message);}added[v.id]=1;}
let MODEL='eleven_v3';
async function gen(l){const v=CAST[l.role];if(!v)throw new Error('Sem voz para '+l.role);await ensure(v);
  let text=l.tts;if(MODEL!=='eleven_v3')text=text.replace(/\[[^\]]*\]\s*/g,'');
  let r;try{r=await api('/v1/text-to-speech/'+v.id+'?output_format=mp3_44100_64',{method:'POST',body:JSON.stringify({text,model_id:MODEL})});}
  catch(e){if(MODEL==='eleven_v3'&&/model/i.test(e.message)){MODEL='eleven_multilingual_v2';return gen(l);}throw e;}
  AUD[l.id]=await r.blob();const ic=document.querySelector('#l_'+l.id+' .ic');if(ic)ic.innerHTML='<span class="ok">✓</span>';$('bZip').disabled=false;}
$('bRec').onclick=async()=>{stop=false;$('bRec').disabled=true;$('bStop').disabled=false;const todo=LINES.filter(l=>!AUD[l.id]);$('pg').max=LINES.length;
  for(const l of todo){if(stop)break;st('Gravando '+(Object.keys(AUD).length+1)+' de '+LINES.length+'...');
    let ok=0;for(let t=0;t<3&&!ok;t++){try{await gen(l);ok=1;}catch(e){if(t===2){st('Erro na fala "'+l.text.slice(0,40)+'": '+e.message,1);stop=true;}else await new Promise(r=>setTimeout(r,2000*(t+1)));}}
    $('pg').value=Object.keys(AUD).length;}
  $('bRec').disabled=false;$('bStop').disabled=true;credits();
  if(Object.keys(AUD).length===LINES.length)st('Pronto! Toque em Baixar ZIP e mande o arquivo para o Claude.');};
$('bStop').onclick=()=>{stop=true;};
