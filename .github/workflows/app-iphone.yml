name: app-iphone
# Monta o app do iPhone (Capacitor) numa máquina Mac do GitHub e manda pro TestFlight.
# Segredos (GitHub > Settings > Secrets > Actions): ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8 (conteúdo do .p8). Team ID NP5JBSPVUY já está no arquivo.
on:
  workflow_dispatch:
    inputs:
      build: {description: "número do build (sobe 1 a cada envio)", required: true, default: "1"}
jobs:
  ios:
    runs-on: macos-latest
    defaults: {run: {working-directory: app-ios}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: npm install --legacy-peer-deps && npm run www
      - run: npx cap add ios || true
      - run: npx cap sync ios
      - name: Ícone (Trovim evoluído, aprovado pelo Felipe 15/nov)
        run: |
          D=ios/App/App/Assets.xcassets/AppIcon.appiconset
          ls $D
          for f in $D/*.png; do w=$(sips -g pixelWidth "$f" | awk '/pixelWidth/{print $2}'); cp icone/AppIcon-1024.png "$f"; sips -z $w $w "$f" >/dev/null; done
          sips -g pixelWidth -g pixelHeight $D/*.png
      - name: Chave da App Store Connect
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo "${{ secrets.ASC_KEY_P8 }}" > ~/.appstoreconnect/private_keys/AuthKey_${{ secrets.ASC_KEY_ID || '9HYCAW3MQK' }}.p8
      - name: Versão
        run: |
          cd ios/App
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${{ inputs.build }}" App/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString 1.0.0" App/Info.plist
          /usr/libexec/PlistBuddy -c "Add :ITSAppUsesNonExemptEncryption bool false" App/Info.plist || true
          /usr/libexec/PlistBuddy -c "Delete :UIStatusBarHidden" App/Info.plist || true
          /usr/libexec/PlistBuddy -c "Add :UIStatusBarHidden bool true" App/Info.plist
          /usr/libexec/PlistBuddy -c "Delete :UIViewControllerBasedStatusBarAppearance" App/Info.plist || true
          /usr/libexec/PlistBuddy -c "Add :UIViewControllerBasedStatusBarAppearance bool false" App/Info.plist
          /usr/libexec/PlistBuddy -c "Add :GADApplicationIdentifier string ca-app-pub-9482139825936910~5086255730" App/Info.plist || true
          /usr/libexec/PlistBuddy -c "Add :NSUserTrackingUsageDescription string 'Usamos isso para mostrar anúncios mais do seu interesse nos vídeos com prêmio.'" App/Info.plist || true
          /usr/libexec/PlistBuddy -c "Add :SKAdNetworkItems array" App/Info.plist || true
          /usr/libexec/PlistBuddy -c "Add :SKAdNetworkItems:0 dict" App/Info.plist || true
          /usr/libexec/PlistBuddy -c "Add :SKAdNetworkItems:0:SKAdNetworkIdentifier string cstr6suwn9.skadnetwork" App/Info.plist || true
          /usr/libexec/PlistBuddy -c "Add :GADApplicationIdentifier string ca-app-pub-9482139825936910~5086255730" App/Info.plist || true
          /usr/libexec/PlistBuddy -c "Add :NSUserTrackingUsageDescription string 'Usamos isso para mostrar anúncios mais do seu interesse nos vídeos com prêmio.'" App/Info.plist || true
          /usr/libexec/PlistBuddy -c "Add :SKAdNetworkItems array" App/Info.plist || true
          /usr/libexec/PlistBuddy -c "Add :SKAdNetworkItems:0 dict" App/Info.plist || true
          /usr/libexec/PlistBuddy -c "Add :SKAdNetworkItems:0:SKAdNetworkIdentifier string cstr6suwn9.skadnetwork" App/Info.plist || true
      - name: Montar e enviar
        run: |
          cd ios/App
          AUTH="-allowProvisioningUpdates -authenticationKeyPath $HOME/.appstoreconnect/private_keys/AuthKey_${{ secrets.ASC_KEY_ID || '9HYCAW3MQK' }}.p8 -authenticationKeyID ${{ secrets.ASC_KEY_ID || '9HYCAW3MQK' }} -authenticationKeyIssuerID ${{ secrets.ASC_ISSUER_ID || '32050277-c8a2-423a-a5cf-567c40018bca' }}"
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Release -archivePath $RUNNER_TEMP/App.xcarchive -destination 'generic/platform=iOS' DEVELOPMENT_TEAM=NP5JBSPVUY CODE_SIGN_STYLE=Automatic $AUTH archive
          cat > $RUNNER_TEMP/export.plist <<PL
          <?xml version="1.0" encoding="UTF-8"?><!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict><key>method</key><string>app-store-connect</string><key>destination</key><string>upload</string><key>teamID</key><string>NP5JBSPVUY</string><key>signingStyle</key><string>automatic</string></dict></plist>
          PL
          xcodebuild -exportArchive -archivePath $RUNNER_TEMP/App.xcarchive -exportOptionsPlist $RUNNER_TEMP/export.plist -exportPath $RUNNER_TEMP/out $AUTH
