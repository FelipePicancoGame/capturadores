le corner right here! My toolbox got stuck inside.", "tts": "A landslide closed off my little corner right here! My toolbox got stuck inside.", "key": "alandslideclosedoffmylittlecornerrightheremytoolboxgotstuckinside", "g": ""}, {"id": "e0454_bira2", "role": "bira2", "text": "You look strong. Walk into the ROCKS to push them. But think first: a rock pushed against the wall won't move anymore!", "tts": "You look strong. Walk into the ROCKS to push them. But think first: a rock pushed against the wall won't move anymore!", "key": "youlookstrongwalkintotherockstopushthembutthinkfirstarockpushedagainstthewallwontmoveanymore", "g": ""}, {"id": "e0455_ze", "role": "ze", "text": "I think it fell down south on Route 2, near the exit. Can you look for it? There'll be a shine on the ground.", "tts": "I think it fell down south on Route 2, near the exit. Can you look for it? There'll be a shine on the ground.", "key": "ithinkitfelldownsouthonrouteneartheexitcanyoulookforittherellbeashineontheground", "g": ""}, {"id": "e0456_ze", "role": "ze", "text": "Oh dear... I lost my lucky fishing rod!", "tts": "Oh dear... I lost my lucky fishing rod!", "key": "ohdearilostmyluckyfishingrod", "g": ""}, {"id": "e0457_ze", "role": "ze", "text": "Tournament champion! Here's the prize.", "tts": "Tournament champion! Here's the prize.", "key": "tournamentchampionherestheprize", "g": ""}, {"id": "e0458_ze", "role": "ze", "text": "With my rod back, I remembered a legend: at the HIDDEN LAKE, west of Route 2, a light appears under the water.", "tts": "With my rod back, I remembered a legend: at the HIDDEN LAKE, west of Route 2, a light appears under the water.", "key": "withmyrodbackirememberedalegendatthehiddenlakewestofroutealightappearsunderthewater", "g": ""}, {"id": "e0459_ze", "role": "ze", "text": "I knew it! Keep it safe, it brings luck when fishing.", "tts": "I knew it! Keep it safe, it brings luck when fishing.", "key": "iknewitkeepitsafeitbringsluckwhenfishing", "g": ""}, {"id": "e0460_ze", "role": "ze", "text": "My best fishing buddy!", "tts": "My best fishing buddy!", "key": "mybestfishingbuddy", "g": ""}, {"id": "e0461_ze", "role": "ze", "text": "My rod! Thank you so much, young one. Here, take this.", "tts": "My rod! Thank you so much, young one. Here, take this.", "key": "myrodthankyousomuchyoungoneheretakethis", "g": ""}, {"id": "e0462_ze", "role": "ze", "text": "In my day Marolos were this big!", "tts": "In my day Marolos were this big!", "key": "inmydaymaroloswerethisbig", "g": ""}, {"id": "e0463_ze", "role": "ze", "text": "Patience is the secret to fishing... and to life.", "tts": "Patience is the secret to fishing... and to life.", "key": "patienceisthesecrettofishingandtolife", "g": ""}, {"id": "e0464_ze", "role": "ze", "text": "A good fish is a fish we put back in the lake!", "tts": "A good fish is a fish we put back in the lake!", "key": "agoodfishisafishweputbackinthelake", "g": ""}, {"id": "e0465_ze", "role": "ze", "text": "Slippery fish, huh? Grass and Electric help!", "tts": "Slippery fish, huh? Grass and Electric help!", "key": "slipperyfishhuhgrassandelectrichelp", "g": ""}, {"id": "e0466_ze", "role": "ze", "text": "Wow... you fished up the victory!", "tts": "Wow... you fished up the victory!", "key": "wowyoufishedupthevictory", "g": ""}, {"id": "e0467_ze", "role": "ze", "text": "Every year there's the Valley Fishing Tournament. This year the challenge is battling my fish!", "tts": "Every year there's the Valley Fishing Tournament. This year the challenge is battling my fish!", "key": "everyyeartheresthevalleyfishingtournamentthisyearthechallengeisbattlingmyfish", "g": ""}, {"id": "e0468_ze", "role": "ze", "text": "Will you go check for me? Look for the shine on the lake shore.", "tts": "Will you go check for me? Look for the shine on the lake shore.", "key": "willyougocheckformelookfortheshineonthelakeshore", "g": ""}, {"id": "e0469_ze", "role": "ze", "text": "Let's see if you can handle it!", "tts": "Let's see if you can handle it!", "key": "letsseeifyoucanhandleit", "g": ""}, {"id": "e0470_ze", "role": "ze", "text": "You're a good one, you know?", "tts": "You're a good one, you know?", "key": "youreagoodoneyouknow", "g": ""}, {"id": "e0471_ze", "role": "ze", "text": "I'll teach you my secret fishing spot. Shhh!", "tts": "I'll teach you my secret fishing spot. Shhh!", "key": "illteachyoumysecretfishingspotshhh", "g": ""}, {"id": "e0472_areia2", "role": "areia2", "text": "The desert is my home! Let's see if you can handle the heat!", "tts": "The desert is my home! Let's see if you can handle the heat!", "key": "thedesertismyhomeletsseeifyoucanhandletheheat", "g": ""}, {"id": "e0473_areia2", "role": "areia2", "text": "Phew... you're hotter than the desert!", "tts": "Phew... you're hotter than the desert!", "key": "phewyourehotterthanthedesert", "g": ""}, {"id": "e0474_narr", "role": "narr", "text": "home, Healing Center and Bruna's Arena.", "tts": "home, Healing Center and Bruna's Arena.", "key": "homehealingcenterandbrunasarena", "g": ""}, {"id": "e0475_narr", "role": "narr", "text": "Your team rested and is good as new!", "tts": "Your team rested and is good as new!", "key": "yourteamrestedandisgoodasnew", "g": ""}, {"id": "e0476_luna", "role": "luna", "text": "The darkness is still strong. Make your team stronger and come back!", "tts": "The darkness is still strong. Make your team stronger and come back!", "key": "thedarknessisstillstrongmakeyourteamstrongerandcomeback", "g": ""}, {"id": "e0477_luna", "role": "luna", "text": "The moon is still hidden. Rest and try again.", "tts": "The moon is still hidden. Rest and try again.", "key": "themoonisstillhiddenrestandtryagain", "g": ""}, {"id": "e0478_luna", "role": "luna", "text": "The moon tells stories to those who know how to listen.", "tts": "The moon tells stories to those who know how to listen.", "key": "themoontellsstoriestothosewhoknowhowtolisten", "g": ""}, {"id": "e0479_luna", "role": "luna", "text": "The village is saved! Thank you, guardian.", "tts": "The village is saved! Thank you, guardian.", "key": "thevillageissavedthankyouguardian", "g": ""}, {"id": "e0480_luna", "role": "luna", "text": "It chose you, guardian.", "tts": "It chose you, guardian.", "key": "itchoseyouguardian", "g": ""}, {"id": "e0481_luna", "role": "luna", "text": "So you're the guardian who calmed the volcano. I dreamed of you.", "tts": "So you're the guardian who calmed the volcano. I dreamed of you.", "key": "soyouretheguardianwhocalmedthevolcanoidreamedofyou", "g": ""}, {"id": "e0482_luna", "role": "luna", "text": "But first... the Shadow Gang is attacking the village! Defend the gate with the TOWERS!", "tts": "But first... the Shadow Gang is attacking the village! Defend the gate with the TOWERS!", "key": "butfirsttheshadowgangisattackingthevillagedefendthegatewiththetowers", "g": ""}, {"id": "e0483_luna", "role": "luna", "text": "Dark monsters are going to attack Aurorion before it wakes up. Defend it on the WALL!", "tts": "Dark monsters are going to attack Aurorion before it wakes up. Defend it on the WALL!", "key": "darkmonstersaregoingtoattackaurorionbeforeitwakesupdefenditonthewall", "g": ""}, {"id": "e0484_luna", "role": "luna", "text": "Aurorion is trapped in the Aurora Temple, up here. Crow used crystals to trap its light.", "tts": "Aurorion is trapped in the Aurora Temple, up here. Crow used crystals to trap its light.", "key": "aurorionistrappedintheauroratempleupherecrowusedcrystalstotrapitslight", "g": ""}, {"id": "e0485_luna", "role": "luna", "text": "Aurorion isn't just a monster. It's the Valley's light.", "tts": "Aurorion isn't just a monster. It's the Valley's light.", "key": "aurorionisntjustamonsteritsthevalleyslight", "g": ""}, {"id": "e0486_luna", "role": "luna", "text": "The path to the Temple is north of the village. But someone is waiting for you before that...", "tts": "The path to the Temple is north of the village. But someone is waiting for you before that...", "key": "thepathtothetempleisnorthofthevillagebutsomeoneiswaitingforyoubeforethat", "g": ""}, {"id": "e0487_luna", "role": "luna", "text": "The crystals broke, but dark energy is coming out of them!", "tts": "The crystals broke, but dark energy is coming out of them!", "key": "thecrystalsbrokebutdarkenergyiscomingoutofthem", "g": ""}, {"id": "e0488_luna", "role": "luna", "text": "You have a brave heart, little guardian.", "tts": "You have a brave heart, little guardian.", "key": "youhaveabraveheartlittleguardian", "g": ""}, {"id": "e0489_heroi", "role": "heroi", "text": "I just forgot to learn how to survive. But we'll figure that out along the way!", "tts": "I just forgot to learn how to survive. But we'll figure that out along the way!", "key": "ijustforgottolearnhowtosurvivebutwellfigurethatoutalongtheway", "g": "m"}, {"id": "e0490_heroina", "role": "heroina", "text": "I just forgot to learn how to survive. But we'll figure that out along the way!", "tts": "I just forgot to learn how to survive. But we'll figure that out along the way!", "key": "ijustforgottolearnhowtosurvivebutwellfigurethatoutalongtheway", "g": "f"}, {"id": "e0491_narr", "role": "narr", "text": "AURORA TEMPLE. Quiet: the guardian of light sleeps here.", "tts": "AURORA TEMPLE. Quiet: the guardian of light sleeps here.", "key": "auroratemplequiettheguardianoflightsleepshere", "g": ""}, {"id": "e0492_narr", "role": "narr", "text": "GLACIER TRAIL. North: Lunaria Village. South: Frozen Peak Village.", "tts": "GLACIER TRAIL. North: Lunaria Village. South: Frozen Peak Village.", "key": "glaciertrailnorthlunariavillagesouthfrozenpeakvillage", "g": ""}, {"id": "e0493_narr", "role": "narr", "text": "MOUNTAIN TRAIL. North: Frozen Peak Village. East: Volcano Crater. West: Dark Forest.", "tts": "MOUNTAIN TRAIL. North: Frozen Peak Village. East: Volcano Crater. West: Dark Forest.", "key": "mountaintrailnorthfrozenpeakvillageeastvolcanocraterwestdarkforest", "g": ""}, {"id": "e0494_teo", "role": "teo", "text": "There's a coil of rope in the square's storage room. I'll hold the pull while you go get it.", "tts": "There's a coil of rope in the square's storage room. I'll hold the pull while you go get it.", "key": "theresacoilofropeinthesquaresstorageroomillholdthepullwhileyougogetit", "g": ""}, {"id": "e0495_narr", "role": "narr", "text": "All your monsters fainted...", "tts": "All your monsters fainted...", "key": "allyourmonstersfainted", "g": ""}, {"id": "e0496_tonho", "role": "tonho", "text": "The mountain shows no mercy! Come back stronger.", "tts": "The mountain shows no mercy! Come back stronger.", "key": "themountainshowsnomercycomebackstronger", "g": ""}, {"id": "e0497_tonho", "role": "tonho", "text": "Now that you've seen the Valley from up high, I want to see if you're as strong as the mountain!", "tts": "Now that you've seen the Valley from up high, I want to see if you're as strong as the mountain!", "key": "nowthatyouveseenthevalleyfromuphighiwanttoseeifyoureasstrongasthemountain", "g": ""}, {"id": "e0498_tonho", "role": "tonho", "text": "A friend for every trail!", "tts": "A friend for every trail!", "key": "afriendforeverytrail", "g": ""}, {"id": "e0499_tonho", "role": "tonho", "text": "You did it! Look, it won't leave your side.", "tts": "You did it! Look, it won't leave your side.", "key": "youdiditlookitwontleaveyourside", "g": ""}, {"id": "e0500_tonho", "role": "tonho", "text": "Hey, careful! The Shadow Gang scared the mountain monsters and they're all coming down at once!", "tts": "Hey, careful! The Shadow Gang scared the mountain monsters and they're all coming down at once!", "key": "heycarefultheshadowgangscaredthemountainmonstersandtheyreallcomingdownatonce", "g": ""}, {"id": "e0501_tonho", "role": "tonho", "text": "Have you been up to the MOUNTAIN LOOKOUT? East of here! From there you can see the whole Valley.", "tts": "Have you been up to the MOUNTAIN LOOKOUT? East of here! From there you can see the whole Valley.", "key": "haveyoubeenuptothemountainlookouteastofherefromthereyoucanseethewholevalley", "g": ""}, {"id": "e0502_tonho", "role": "tonho", "text": "Have you seen the sunrise from the Peak? It'll make you cry!", "tts": "Have you seen the sunrise from the Peak? It'll make you cry!", "key": "haveyouseenthesunrisefromthepeakitllmakeyoucry", "g": ""}, {"id": "e0503_tonho", "role": "tonho", "text": "Beautiful, huh? That's why the Valley is worth protecting.", "tts": "Beautiful, huh? That's why the Valley is worth protecting.", "key": "beautifulhuhthatswhythevalleyisworthprotecting", "g": ""}, {"id": "e0504_tonho", "role": "tonho", "text": "The monsters there are strong. Get to the lookout sign and see it with your own eyes!", "tts": "The monsters there are strong. Get to the lookout sign and see it with your own eyes!", "key": "themonsterstherearestronggettothelookoutsignandseeitwithyourowneyes", "g": ""}, {"id": "e0505_tonho", "role": "tonho", "text": "You're a great trail buddy!", "tts": "You're a great trail buddy!", "key": "youreagreattrailbuddy", "g": ""}, {"id": "e0506_tonho", "role": "tonho", "text": "Protect the trail with the TOWERS until it manages to get out!", "tts": "Protect the trail with the TOWERS until it manages to get out!", "key": "protectthetrailwiththetowersuntilitmanagestogetout", "g": ""}, {"id": "e0507_tonho", "role": "tonho", "text": "Almost! The Pugmin is still there. Let's go again!", "tts": "Almost! The Pugmin is still there. Let's go again!", "key": "almostthepugminisstillthereletsgoagain", "g": ""}, {"id": "e0508_tonho", "role": "tonho", "text": "Hold them on the WALL before they reach the climbers!", "tts": "Hold them on the WALL before they reach the climbers!", "key": "holdthemonthewallbeforetheyreachtheclimbers", "g": ""}, {"id": "e0509_tonho", "role": "tonho", "text": "Climbing a mountain is easy. The hard part is coming down without rolling!", "tts": "Climbing a mountain is easy. The hard part is coming down without rolling!", "key": "climbingamountainiseasythehardpartiscomingdownwithoutrolling", "g": ""}, {"id": "e0510_tonho", "role": "tonho", "text": "I'll give you my lucky staff... just kidding, it's just a stick!", "tts": "I'll give you my lucky staff... just kidding, it's just a stick!", "key": "illgiveyoumyluckystaffjustkiddingitsjustastick", "g": ""}, {"id": "e0511_tonho", "role": "tonho", "text": "Here, a mountaineer's gift.", "tts": "Here, a mountaineer's gift.", "key": "hereamountaineersgift", "g": ""}, {"id": "e0512_tonho", "role": "tonho", "text": "Phew, we barely escaped. Shall we try again?", "tts": "Phew, we barely escaped. Shall we try again?", "key": "phewwebarelyescapedshallwetryagain", "g": ""}, {"id": "e0513_tonho", "role": "tonho", "text": "A baby Pugmin got cornered on a rock and the angry monsters are coming!", "tts": "A baby Pugmin got cornered on a rock and the angry monsters are coming!", "key": "ababypugmingotcorneredonarockandtheangrymonstersarecoming", "g": ""}, {"id": "e0514_tonho", "role": "tonho", "text": "Thanks, buddy! The Gang went on to the Frozen Peak, up north.", "tts": "Thanks, buddy! The Gang went on to the Frozen Peak, up north.", "key": "thanksbuddythegangwentontothefrozenpeakupnorth", "g": ""}, {"id": "e0515_tonho", "role": "tonho", "text": "You're as strong as the mountains!", "tts": "You're as strong as the mountains!", "key": "youreasstrongasthemountains", "g": ""}, {"id": "e0516_narr", "role": "narr", "text": "Tap CALL MONSTER and merge 2 IDENTICAL ones with the SAME stars to make a stronger one. At the bottom, spend mana to make each type stronger.", "tts": "Tap CALL MONSTER and merge 2 IDENTICAL ones with the SAME stars to make a stronger one. At the bottom, spend mana to make each type stronger.", "key": "tapcallmonsterandmergeidenticaloneswiththesamestarstomakeastrongeroneatthebottomspendmanatomakeeachtypestronger", "g": ""}, {"id": "e0517_narr", "role": "narr", "text": "Tap CALL MONSTER: one of the 5 monsters from your deck appears. Merge 2 IDENTICAL ones with the SAME stars to make a stronger one.", async function ensure(v){if(!v||v.mine||!v.owner||added[v.id])return;try{await api('/v1/voices/add/'+v.owner+'/'+v.id,{method:'POST',body:JSON.stringify({new_name:v.name.split(' — ')[0]})});}catch(e){console.warn('add',e.message);}added[v.id]=1;}
let MODEL='eleven_v3';
async function gen(l){const v=CAST[l.role];if(!v)throw new Error('Sem voz para '+l.role);await ensure(v);
  let text=l.tts;if(MODEL!=='eleven_v3')text=text.replace(/\[[^\]]*\]\s*/g,'');
  let r;try{r=await api('/v1/text-to-speech/'+v.id+'?output_format=mp3_44100_64',{method:'POST',body:JSON.stringify({text,model_id:MODEL})});}
  catch(e){if(MODEL==='eleven_v3'&&/model/i.test(e.message)){MODEL='eleven_multilingual_v2';return gen(l);}throw e;}
  AUD[l.id]=await r.blob();const ic=document.querySelector('#l_'+l.id+' .ic');if(ic)ic.innerHTML='<span class="ok">✓</span>';$('bZip').disabled=false;}
$('bRec').onclick=async()=>{stop=false;$('bRec').disabled=true;$('bStop').disabled=false;const todo=LINES.filter(l=>!AUD[l.id]);$('pg').max=LINES.length;
  for(const l of todo){if(stop)break;st('Gravando '+(Object.keys(AUD).length+1)+' de '+LINES.length+'...');
    let ok=0;for(let t=0;t<3&&!ok;t++){try{await gen(l);ok=1;}catch(e){if(t===2){st('Erro na fala "'+l.text.slice(0,40)+'": '+e.message,1);stop=true;}else await new Promise(r=>setTimeout(r,2000*(t+1)));}}
    $('pg').value=Object.keys(AUD).length;}
  $('bRec').disabled=false;$('bStop').disabled=true;credits();
  if(Object.keys(AUD).length===LINES.length)st('Pronto! Toque em Baixar ZIP e mande o arquivo para o Claude.');};
$('bStop').onclick=()=>{stop=true;};
$('bZip').onclick=async()=>{const z=new JSZip();const man=[];for(const l of LINES){if(!AUD[l.id])continue;z.file(l.id+'.mp3',AUD[l.id]);man.push({...l,voz:(CAST[l.role]||{}).name,modelo:MODEL});}
  z.file('manifest.json',JSON.stringify(man,null,1));const b=await z.generateAsync({type:'blob'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='vozes_ingles_1.zip';document.body.append(a);a.click();a.remove();};
</script></body></html>
