d", "g": ""}, {"id": "e0074_bruna", "role": "bruna", "text": "What a battle that was! Route 2 is just north of Route 1. Have a good journey!", "tts": "What a battle that was! Route 2 is just north of Route 1. Have a good journey!", "key": "whatabattlethatwasrouteisjustnorthofroutehaveagoodjourney", "g": ""}, {"id": "e0075_bruna", "role": "bruna", "text": "Hold 10 waves.", "tts": "Hold 10 waves.", "key": "holdwaves", "g": ""}, {"id": "e0076_narr", "role": "narr", "text": "GIANT ROCHEDO!", "tts": "GIANT ROCHEDO!", "key": "giantrochedo", "g": ""}, {"id": "e0077_narr", "role": "narr", "text": "rain with splashes on the water, storms with lightning and mysterious fog. In the rain, Water gets stronger and Fire weaker; in the fog, ghosts and more SHINIES show up.", "tts": "rain with splashes on the water, storms with lightning and mysterious fog. In the rain, Water gets stronger and Fire weaker; in the fog, ghosts and more SHINIES show up.", "key": "rainwithsplashesonthewaterstormswithlightningandmysteriousfogintherainwatergetsstrongerandfireweakerinthefogghostsandmoreshiniesshowup", "g": ""}, {"id": "e0078_narr", "role": "narr", "text": "New COLLECTION in the MENU: see all 28 monsters (seen ones appear as a shadow), tap to read about them and get prizes every 4 species caught. Catching now has sparkles and stars.", "tts": "New COLLECTION in the MENU: see all 28 monsters (seen ones appear as a shadow), tap to read about them and get prizes every 4 species caught. Catching now has sparkles and stars.", "key": "newcollectioninthemenuseeallmonstersseenonesappearasashadowtaptoreadaboutthemandgetprizeseveryspeciescaughtcatchingnowhassparklesandstars", "g": ""}, {"id": "e0079_narr", "role": "narr", "text": "VOLCANO CRATER. DANGER: hot lava! Stay away from the Shadow Gang.", "tts": "VOLCANO CRATER. DANGER: hot lava! Stay away from the Shadow Gang.", "key": "volcanocraterdangerhotlavastayawayfromtheshadowgang", "g": ""}, {"id": "e0080_narr", "role": "narr", "text": "DAYCARE with SNACKS and MISSIONS: in the daycare the monster now gains just a little experience on its own. To really train it, feed it SNACKS (up to 3 a day each): gives experience right away and 3x faster training for 1 hour. Snacks show up in trees that pass by in the EXPEDITION: tap them fast! And there are 3 missions a day at the daycare with prizes.", "tts": "DAYCARE with SNACKS and MISSIONS: in the daycare the monster now gains just a little experience on its own. To really train it, feed it SNACKS (up to 3 a day each): gives experience right away and 3x faster training for 1 hour. Snacks show up in trees that pass by in the EXPEDITION: tap them fast! And there are 3 missions a day at the daycare with prizes.", "key": "daycarewithsnacksandmissionsinthedaycarethemonsternowgainsjustalittleexperienceonitsowntoreallytrainitfeeditsnacksuptoadayeachgivesexperiencerightawayandxfastertrainingforhoursnacksshowupintreesthatpassbyintheexpeditiontapthemfastandtherearemissionsadayatthedaycarewithprizes", "g": ""}, {"id": "e0081_treinador3", "role": "treinador3", "text": "Bruna is much stronger than me. Bring Potions!", "tts": "Bruna is much stronger than me. Bring Potions!", "key": "brunaismuchstrongerthanmebringpotions", "g": ""}, {"id": "e0082_treinador3", "role": "treinador3", "text": "Night has fallen and the enemies got furious.", "tts": "Night has fallen and the enemies got furious.", "key": "nighthasfallenandtheenemiesgotfurious", "g": ""}, {"id": "e0083_treinador3", "role": "treinador3", "text": "Watch out for the ones that heal the others: take them down first! Win 7 waves.", "tts": "Watch out for the ones that heal the others: take them down first! Win 7 waves.", "key": "watchoutfortheonesthathealtheotherstakethemdownfirstwinwaves", "g": ""}, {"id": "e0084_treinador3", "role": "treinador3", "text": "The ground is shaking... it's the GIANT ROCHEDO!", "tts": "The ground is shaking... it's the GIANT ROCHEDO!", "key": "thegroundisshakingitsthegiantrochedo", "g": ""}, {"id": "e0085_treinador3", "role": "treinador3", "text": "To get to Bruna, first show me you can take a rock to the head!", "tts": "To get to Bruna, first show me you can take a rock to the head!", "key": "togettobrunafirstshowmeyoucantakearocktothehead", "g": ""}, {"id": "e0086_treinador3", "role": "treinador3", "text": "If they get past the wall, the Valley turns into a mess. Hold at least 3 waves!", "tts": "If they get past the wall, the Valley turns into a mess. Hold at least 3 waves!", "key": "iftheygetpastthewallthevalleyturnsintoamessholdatleastwaves", "g": ""}, {"id": "e0087_treinador3", "role": "treinador3", "text": "Help! Restless wild monsters are coming down the trail!", "tts": "Help! Restless wild monsters are coming down the trail!", "key": "helprestlesswildmonstersarecomingdownthetrail", "g": ""}, {"id": "e0088_treinador3", "role": "treinador3", "text": "Okay, okay. You can pass!", "tts": "Okay, okay. You can pass!", "key": "okayokayyoucanpass", "g": ""}, {"id": "e0089_treinador3", "role": "treinador3", "text": "See those monsters swimming in the lake? Get close to the shore to battle!", "tts": "See those monsters swimming in the lake? Get close to the shore to battle!", "key": "seethosemonstersswimminginthelakegetclosetotheshoretobattle", "g": ""}, {"id": "e0090_treinador3", "role": "treinador3", "text": "Use the cards to make your monsters stronger. Hold 5 waves!", "tts": "Use the cards to make your monsters stronger. Hold 5 waves!", "key": "usethecardstomakeyourmonstersstrongerholdwaves", "g": ""}, {"id": "e0091_treinador3", "role": "treinador3", "text": "You've become a legend in the Valley!", "tts": "You've become a legend in the Valley!", "key": "youvebecomealegendinthevalley", "g": ""}, {"id": "e0092_treinador3", "role": "treinador3", "text": "It's now or never. Win the 10 waves and save the Valley!", "tts": "It's now or never. Win the 10 waves and save the Valley!", "key": "itsnoworneverwinthewavesandsavethevalley", "g": ""}, {"id": "e0093_treinador3", "role": "treinador3", "text": "Last challenge: win without letting the wall get hit too much. 3 stars!", "tts": "Last challenge: win without letting the wall get hit too much. 3 stars!", "key": "lastchallengewinwithoutlettingthewallgethittoomuchstars", "g": ""}, {"id": "e0094_treinador3", "role": "treinador3", "text": "win without letting the wall get hit too much. 3 stars!", "tts": "win without letting the wall get hit too much. 3 stars!", "key": "winwithoutlettingthewallgethittoomuchstars", "g": ""}, {"id": "e0095_capitao2", "role": "capitao2", "text": "Survive the HORDE one more time and I'll give you a captain's prize!", "tts": "Survive the HORDE one more time and I'll give you a captain's prize!", "key": "survivethehordeonemoretimeandillgiveyouacaptainsprize", "g": ""}, {"id": "e0096_capitao2", "role": "capitao2", "text": "Ah! With this medal the guards will let you through to ROUTE 3 · SUN DUNES, east of the Blue Lake. Watch out for the heat!", "tts": "Ah! With this medal the guards will let you through to ROUTE 3 · SUN DUNES, east of the Blue Lake. Watch out for the heat!", "key": "ahwiththismedaltheguardswillletyouthroughtoroutesunduneseastofthebluelakewatchoutfortheheat", "g": ""}, {"id": "e0097_capitao2", "role": "capitao2", "text": "Ahoy! The sea is calm today like a sleeping Marolo.", "tts": "Ahoy! The sea is calm today like a sleeping Marolo.", "key": "ahoytheseaiscalmtodaylikeasleepingmarolo", "g": ""}, {"id": "e0098_capitao2", "role": "capitao2", "text": "Someone stirred them up. Hold this HORDE with me, sailor!", "tts": "Someone stirred them up. Hold this HORDE with me, sailor!", "key": "someonestirredthemupholdthishordewithmesailor", "g": ""}, {"id": "e0099_capitao2", "role": "capitao2", "text": "I'll tell your story in every port!", "tts": "I'll tell your story in every port!", "key": "illtellyourstoryineveryport", "g": ""}, {"id": "e0100_capitao2", "role": "capitao2", "text": "Now that's a sailor! Here, a gift from the port.", "tts": "Now that's a sailor! Here, a gift from the port.", "key": "nowthatsasailorhereagiftfromtheport", "g": ""}, {"id": "e0101_capitao2", "role": "capitao2", "text": "I once faced a wave the size of a lighthouse!", "tts": "I once faced a wave the size of a lighthouse!", "key": "ioncefacedawavethesizeofalighthouse", "g": ""}, {"id": "e0102_capitao2", "role": "capitao2", "text": "Brave sailor! There's a place for you on my ship.", "tts": "Brave sailor! There's a place for you on my ship.", "key": "bravesailortheresaplaceforyouonmyship", "g": ""}, {"id": "e0103_capitao2", "role": "capitao2", "text": "Sailor! The sea monsters are filling up the docks again.", "tts": "Sailor! The sea monsters are filling up the docks again.", "key": "sailortheseamonstersarefillingupthedocksagain", "g": ""}, {"id": "e0104_capitao2", "role": "capitao2", "text": "My trusty first mate!", "tts": "My trusty first mate!", "key": "mytrustyfirstmate", "g": ""}, {"id": "e0105_capitao2", "role": "capitao2", "text": "The Shadow Gang tried to steal my boat. Nobody robs the Captain!", "tts": "The Shadow Gang tried to steal my boat. Nobody robs the Captain!", "key": "theshadowgangtriedtostealmyboatnobodyrobsthecaptain", "g": ""}, {"id": "e0106_capitao2", "role": "capitao2", "text": "By Marolo's beard! A horde of monsters is coming out of the sea!", "tts": "By Marolo's beard! A horde of monsters is coming out of the sea!", "key": "bymarolosbeardahordeofmonstersiscomingoutofthesea", "g": ""}, {"id": "e0107_capitao2", "role": "capitao2", "text": "Almost! Breathe and try again.", "tts": "Almost! Breathe and try again.", "key": "almostbreatheandtryagain", "g": ""}, {"id": "e0108_capitao2", "role": "capitao2", "text": "Retreating isn't giving up! Get ready and come back.", "tts": "Retreating isn't giving up! Get ready and come back.", "key": "retreatingisntgivingupgetreadyandcomeback", "g": ""}, {"id": "e0109_capitao2", "role": "capitao2", "text": "Victory! I found this on one of the Gang's boats: a map of the Dark Forest...", "tts": "Victory! I found this on one of the Gang's boats: a map of the Dark Forest...", "key": "victoryifoundthisononeofthegangsboatsamapofthedarkforest", "g": ""}, {"id": "e0110_capitao2", "role": "capitao2", "text": "Come back tomorrow for a rematch, sailor!", "tts": "Come back tomorrow for a rematch, sailor!", "key": "comebacktomorrowforarematchsailor", "g": ""}, {"id": "e0111_narr", "role": "narr", "text": "a SLEEPING monster (for example with Brisita's Hypnotic Gaze) is now MUCH easier to catch: 3x higher chance and at least 50% with a Capsule (75% with a Super Capsule). The game shows the chance while it's asleep.", "tts": "a SLEEPING monster (for example with Brisita's Hypnotic Gaze) is now MUCH easier to catch: 3x higher chance and at least 50% with a Capsule (75% with a Super Capsule). The game shows the chance while it's asleep.", "key": "asleepingmonsterforexamplewithbrisitashypnoticgazeisnowmucheasiertocatchxhigherchanceandatleastwithacapsulewithasupercapsulethegameshowsthechancewhileitsasleep", "g": ""}, {"id": "e0112_narr", "role": "narr", "text": "Chapter complete! Tap COLLECT to get the reward.", "tts": "Chapter complete! Tap COLLECT to get the reward.", "key": "chaptercompletetapcollecttogetthereward", "g": ""}, {"id": "e0113_narr", "role": "narr", "text": "little orbs spin around and hit the enemies", "tts": "little orbs spin around and hit the enemies", "key": "littleorbsspinaroundandhittheenemies", "g": ""}, {"id": "e0114_narr", "role": "narr", "text": "hurts whoever gets close", "tts": "hurts whoever gets close", "key": "hurtswhoevergetsclose", "g": ""}, {"id": "e0115_narr", "role": "narr", "text": "lightning falls on enemies by itself", "tts": "lightning falls on enemies by itself", "key": "lightningfallsonenemiesbyitself", "g": ""}, {"id": "e0116_narr", "role": "narr", "text": "Fire starts with ONE fireball at level 1. The second ball only appears when you upgrade the power to level 2 (SHOP › POWERS).", "tts": "Fire starts with ONE fireball at level 1. The second ball only appears when you upgrade the power to level 2 (SHOP › POWERS).", "key": "firestartswithonefireballatlevelthesecondballonlyappearswhenyouupgradethepowertolevelshoppowers", "g": ""}, {"id": "e0117_celeste3", "role": "celeste3", "text": "The stars already knew you would win.", "tts": "The stars already knew you would win.", "key": "thestarsalreadyknewyouwouldwin", "g": ""}, {"id": "e0118_celeste3", "role": "celeste3", "text": "The stars told me you would come...", "tts": "The stars told me you would come...", "key": "thestarstoldmeyouwouldcome", "g": ""}, {"id": "e0119_celeste3", "role": "celeste3", "text": "The shadows are afraid of you now.", "tts": "The shadows are afraid of you now.", "key": "theshadowsareafraidofyounow", "g": ""}, {"id": "e0120_celeste3", "role": "celeste3", "text": "Our stars are linked forever.", "tts": "Our stars are linked forever.", "key": "ourstarsarelinkedforever", "g": ""}, {"id": "e0121_celeste3", "role": "celeste3", "text": "Thank you! It liked you so much that it wants to come with you.", "tts": "Thank you! It liked you so much that it wants to come with you.", "key": "thankyouitlikedyousomuchthatitwantstocomewithyou", "g": ""}, {"id": "e0122_celeste3", "role": "celeste3", "text": "The forest ghosts aren't bad. They're just lost.", "tts": "The forest ghosts aren't bad. They're just lost.", "key": "theforestghostsarentbadtheyrejustlost", "g": ""}, {"id": "e0123_celeste3", "role": "celeste3", "text": "I feel a strong light in you. Like Aurorion's.", "tts": "I feel a strong light in you. Like Aurorion's.", "key": "ifeelastronglightinyoulikeaurorions", "g": ""}, {"id": "e0124_celeste3", "role": "celeste3", "text": "A little Assombro got lost from its family and is crying in the south of the forest.", "tts": "A little Assombro got lost from its family and is crying in the south of the forest.", "key": "alittleassombrogotlostfromitsfamilyandiscryinginthesouthoftheforest", "g": ""}, {"id": "e0125_celeste3", "role": "celeste3", "text": "You light up even the Dark Forest.", "tts": "You light up even the Dark Forest.", "key": "youlightupeventhedarkforest", "g": ""}, {"id": "e0126_narr", "role": "narr", "text": "the towers only see it up close. When it takes a hit, it shows up!", "tts": "the towers only see it up close. When it takes a hit, it shows up!", "key": "thetowersonlyseeitupclosewhenittakesahititshowsup", "g": ""}, {"id": "e0127_narr", "role": "narr", "text": "With the Stone Medal, the guards allow travel along Route 2. They say the Shadow Gang is up to something there...", "tts": "With the Stone Medal, the guards allow travel along Route 2. They say the Shadow Gang is up to something there...", "key": "withthestonemedaltheguardsallowtravelalongroutetheysaytheshadowgangisuptosomethingthere", "g": ""}, {"id": "e0128_heroi", "role": "heroi", "text": "Deal. And no climbing the tower: you can swap the tip down here.", "tts": "Deal. And no climbing the tower: you can swap the tip down here.", "key": "dealandnoclimbingthetoweryoucanswapthetipdownhere", "g": "m"}, {"id": "e0129_heroina", "role": "heroina", "text": "Deal. And no climbing the tower: you can swap the tip down here.", "tts": "Deal. And no climbing the tower: you can swap the tip down here.", "key": "dealandnoclimbingthetoweryoucanswapthetipdownhere", "g": "f"}, {"id": "e0130_narr", "role": "narr", "text": "Starting a NEW GAME erases your saved game. Are you sure?", "tts": "Starting a NEW GAME erases your saved game. Are you sure?", "key": "startinganewgameerasesyoursavedgameareyousure", "g": ""}, {"id": "e0131_narr", "role": "narr", "text": "Started! The game downloads little by little while you play. You can see how much is left here in SETTINGS.", "tts": "Started! The game downloads little by little while you play. You can see how much is left here in SETTINGS.", "key": "startedthegamedownloadslittlebylittlewhileyouplayyoucanseehowmuchislefthereinsettings", "g": ""}, {"id": "e0132_narr", "role": "narr", "text": "Food, water, map… I think I have everything to become a great adventurer!", "tts": "Food, water, map… I think I have everything to become a great adventurer!", "key": "foodwatermapithinkihaveeverythingtobecomeagreatadventurer", "g": ""}, {"id": "e0133_narr", "role": "narr", "text": "Complete and collect the 3 daily missions to open the special chest!", "tts": "Complete and collect the 3 daily missions to open the special chest!", "key": "completeandcollectthedailymissionstoopenthespecialchest", "g": ""}, {"id": "e0134_narr", "role": "narr", "text": "every Wall already STARTS with this card active.", "tts": "every Wall already STARTS with this card active.", "key": "everywallalreadystartswiththiscardactive", "g": ""}, {"id": "e0135_narr", "role": "narr", "text": "the game could suddenly FREEZE (in the Horde and other modes) because of a bug drawing the fish on the map. Fixed, and now the game protects itself: if some drawing fails, it keeps running instead of freezing.", "tts": "the game could suddenly FREEZE (in the Horde and other modes) because of a bug drawing the fish on the map. Fixed, and now the game protects itself: if some drawing fails, it keeps running instead of freezing.", "key": "thegamecouldsuddenlyfreezeinthehordeandothermodesbecauseofabugdrawingthefishonthemapfixedandnowthegameprotectsitselfifsomedrawingfailsitkeepsrunninginsteadoffreezing", "g": ""}, {"id": "e0136_corvo2", "role": "corvo2", "text": "With this volcano's fire I'll wake Aurorion and trap the aurora forever! The Valley will belong to the SHADOW GANG!", "tts": "With this volcano's fire I'll wake Aurorion and trap the aurora forever! The Valley will belong to the SHADOW GANG!", "key": "withthisvolcanosfireillwakeaurorionandtraptheauroraforeverthevalleywillbelongtotheshadowgang", "g": ""}, {"id": "e0137_corvo2", "role": "corvo2", "text": "So you're the famous trainer who beat my henchmen.", "tts": "So you're the famous trainer who beat my henchmen.", "key": "soyourethefamoustrainerwhobeatmyhenchmen", "g": ""}, {"id": "e0138_corvo2", "role": "corvo2", "text": "Impossible... my crystals...!", "tts": "Impossible... my crystals...!", "key": "impossiblemycrystals", "g": ""}, {"id": "e0139_corvo2", "role": "corvo2", "text": "No! The crystals are cracking!", "tts": "No! The crystals are cracking!", "key": "nothecrystalsarecracking", "g": ""}, {"id": "e0140_corvo2", "role": "corvo2", "text": "No... it can't be!", "tts": "No... it can't be!", "key": "noitcantbe", "g": ""}, {"id": "e0141_corvo2", "role": "corvo2", "text": "The crystals are already trapping Aurorion. With its light, the Shadow Gang will rule the Valley forever!", "tts": "The crystals are already trapping Aurorion. With its light, the Shadow Gang will rule the Valley forever!", "key": "thecrystalsarealreadytrappingaurorionwithitslighttheshadowgangwillrulethevalleyforever", "g": ""}, {"id": "e0142_corvo2", "role": "corvo2", "text": "If you want it back... come and get it!", "tts": "If you want it back... come and get it!", "key": "ifyouwantitbackcomeandgetit", "g": ""}, {"id": "e0143_corvo2", "role": "corvo2", "text": "You again?! You're too late, guardian.", "tts": "You again?! You're too late, guardian.", "key": "youagainyouretoolateguardian", "g": ""}, {"id": "e0144_corvo2", "role": "corvo2", "text": "You won... but it's too late! I woke up the volcano! Ha ha ha!", "tts": "You won... but it's too late! I woke up the volcano! Ha ha ha!", "key": "youwonbutitstoolateiwokeupthevolcanohahaha", "g": ""}, {"id": "e0145_narr", "role": "narr", "text": "Running gives HP, Strength gives attack, Shield gives defense, Agility gives speed.", "tts": "Running gives HP, Strength gives attack, Shield gives defense, Agility gives speed.", "key": "runninggiveshpstrengthgivesattackshieldgivesdefenseagilitygivesspeed", "g": ""}, {"id": "e0146_davi", "role": "davi", "text": "...Fine, I admit it: you're good. But I'll be better!", "tts": "...Fine, I admit it: you're good. But I'll be better!", "key": "fineiadmitityouregoodbutillbebetter", "g": ""}, {"id": "e0147_davi", "role": "davi", "text": "you're good. But I'll be better!", "tts": "you're good. But I'll be better!", "key": "youregoodbutillbebetter", "g": ""}, {"id": "e0148_davi", "role": "davi", "text": "...Fine. You won. The Shadow Gang was seen in the Dark Forest. Go, I'll take care of the port.", "tts": "...Fine. You won. The Shadow Gang was seen in the Dark Forest. Go, I'll take care of the port.", "key": "fineyouwontheshadowgangwasseeninthedarkforestgoilltakecareoftheport", "g": ""}, {"id": "e0149_davi", "role": "davi", "text": "...You're ready. Go show them!", "tts": "...You're ready. Go show them!", "key": "yourereadygoshowthem", "g": ""}, {"id": "e0150_davi", "role": "davi", "text": "...You're awesome. Go ahead. I'll take care of the village!", "tts": "...You're awesome. Go ahead. I'll take care of the village!", "key": "youreawesomegoaheadilltakecareofthevillage", "g": ""}, {"id": "e0151_davi", "role": "davi", "text": "Did you think you'd save Aurorion alone? I want to help too!", "tts": "Did you think you'd save Aurorion alone? I want to help too!", "key": "didyouthinkyoudsaveaurorionaloneiwanttohelptoo", "g": ""}, {"id": "e0152_davi", "role": "davi", "text": "I got here before you this time! Before facing Crow, I want one last battle.", "tts": "I got here before you this time! Before facing Crow, I want one last battle.", "key": "igotherebeforeyouthistimebeforefacingcrowiwantonelastbattle", "g": ""}, {"id": "e0153_davi", "role": "davi", "text": "Again?! How did you get so strong?", "tts": "Again?! How did you get so strong?", "key": "againhowdidyougetsostrong", "g": ""}, {"id": "e0154_davi", "role": "davi", "text": "So you're the one who keeps saving the village? I'm Davi.", "tts": "So you're the one who keeps saving the village? I'm Davi.", "key": "soyouretheonewhokeepssavingthevillageimdavi", "g": ""}, {"id": "e0155_davi", "role": "davi", "text": "Hmph. Still think you can catch up with me?", "tts": "Hmph. Still think you can catch up with me?", "key": "hmphstillthinkyoucancatchupwithme", "g": ""}, {"id": "e0156_davi", "role": "davi", "text": "Hmph... fine, you're good. But I'll train and catch up with you!", "tts": "Hmph... fine, you're good. But I'll train and catch up with you!", "key": "hmphfineyouregoodbutilltrainandcatchupwithyou", "g": ""}, {"id": "e0157_davi", "role": "davi", "text": "But first... the last battle. Whoever wins goes ahead!", "tts": "But first... the last battle. Whoever wins goes ahead!", "key": "butfirstthelastbattlewhoeverwinsgoesahead", "g": ""}, {"id": "e0158_davi", "role": "davi", "text": "What?! That was luck! I'll win next time!", "tts": "What?! That was luck! I'll win next time!", "key": "whatthatwasluckillwinnexttime", "g": ""}, {"id": "e0159_davi", "role": "davi", "text": "I want to be the Valley Champion. And you'll be my biggest rival, got it?", "tts": "I want to be the Valley Champion. And you'll be my biggest rival, got it?", "key": "iwanttobethevalleychampionandyoullbemybiggestrivalgotit", "g": ""}, {"id": "e0160_davi", "role": "davi", "text": "Rematch! This time it's for real!", "tts": "Rematch! This time it's for real!", "key": "rematchthistimeitsforreal", "g": ""}, {"id": "e0161_davi", "role": "davi", "text": "If the Shadow Gang messes with you, call me. We'll beat them together!", "tts": "If the Shadow Gang messes with you, call me. We'll beat them together!", "key": "iftheshadowgangmesseswithyoucallmewellbeatthemtogether", "g": ""}, {"id": "e0162_davi", "role": "davi", "text": "If you can't beat me, you don't stand a chance against him!", "tts": "If you can't beat me, you don't stand a chance against him!", "key": "ifyoucantbeatmeyoudontstandachanceagainsthim", "g": ""}, {"id": "e0163_davi", "role": "davi", "text": "I heard you saved the port. Big deal! I trained a lot too.", "tts": "I heard you saved the port. Big deal! I trained a lot too.", "key": "iheardyousavedtheportbigdealitrainedalottoo", "g": ""}, {"id": "e0164_davi", "role": "davi", "text": "I also got monsters and trained a lot. I'm going to be the best trainer in the Valley. Let's see who's stronger!", "tts": "I also got monsters and trained a lot. I'm going to be the best trainer in the Valley. Let's see who's stronger!", "key": "ialsogotmonstersandtrainedalotimgoingtobethebesttrainerinthevalleyletsseewhosstronger", "g": ""}, {"id": "e0165_davi", "role": "davi", "text": "Here, take this. And come back in one piece, okay? Otherwise I'll have no rival!", "tts": "Here, take this. And come back in one piece, okay? Otherwise I'll have no rival!", "key": "heretakethisandcomebackinonepieceokayotherwiseillhavenorival", "g": ""}, {"id": "e0166_davi", "role": "davi", "text": "Here, the best I have. Now go to the Temple and finish Crow off!", "tts": "Here, the best I have. Now go to the Temple and finish Crow off!", "key": "herethebestihavenowgotothetempleandfinishcrowoff", "g": ""}, {"id": "e0167_davi", "role": "davi", "text": "I trained all night. Today I'm beating you!", "tts": "I trained all night. Today I'm beating you!", "key": "itrainedallnighttodayimbeatingyou", "g": ""}, {"id": "e0168_davi", "role": "davi", "text": "You're my best friend... but don't tell anyone!", "tts": "You're my best friend... but don't tell anyone!", "key": "youremybestfriendbutdonttellanyone", "g": ""}, {"id": "e0169_teo", "role": "teo", "text": "After this one, you get to pick the first loaf of bread.", "tts": "After this one, you get to pick the first loaf of bread.", "key": "afterthisoneyougettopickthefirstloafofbread", "g": ""}, {"id": "e0170_narr", "role": "narr", "text": "Defeating enemies gives energy ⚡. Tap a tower to upgrade it. Each monster carries its own SPECIAL: the round buttons at the bottom.", "tts": "Defeating enemies gives energy ⚡. Tap a tower to upgrade it. Each monster carries its own SPECIAL: the round buttons at the bottom.", "key": "defeatingenemiesgivesenergytapatowertoupgradeiteachmonstercarriesitsownspecialtheroundbuttonsatthebottom", "g": ""}, {"id": "e0171_narr", "role": "narr", "text": "Take it down before it escapes: +40⚡ and crystals!", "tts": "Take it down before it escapes: +40⚡ and crystals!", "key": "takeitdownbeforeitescapesandcrystals", "g": ""}, {"id": "e0172_heroi", "role": "heroi", "text": "There must be so many interesting things beyond these mountains…", "tts": "There must be so many interesting things beyond these mountains…", "key": "theremustbesomanyinterestingthingsbeyondthesemountains", "g": "m"}, {"id": "e0173_heroina", "role": "heroina", "text": "There must be so many interesting things beyond these mountains…", "tts": "There must be so many interesting things beyond these mountains…", "key": "theremustbesomanyinterestingthingsbeyondthesemountains", "g": "f"}, {"id": "e0174_narr", "role": "narr", "text": "catch monsters in the tall grass of Route 1 to have a bigger team, and use attacks of the right type!", "tts": "catch monsters in the tall grass of Route 1 to have a bigger team, and use attacks of the right type!", "key": "catchmonstersinthetallgrassofroutetohaveabiggerteamanduseattacksoftherighttype", "g": ""}, {"id": "e0175_narr", "role": "narr", "text": "Water and Grass beat the desert's Rock and Fire monsters!", "tts": "Water and Grass beat the desert's Rock and Fire monsters!", "key": "waterandgrassbeatthedesertsrockandfiremonsters", "g": ""}, {"id": "e0176_narr", "role": "narr", "text": "They say that long ago Aurorion slept in the Temple, up high. Every night the aurora came out from there.", "tts": "They say that long ago Aurorion slept in the Temple, up high. Every night the aurora came out from there.", "key": "theysaythatlongagoaurorionsleptinthetempleuphigheverynighttheauroracameoutfromthere", "g": ""}, {"id": "e0177_narr", "role": "narr", "text": "They say a very rare monster of colorful light appears in the Dark Forest, to the east...", "tts": "They say a very rare monster of colorful light appears in the Dark Forest, to the east...", "key": "theysa ", "tts": "Drop by for a coffee whenever you like.", "key": "dropbyforacoffeewheneveryoulike", "g": ""}, {"id": "e0185_lu", "role": "lu", "text": "If I had a grandchild, I'd want them to be just like you!", "tts": "If I had a grandchild, I'd want them to be just like you!", "key": "ifihadagrandchildidwantthemtobejustlikeyou", "g": ""}, {"id": "e0186_lu", "role": "lu", "text": "You're the nicest client I've ever had!", "tts": "You're the nicest client I've ever had!", "key": "yourethenicestclientiveeverhad", "g": ""}, {"id": "e0187_narr", "role": "narr", "text": "You can leave it on and come back later: the expedition keeps collecting prizes! Just like resting between sets. 🎁", "tts": "You can leave it on and come back later: the expedition keeps collecting prizes! Just like resting between sets. 🎁", "key": "youcanleaveitonandcomebacklatertheexpeditionkeepscollectingprizesjustlikerestingbetweensets", "g": ""}, {"id": "e0188_heroi", "role": "heroi", "text": "And the village's right to wake up making noise.", "tts": "And the village's right to wake up making noise.", "key": "andthevillagesrighttowakeupmakingnoise", "g": "m"}, {"id": "e0189_heroina", "role": "heroina", "text": "And the village's right to wake up making noise.", "tts": "And the village's right to wake up making noise.", "key": "andthevillagesrighttowakeupmakingnoise", "g": "f"}, {"id": "e0190_narr", "role": "narr", "text": "At the bottom, spend mana to make each type stronger. Every 5 waves a BOSS comes with a power!", "tts": "At the bottom, spend mana to make each type stronger. Every 5 waves a BOSS comes with a power!", "key": "atthebottomspendmanatomakeeachtypestrongereverywavesabosscomeswithapower", "g": ""}, {"id": "e0191_narr", "role": "narr", "text": "At the bottom, spend mana to make each type stronger. Every 5 waves a BOSS comes!", "tts": "At the bottom, spend mana to make each type stronger. Every 5 waves a BOSS comes!", "key": "atthebottomspendmanatomakeeachtypestrongereverywavesabosscomes", " upinrarity", "g": ""}, {"id": "e0215_narr", "role": "narr", "text": "AMULET FUSION! When your amulet bag is almost full, 3 common amulets join into a RARE one, and 3 rares become an EPIC, with a fusion animation. That frees up space for new amulets and your bonuses get much stronger.", "tts": "AMULET FUSION! When your amulet bag is almost full, 3 common amulets join into a RARE one, and 3 rares become an EPIC, with a fusion animation. That frees up space for new amulets and your bonuses get much stronger.", "key": "amuletfusionwhenyouramuletbagisalmostfullcommonamuletsjoinintoarareoneandraresbecomeanepicwithafusionanimationthatfreesupspacefornewamuletsandyourbonusesgetmuchstronger", "g": ""}, {"id": "e0216_narr", "role": "narr", "text": "PETS! Defeat lots of monsters of the same species (the little bar at the top shows how many are left) and it becomes a pet that flies with the team and gives a bonus forever: more damage, HP, speed or coins.", "tts": "PETS! Defeat lots of monsters of the same species (the little bar at the top shows how many are left) and it becomes a pet that flies with the team and gives a bonus forever: more damage, HP, speed or coins.", "key": "petsdefeatlotsofmonstersofthesamespeciesthelittlebaratthetopshowshowmanyareleftanditbecomesapetthatflieswiththeteamandgivesabonusforevermoredamagehpspeedorcoins", "g": ""}, {"id": "e0217_narr", "role": "narr", "text": "the landscape changes every 5 stages (Field, Autumn, Desert and Snow) with falling leaves, sand and snow. TAP the enemies to help attack and make combos!", "tts": "the landscape changes every 5 stages (Field, Autumn, Desert and Snow) with falling leaves, sand and snow. TAP the enemies to help attack and make combos!", "key": "thelandscapechangeseverystagesfieldautumndesertandsnowwithfallingleavessandandsnowtaptheenemiestohelpattackandmakecombos", "g": ""}, {"id": "e0218_narr", "role": "narr", "text": "chests and bosses now drop AMULETS (common, rare or epic) with a beam of light. They give more damage, HP, speed or coins forever. Up to 6 at once!", "tts": "chests and bosses now drop AMULETS (common, rare or epic) with a beam of light. They give more damage, HP, speed or coins forever. Up to 6 at once!", "key": "chestsandbossesnowdropamuletscommonrareorepicwithabeamoflighttheygivemoredamagehpspeedorcoinsforeveruptoatonce", "g": ""}, {"id": "e0219_narr", "role": "narr", "text": "2x SPEED button on the bottom panel (next to AUTO). The team walks and fights twice as fast, with speed trails on the ground. It's saved for next time.", "tts": "2x SPEED button on the bottom panel (next to AUTO). The team walks and fights twice as fast, with speed trails on the ground. It's saved for next time.", "key": "xspeedbuttononthebottompanelnexttoautotheteamwalksandfightstwiceasfastwithspeedtrailsonthegrounditssavedfornexttime", "g": ""}, {"id": "e0220_narr", "role": "narr", "text": "sometimes a golden WINGED CHEST flies by. Tap it quickly to get coins and even amulets!", "tts": "sometimes a golden WINGED CHEST flies by. Tap it quickly to get coins and even amulets!", "key": "sometimesagoldenwingedchestfliesbytapitquicklytogetcoinsandevenamulets", "g": ""}, {"id": "e0221_iara3", "role": "iara3", "text": "I found footprints of an ANCIENT monster here in the dunes!", "tts": "I found footprints of an ANCIENT monster here in the dunes!", "key": "ifoundfootprintsofanancientmonsterhereinthedunes", "g": ""}, {"id": "e0222_narr", "role": "narr", "text": "Explore the Valley, make friends and follow the STORY: the scroll 📜 at the top of the screen shows your next mission.", "tts": "Explore the Valley, make friends and follow the STORY: the scroll 📜 at the top of the screen shows your next mission.", "key": "explorethevalleymakefriendsandfollowthestorythescrollatthetopofthescreenshowsyournextmission", "g": ""}, {"id": "e0223_narr", "role": "narr", "text": "it got faster", "tts": "it got faster", "key": "itgotfaster", "g": ""}, {"id": "e0224_narr", "role": "narr", "text": "Close and open the App again, then you can download the game to play offline.", "tts": "Close and open the App again, then you can download the game to play offline.", "key": "closeandopentheappagainthenyoucandownloadthegametoplayoffline", "g": ""}, {"id": "e0225_narr", "role": "narr", "text": "medium, poisons", "tts": "medium, poisons", "key": "mediumpoisons", "g": ""}, {"id": "e0226_narr", "role": "narr", "text": "shots go right through", "tts": "shots go right through", "key": "shotsgorightthrough", "g": ""}, {"id": "e0227_narr", "role": "narr", "text": "Out of Capsules? Here are 3, on the house!", "tts": "Out of Capsules? Here are 3, on the house!", "key": "outofcapsuleshereareonthehouse", "g": ""}, {"id": "e0228_heroi", "role": "heroi", "text": "Finally! Let's see what's beyond these mountains!", "tts": "Finally! Let's see what's beyond these mountains!", "key": "finallyletsseewhatsbeyondthesemountains", "g": "m"}, {"id": "e0229_heroina", "role": "heroina", "text": "Finally! Let's see what's beyond these mountains!", "tts": "Finally! Let's see what's beyond these mountains!", "key": "finallyletsseewhatsbeyondthesemountains", "g": "f"}, {"id": "e0230_fe", "role": "fe", "text": "Squats make your legs strong for chasing monsters!", "tts": "Squats make your legs strong for chasing monsters!", "key": "squatsmakeyourlegsstrongforchasingmonsters", "g": ""}, {"id": "e0231_fe", "role": "fe", "text": "Let's get moving! Strong monster, strong trainer!", "tts": "Let's get moving! Strong monster, strong trainer!", "key": "letsgetmovingstrongmonsterstrongtrainer", "g": ""}, {"id": "e0232_fe", "role": "fe", "text": "Hey, champ! How much EXERCISE did you really do today? Walking, running, gym, cycling, dancing... it all counts!", "tts": "Hey, champ! How much EXERCISE did you really do today? Walking, running, gym, cycling, dancing... it all counts!", "key": "heychamphowmuchexercisedidyoureallydotodaywalkingrunninggymcyclingdancingitallcounts", "g": ""}, {"id": "e0233_fe", "role": "fe", "text": "Hydration is everything! Even Marolo agrees.", "tts": "Hydration is everything! Even Marolo agrees.", "key": "hydrationiseverythingevenmaroloagrees", "g": ""}, {"id": "e0234_fe", "role": "fe", "text": "We already logged your workout today! Rest up, muscles grow while you rest. Come back tomorrow!", "tts": "We already logged your workout today! Rest up, muscles grow while you rest. Come back tomorrow!", "key": "wealreadyloggedyourworkouttodayrestupmusclesgrowwhileyourestcomebacktomorrow", "g": ""}, {"id": "e0235_fe", "role": "fe", "text": "Remember: consistency is what matters. A little bit every day!", "tts": "Remember: consistency is what matters. A little bit every day!", "key": "rememberconsistencyiswhatmattersalittlebiteveryday", "g": ""}, {"id": "e0236_fe", "role": "fe", "text": "consistency is what matters. A little bit every day!", "tts": "consistency is what matters. A little bit every day!", "key": "consistencyiswhatmattersalittlebiteveryday", "g": ""}, {"id": "e0237_fe", "role": "fe", "text": "Best student at the Valley gym! High five!", "tts": "Best student at the Valley gym! High five!", "key": "beststudentatthevalleygymhighfive", "g": ""}, {"id": "e0238_fe", "role": "fe", "text": "No problem! How about at least 15 minutes? Then come back and I'll give you a bonus!", "tts": "No problem! How about at least 15 minutes? Then come back and I'll give you a bonus!", "key": "noproblemhowaboutatleastminutesthencomebackandillgiveyouabonus", "g": ""}, {"id": "e0239_fe", "role": "fe", "text": "You're getting strong, huh! I'm proud.", "tts": "You're getting strong, huh! I'm proud.", "key": "youregettingstronghuhimproud", "g": ""}, {"id": "e0240_narr", "role": "narr", "text": "+1 SPEED forever (max +10).", "tts": "+1 SPEED forever (max +10).", "key": "speedforevermax", "g": ""}, {"id": "e0241_garra", "role": "garra", "text": "And I won't let you get in the way. This time I brought my best monsters!", "tts": "And I won't let you get in the way. This time I brought my best monsters!", "key": "andiwontletyougetinthewaythistimeibroughtmybestmonsters", "g": ""}, {"id": "e0242_garra", "role": "garra", "text": "So you're the little pest who keeps getting in the Shadow Gang's way.", "tts": "So you're the little pest who keeps getting in the Shadow Gang's way.", "key": "soyourethelittlepestwhokeepsgettingintheshadowgangsway", "g": ""}, {"id": "e0243_garra", "role": "garra", "text": "I'm Claw, Crow's right hand. I'm going to teach you a lesson!", "tts": "I'm Claw, Crow's right hand. I'm going to teach you a lesson!", "key": "imclawcrowsrighthandimgoingtoteachyoualesson", "g": ""}, {"id": "e0244_garra", "role": "garra", "text": "Grr... It doesn't matter! Crow is already on his way to the Volcano Crater to get the aurora's fire!", "tts": "Grr... It doesn't matter! Crow is already on his way to the Volcano Crater to get the aurora's fire!", "key": "grritdoesntmattercrowisalreadyonhiswaytothevolcanocratertogettheaurorasfire", "g": ""}, {"id": "e0245_garra", "role": "garra", "text": "Hmph! Again?! Crow isn't going to like this one bit...", "tts": "Hmph! Again?! Crow isn't going to like this one bit...", "key": "hmphagaincrowisntgoingtolikethisonebit", "g": ""}, {"id": "e0246_garra", "role": "garra", "text": "Impossible!", "tts": "Impossible!", "key": "impossible", "g": ""}, {"id": "e0247_garra", "role": "garra", "text": "Crow escaped from the Crater and went north. He wants the AURORA CRYSTALS!", "tts": "Crow escaped from the Crater and went north. He wants the AURORA CRYSTALS!", "key": "crowescapedfromthecraterandwentnorthhewantstheauroracrystals", "g": ""}, {"id": "e0248_garra", "role": "garra", "text": "Well, well... the Valley's guardian again.", "tts": "Well, well... the Valley's guardian again.", "key": "wellwellthevalleysguardianagain", "g": ""}, {"id": "e0249_garra", "role": "garra", "text": "Fine, fine... Go ahead. But Lunaria Village must be surrounded by the Gang by now!", "tts": "Fine, fine... Go ahead. But Lunaria Village must be surrounded by the Gang by now!", "key": "finefinegoaheadbutlunariavillagemustbesurroundedbythegangbynow", "g": ""}, {"id": "e0250_bento", "role": "bento", "text": "Before going after them, catch some monsters in the TALL GRASS of Route 1. Going alone is dangerous!", "tts": "Before going after them, catch some monsters in the TALL GRASS of Route 1. Going alone is dangerous!", "key": "beforegoingafterthemcatchsomemonstersinthetallgrassofroutegoingaloneisdangerous", "g": ""}, {"id": "e0251_bento", "role": "bento", "text": "With you around I even sleep better.", "tts": "With you around I even sleep better.", "key": "withyouaroundievensleepbetter", "g": ""}, {"id": "e0252_bento", "role": "bento", "text": "Ever since Aurorion vanished they've been like this. Defend the town on the WALL!", "tts": "Ever since Aurorion vanished they've been like this. Defend the town on the WALL!", "key": "eversinceaurorionvanishedtheyvebeenlikethisdefendthetownonthewall", "g": ""}, {"id": "e0253_bento", "role": "bento", "text": "Ever since Aurorion vanished, the monsters have been restless.", "tts": "Ever since Aurorion vanished, the monsters have been restless.", "key": "eversinceaurorionvanishedthemonstershavebeenrestless", "g": ""}, {"id": "e0254_bento", "role": "bento", "text": "They almost got in! Breathe, train and try again.", "tts": "They almost got in! Breathe, train and try again.", "key": "theyalmostgotinbreathetrainandtryagain", "g": ""}, {"id": "e0255_bento", "role": "bento", "text": "Will you help me on patrol? Hold the HORDE until the end!", "tts": "Will you help me on patrol? Hold the HORDE until the end!", "key": "willyouhelpmeonpatrolholdthehordeuntiltheend", "g": ""}, {"id": "e0256_bento", "role": "bento", "text": "The restless monsters are prowling around the village at night again.", "tts": "The restless monsters are prowling around the village at night again.", "key": "therestlessmonstersareprowlingaroundthevillageatnightagain", "g": ""}, {"id": "e0257_bento", "role": "bento", "text": "If you ever want to be a guard, the job is yours!", "tts": "If you ever want to be a guard, the job is yours!", "key": "ifyoueverwanttobeaguardthejobisyours", "g": ""}, {"id": "e0258_bento", "role": "bento", "text": "Help! A HORDE of restless monsters is coming down from Route 1!", "tts": "Help! A HORDE of restless monsters is coming down from Route 1!", "key": "helpahordeofrestlessmonstersiscomingdownfromroute", "g": ""}, {"id": "e0259_bento", "role": "bento", "text": "All quiet in the village. For now...", "tts": "All quiet in the village. For now...", "key": "allquietinthevillagefornow", "g": ""}, {"id": "e0260_bento", "role": "bento", "text": "Phew, that was close. Rest and try again!", "tts": "Phew, that was close. Rest and try again!", "key": "phewthatwascloserestandtryagain", "g": ""}, {"id": "e0261_bento", "role": "bento", "text": "The village is safe again! Here, you deserve it.", "tts": "The village is safe again! Here, you deserve it.", "key": "thevillageissafeagainhereyoudeserveit", "g": ""}, {"id": "e0262_bento", "role": "bento", "text": "You saved the village! But... I saw people in dark clothes stirring up the monsters. Could it be the Shadow Gang?", "tts": "You saved the village! But... I saw people in dark clothes stirring up the monsters. Could it be the Shadow Gang?", "key": "yousavedthevillagebutisawpeopleindarkclothesstirringupthemonsterscoulditbetheshadowgang", "g": ""}, {"id": "e0263_bento", "role": "bento", "text": "You're a real hero. The whole village talks about you!", "tts": "You're a real hero. The whole village talks about you!", "key": "yourearealherothewholevillagetalksaboutyou", "g": ""}, {"id": "e0264_bento", "role": "bento", "text": "Halt! Route 1 is full of restless monsters.", "tts": "Halt! Route 1 is full of restless monsters.", "key": "haltrouteisfullofrestlessmonsters", "g": ""}, {"id": "e0265_bento", "role": "bento", "text": "This trail to the Hidden Lake is dangerous. Prove you're strong by beating Davi first!", "tts": "This trail to the Hidden Lake is dangerous. Prove you're strong by beating Davi first!", "key": "thistrailtothehiddenlakeisdangerousproveyourestrongbybeatingdavifirst", "g": ""}, {"id": "e0266_bento", "role": "bento", "text": "Guard Bento needs help here in the village. Talk to him first!", "tts": "Guard Bento needs help here in the village. Talk to him first!", "key": "guardbentoneedshelphereinthevillagetalktohimfirst", "g": ""}, {"id": "e0267_narr", "role": "narr", "text": "HEROIC SPIN!", "tts": "HEROIC SPIN!", "key": "heroicspin", "g": ""}, {"id": "e0268_iara3", "role": "iara3", "text": "I think there's a fossil buried in the southeast corner, near the rocks. Can you look for the shine in the sand?", "tts": "I think there's a fossil buried in the southeast corner, near the rocks. Can you look for the shine in the sand?", "key": "ithinktheresafossilburiedinthesoutheastcornerneartherockscanyoulookfortheshineinthesand", "g": ""}, {"id": "e0269_iara3", "role": "iara3", "text": "The desert keeps many secrets. One day I'll find the Echo Cave!", "tts": "The desert keeps many secrets. One day I'll find the Echo Cave!", "key": "thedesertkeepsmanysecretsonedayillfindtheechocave", "g": ""}, {"id": "e0270_iara3", "role": "iara3", "text": "Wow! This belongs to a Rock monster from thousands of years ago! Here, for your help.", "tts": "Wow! This belongs to a Rock monster from thousands of years ago! Here, for your help.", "key": "wowthisbelongstoarockmonsterfromthousandsofyearsagohereforyourhelp", "g": ""}, {"id": "e0271_narr", "role": "narr", "text": "DOWNLOAD", "tts": "DOWNLOAD", "key": "download", "g": ""}, {"id": "e0272_narr", "role": "narr", "text": "ELECTRIFIED water jet: hits the whole line, pushes and can stun", "tts": "ELECTRIFIED water jet: hits the whole line, pushes and can stun", "key": "electrifiedwaterjethitsthewholelinepushesandcanstun", "g": ""}, {"id": "e0273_narr", "role": "narr", "text": "hits everyone, pushes and slows", "tts": "hits everyone, pushes and slows", "key": "hitseveryonepushesandslows", "g": ""}, {"id": "e0274_narr", "role": "narr", "text": "medium, pushes", "tts": "medium, pushes", "key": "mediumpushes", "g": ""}, {"id": "e0275_narr", "role": "narr", "text": "Playing the Arena with someone else only works in the App (the game opened from the phone icon). Both of you need to open it through the App.", "tts": "Playing the Arena with someone else only works in the App (the game opened from the phone icon). Both of you need to open it through the App.", "key": "playingthearenawithsomeoneelseonlyworksintheappthegameopenedfromthephoneiconbothofyouneedtoopenitthroughtheapp", "g": ""}, {"id": "e0276_narr", "role": "narr", "text": "Playing offline only works in the App (the game icon on the phone's home screen).", "tts": "Playing offline only works in the App (the game icon on the phone's home screen).", "key": "playingofflineonlyworksintheappthegameicononthephoneshomescreen", "g": ""}, {"id": "e0277_juca", "role": "juca", "text": "Oh no, my bike broke down right in the middle of the forest trail!", "tts": "Oh no, my bike broke down right in the middle of the forest trail!", "key": "ohnomybikebrokedownrightinthemiddleoftheforesttrail", "g": ""}, {"id": "e0278_juca", "role": "juca", "text": "Brrr... you won. Have some hot tea!", "tts": "Brrr... you won. Have some hot tea!", "key": "brrryouwonhavesomehottea", "g": ""}, {"id": "e0279_juca", "role": "juca", "text": "I dropped my WRENCH in the tall grass of Route 1, north of the village. Can you find it for me? There'll be a shine on the ground.", "tts": "I dropped my WRENCH in the tall grass of Route 1, north of the village. Can you find it for me? There'll be a shine on the ground.", "key": "idroppedmywrenchinthetallgrassofroutenorthofthevillagecanyoufinditformetherellbeashineontheground", "g": ""}, {"id": "e0280_juca", "role": "juca", "text": "Hey! My bike broke down right here on the forest trail and I can't get it out of the way.", "tts": "Hey! My bike broke down right here on the forest trail and I can't get it out of the way.", "key": "heymybikebrokedownrighthereontheforesttrailandicantgetitoutoftheway", "g": ""}, {"id": "e0281_juca", "role": "juca", "text": "Workshop saved! Here, have some capsules.", "tts": "Workshop saved! Here, have some capsules.", "key": "workshopsavedherehavesomecapsules", "g": ""}, {"id": "e0282_juca", "role": "juca", "text": "I lost my WRENCH in the tall grass of Route 1. Without it I can't move the bike from here.", "tts": "I lost my WRENCH in the tall grass of Route 1. Without it I can't move the bike from here.", "key": "ilostmywrenchinthetallgrassofroutewithoutiticantmovethebikefromhere", "g": ""}, {"id": "e0283_juca", "role": "juca", "text": "There, bike fixed! Thanks! Now the Ancient Forest trail is clear.", "tts": "There, bike fixed! Thanks! Now the Ancient Forest trail is clear.", "key": "therebikefixedthanksnowtheancientforesttrailisclear", "g": ""}, {"id": "e0284_juca", "role": "juca", "text": "Almost! Again?", "tts": "Almost! Again?", "key": "almostagain", "g": ""}, {"id": "e0285_juca", "role": "juca", "text": "Will you hold them off on the WALL for me?", "tts": "Will you hold them off on the WALL for me?", "key": "willyouholdthemoffonthewallforme", "g": ""}, {"id": "e0286_juca", "role": "juca", "text": "I've climbed this trail a thousand times. Let's see if you can handle the cold!", "tts": "I've climbed this trail a thousand times. Let's see if you can handle the cold!", "key": "iveclimbedthistrailathousandtimesletsseeifyoucanhandlethecold", "g": ""}, {"id": "e0287_juca", "role": "juca", "text": "Some monsters want to chew the tires at my workshop!", "tts": "Some monsters want to chew the tires at my workshop!", "key": "somemonsterswanttochewthetiresatmyworkshop", "g": ""}, {"id": "e0288_juca", "role": "juca", "text": "Vroom vroom! The bike is flying!", "tts": "Vroom vroom! The bike is flying!", "key": "vroomvroomthebikeisflying", "g": ""}, {"id": "e0289_narr", "role": "narr", "text": "replay it to train and collect coins", "tts": "replay it to train and collect coins", "key": "replayittotrainandcollectcoins", "g": ""}, {"id": "e0290_kai3", "role": "kai3", "text": "It's still there! Try again, please!", "tts": "It's still there! Try again, please!", "key": "itsstilltheretryagainplease", "g": ""}, {"id": "e0291_kai3", "role": "kai3", "text": "My Pinguinho got strong! Battle me? I want to be a guardian like you!", "tts": "My Pinguinho got strong! Battle me? I want to be a guardian like you!", "key": "mypinguinhogotstrongbattlemeiwanttobeaguardianlikeyou", "g": ""}, {"id": "e0292_kai3", "role": "kai3", "text": "My little penguin loves sliding on the ice!", "tts": "My little penguin loves sliding on the ice!", "key": "mylittlepenguinlovesslidingontheice", "g": ""}, {"id": "e0293_kai3", "role": "kai3", "text": "Protect it with the WALL, please!", "tts": "Protect it with the WALL, please!", "key": "protectitwiththewallplease", "g": ""}, {"id": "e0294_kai3", "role": "kai3", "text": "Help! Some angry monsters surrounded my penguin friend at the lake!", "tts": "Help! Some angry monsters surrounded my penguin friend at the lake!", "key": "helpsomeangrymonsterssurroundedmypenguinfriendatthelake", "g": ""}, {"id": "e0295_kai3", "role": "kai3", "text": "One day I'll beat you!", "tts": "One day I'll beat you!", "key": "onedayillbeatyou", "g": ""}, {"id": "e0296_kai3", "role": "kai3", "text": "One day I'll be a guardian like you!", "tts": "One day I'll be a guardian like you!", "key": "onedayillbeaguardianlikeyou", "g": ""}, {"id": "e0297_kai3", "role": "kai3", "text": "You saved it! Look... there's another penguin here that wants to go with you!", "tts": "You saved it! Look... there's another penguin here that wants to go with you!", "key": "yousaveditlooktheresanotherpenguinherethatwantstogowithyou", "g": ""}, {"id": "e0298_kai3", "role": "kai3", "text": "You're my hero. Here!", "tts": "You're my hero. Here!", "key": "youremyherohere", "g": ""}, {"id": "e0299_narr", "role": "narr", "text": "Okay, okay! Take this old bike!", "tts": "Okay, okay! Take this old bike!", "key": "okayokaytakethisoldbike", "g": ""}, {"id": "e0300_narr", "role": "narr", "text": "up close it releases a cone of fire that goes through everyone; from afar, a fireball", "tts": "up close it releases a cone of fire that goes through everyone; from afar, a fireball", "key": "upcloseitreleasesaconeoffirethatgoesthrougheveryonefromafarafireball", "g": ""}, {"id": "e0301_narr", "role": "narr", "text": "strong cone up close, fireball from afar", "tts": "strong cone up close, fireball from afar", "key": "strongconeupclosefireballfromafar", "g": ""}, {"id": "e0302_narr", "role": "narr", "text": "medium and strong", "tts": "medium and strong", "key": "mediumandstrong", "g": ""}, {"id": "e0303_narr", "role": "narr", "text": "Village Friend. No coin value set.", "tts": "Village Friend. No coin value set.", "key": "villagefriendnocoinvalueset", "g": ""}, {"id": "e0304_treinador3", "role": "treinador3", "text": "The last frontier. Nobody has ever made it this far!", "tts": "The last frontier. Nobody has ever made it this far!", "key": "thelastfrontiernobodyhasevermadeitthisfar", "g": ""}, {"id": "e0305_treinador3", "role": "treinador3", "text": "Here ghosts and owls come out of the tall grass. The monsters here are much stronger, huh!", "tts": "Here ghosts and owls come out of the tall grass. The monsters here are much stronger, huh!", "key": "hereghostsandowlscomeoutofthetallgrassthemonstersherearemuchstrongerhuh", "g": ""}, {"id": "e0306_treinador3", "role": "treinador3", "text": "Shall we explore? Your team walks and fights on its own.", "tts": "Shall we explore? Your team walks and fights on its own.", "key": "shallweexploreyourteamwalksandfightsonitsown", "g": ""}, {"id": "e0307_treinador3", "role": "treinador3", "text": "World 2 has started! The monsters here are much stronger.", "tts": "World 2 has started! The monsters here are much stronger.", "key": "worldhasstartedthemonstersherearemuchstronger", "g": ""}, {"id": "e0308_treinador3", "role": "treinador3", "text": "From here on, fire, water and lightning monsters show up.", "tts": "From here on, fire, water and lightning monsters show up.", "key": "fromhereonfirewaterandlightningmonstersshowup", "g": ""}, {"id": "e0309_treinador3", "role": "treinador3", "text": "Make your team strong and get past it!", "tts": "Make your team strong and get past it!", "key": "makeyourteamstrongandgetpastit", "g": ""}, {"id": "e0310_treinador3", "role": "treinador3", "text": "They say there's a lost valley after stage 10...", "tts": "They say there's a lost valley after stage 10...", "key": "theysaytheresalostvalleyafterstage", "g": ""}, {"id": "e0311_treinador3", "role": "treinador3", "text": "Hey! A new trainer around here? Let's see what you can do!", "tts": "Hey! A new trainer around here? Let's see what you can do!", "key": "heyanewtraineraroundhereletsseewhatyoucando", "g": ""}, {"id": "e0312_treinador3", "role": "treinador3", "text": "There's a huge boss waiting at stage 5.", "tts": "There's a huge boss waiting at stage 5.", "key": "theresahugebosswaitingatstage", "g": ""}, {"id": "e0313_treinador3", "role": "treinador3", "text": "Fog, poison and huge bosses. Bring fire monsters!", "tts": "Fog, poison and huge bosses. Bring fire monsters!", "key": "fogpoisonandhugebossesbringfiremonsters", "g": ""}, {"id": "e0314_treinador3", "role": "treinador3", "text": "In the desert the sun is brutal and the enemies come in packs.", "tts": "In the desert the sun is brutal and the enemies come in packs.", "key": "inthedesertthesunisbrutalandtheenemiescomeinpacks", "g": ""}, {"id": "e0315_treinador3", "role": "treinador3", "text": "I lost! You're really good.", "tts": "I lost! You're really good.", "key": "ilostyourereallygood", "g": ""}, {"id": "e0316_treinador3", "role": "treinador3", "text": "Lightning everywhere! Rock monsters help a lot.", "tts": "Lightning everywhere! Rock monsters help a lot.", "key": "lightningeverywhererockmonstershelpalot", "g": ""}, {"id": "e0317_treinador3", "role": "treinador3", "text": "Only the greatest explorers made it this far. Go for it!", "tts": "Only the greatest explorers made it this far. Go for it!", "key": "onlythegreatestexplorersmadeitthisfargoforit", "g": ""}, {"id": "e0318_treinador3", "role": "treinador3", "text": "Swap your team by tapping the monsters if you need to!", "tts": "Swap your team by tapping the monsters if you need to!", "key": "swapyourteambytappingthemonstersifyouneedto", "g": ""}, {"id": "e0319_treinador3", "role": "treinador3", "text": "Use the Expedition upgrades and the Power Cards.", "tts": "Use the Expedition upgrades and the Power Cards.", "key": "usetheexpeditionupgradesandthepowercards", "g": ""}, {"id": "e0320_treinador3", "role": "treinador3", "text": "You really have a knack for this! Train a bit more and go challenge Bruna.", "tts": "You really have a knack for this! Train a bit more and go challenge Bruna.", "key": "youreallyhaveaknackforthistrainabitmoreandgochallengebruna", "g": ""}, {"id": "e0321_treinador3", "role": "treinador3", "text": "Come back every now and then to check your progress. Complete 2 stages!", "tts": "Come back every now and then to check your progress. Complete 2 stages!", "key": "comebackeverynowandthentocheckyourprogresscompletestages", "g": ""}, {"id": "e0322_lia", "role": "lia", "text": "Now I'll get out of the way. Route 2 is right up there, watch out for the Shadow Gang!", "tts": "Now I'll get out of the way. Route 2 is right up there, watch out for the Shadow Gang!", "key": "nowillgetoutofthewayrouteisrightuptherewatchoutfortheshadowgang", "g": ""}, {"id": "e0323_lia", "role": "lia", "text": "The shadows told me you would come... Get ready!", "tts": "The shadows told me you would come... Get ready!", "key": "theshadowstoldmeyouwouldcomegetready", "g": ""}, {"id": "e0324_lia", "role": "lia", "text": "The shadows were wrong. You're strong!", "tts": "The shadows were wrong. You're strong!", "key": "theshadowswerewrongyourestrong", "g": ""}, {"id": "e0325_lia", "role": "lia", "text": "Waaah! A bandit from the Shadow Gang STOLE my bike!", "tts": "Waaah! A bandit from the Shadow Gang STOLE my bike!", "key": "waaahabanditfromtheshadowgangstolemybike", "g": ""}, {"id": "e0326_lia", "role": "lia", "text": "He's strong... heal your team at the Healing Center and try again!", "tts": "He's strong... heal your team at the Healing Center and try again!", "key": "hesstronghealyourteamatthehealingcenterandtryagain", "g": ""}, {"id": "e0327_lia", "role": "lia", "text": "I'll stay here watching the bridge so he doesn't run away. Talk to me when you can help!", "tts": "I'll stay here watching the bridge so he doesn't run away. Talk to me when you can help!", "key": "illstayherewatchingthebridgesohedoesntrunawaytalktomewhenyoucanhelp", "g": ""}, {"id": "e0328_lia", "role": "lia", "text": "My bike is good as new, look!", "tts": "My bike is good as new, look!", "key": "mybikeisgoodasnewlook", "g": ""}, {"id": "e0329_lia", "role": "lia", "text": "A bandit from the Shadow Gang stole my bike! He's hiding back there in the grass. There he is!", "tts": "A bandit from the Shadow Gang stole my bike! He's hiding back there in the grass. There he is!", "key": "abanditfromtheshadowgangstolemybikeheshidingbackthereinthegrassthereheis", "g": ""}, {"id": "e0330_lia", "role": "lia", "text": "Are you the trainer who beat Bruna? Help me, please!", "tts": "Are you the trainer who beat Bruna? Help me, please!", "key": "areyouthetrainerwhobeatbrunahelpmeplease", "g": ""}, {"id": "e0331_loja", "role": "loja", "text": "Welcome to the Tide Shop! Take a look.", "tts": "Welcome to the Tide Shop! Take a look.", "key": "welcometothetideshoptakealook", "g": ""}, {"id": "e0332_narr", "role": "narr", "text": "chests, amulets and coins", "tts": "chests, amulets and coins", "key": "chestsamuletsandcoins", "g": ""}, {"id": "e0333_capitao2", "role": "capitao2", "text": "Until the lake is clean, the port's crates stay here on the road.", "tts": "Until the lake is clean, the port's crates stay here on the road.", "key": "untilthelakeiscleantheportscratesstayhereontheroad", "g": ""}, {"id": "e0334_capitao2", "role": "capitao2", "text": "Nobody gets through! Some bandits dirtied the Blue Lake and scared the fish away...", "tts": "Nobody gets through! Some bandits dirtied the Blue Lake and scared the fish away...", "key": "nobodygetsthroughsomebanditsdirtiedthebluelakeandscaredthefishaway", "g": ""}, {"id": "e0335_loja", "role": "loja", "text": "Welcome to the Sun Oasis! I have everything for your trip.", "tts": "Welcome to the Sun Oasis! I have everything for your trip.", "key": "welcometothesunoasisihaveeverythingforyourtrip", "g": ""}, {"id": "e0336_loja", "role": "loja", "text": "Fresh water! Oops, I mean... fresh items!", "tts": "Fresh water! Oops, I mean... fresh items!", "key": "freshwateroopsimeanfreshitems", "g": ""}, {"id": "e0337_brasa", "role": "brasa", "text": "We did it! The volcano calmed down.", "tts": "We did it! The volcano calmed down.", "key": "wediditthevolcanocalmeddown", "g": ""}, {"id": "e0338_brasa", "role": "brasa", "text": "Guardian of the Valley, I bow to you.", "tts": "Guardian of the Valley, I bow to you.", "key": "guardianofthevalleyibowtoyou", "g": ""}, {"id": "e0339_brasa", "role": "brasa", "text": "Aurorion felt your courage. It's still out there, somewhere in the Valley.", "tts": "Aurorion felt your courage. It's still out there, somewhere in the Valley.", "key": "aurorionfeltyourcourageitsstillouttheresomewhereinthevalley", "g": ""}, {"id": "e0340_brasa", "role": "brasa", "text": "The fire still burns. Make your team stronger and come back!", "tts": "The fire still burns. Make your team stronger and come back!", "key": "thefirestillburnsmakeyourteamstrongerandcomeback", "g": ""}, {"id": "e0341_brasa", "role": "brasa", "text": "The volcano's fire is the Valley's strength. It can't fall into the wrong hands.", "tts": "The volcano's fire is the Valley's strength. It can't fall into the wrong hands.", "key": "thevolcanosfireisthevalleysstrengthitcantfallintothewronghands", "g": ""}, {"id": "e0342_brasa", "role": "brasa", "text": "The volcano is waking up and a horde of fire monsters is coming out of the lava!", "tts": "The volcano is waking up and a horde of fire monsters is coming out of the lava!", "key": "thevolcanoiswakingupandahordeoffiremonstersiscomingoutofthelava", "g": ""}, {"id": "e0343_brasa", "role": "brasa", "text": "Few can stand the crater's heat like you.", "tts": "Few can stand the crater's heat like you.", "key": "fewcanstandthecratersheatlikeyou", "g": ""}, {"id": "e0344_brasa", "role": "brasa", "text": "I consider you my apprentice.", "tts": "I consider you my apprentice.", "key": "iconsideryoumyapprentice", "g": ""}, {"id": "e0345_brasa", "role": "brasa", "text": "Training near the lava keeps your courage hot!", "tts": "Training near the lava keeps your courage hot!", "key": "trainingnearthelavakeepsyourcouragehot", "g": ""}, {"id": "e0346_brasa", "role": "brasa", "text": "You have the heart of a true guardian.", "tts": "You have the heart of a true guardian.", "key": "youhavetheheartofatrueguardian", "g": ""}, {"id": "e0347_brasa", "role": "brasa", "text": "It's now, guardian! Defend the Valley on the WALL!", "tts": "It's now, guardian! Defend the Valley on the WALL!", "key": "itsnowguardiandefendthevalleyonthewall", "g": ""}, {"id": "e0348_narr", "role": "narr", "text": "open another tab of this browser and type the code.", "tts": "open another tab of this browser and type the code.", "key": "openanothertabofthisbrowserandtypethecode", "g": ""}, {"id": "e0349_narr", "role": "narr", "text": "Wild monsters will march along the trail to the Valley gate!", "tts": "Wild monsters will march along the trail to the Valley gate!", "key": "wildmonsterswillmarchalongthetrailtothevalleygate", "g": ""}, {"id": "e0350_narr", "role": "narr", "text": "new results screen with up to 3 STARS (the more HP left, the more stars) and extra coins per star.", "tts": "new results screen with up to 3 STARS (the more HP left, the more stars) and extra coins per star.", "key": "newresultsscreenwithuptostarsthemorehpleftthemorestarsandextracoinsperstar", "g": ""}, {"id": "e0351_enf", "role": "enf", "text": "Rest here for a bit.", "tts": "Rest here for a bit.", "key": "resthereforabit", "g": ""}, {"id": "e0352_enf", "role": "enf", "text": "Starting your journey? Take these 3 Potions, just in case.", "tts": "Starting your journey? Take these 3 Potions, just in case.", "key": "startingyourjourneytakethesepotionsjustincase", "g": ""}, {"id": "e0353_narr", "role": "narr", "text": "+1 ATTACK forever (max +10).", "tts": "+1 ATTACK forever (max +10).", "key": "attackforevermax", "g": ""}, {"id": "e0354_narr", "role": "narr", "text": "In the ARENA, you pick the 5 monsters of your DECK in the Arena menu. Catch more monsters to have more options!", "tts": "In the ARENA, you pick the 5 monsters of your DECK in the Arena menu. Catch more monsters to have more options!", "key": "inthearenayoupickthemonstersofyourdeckinthearenamenucatchmoremonsterstohavemoreoptions", "g": ""}, {"id": "e0355_narr", "role": "narr", "text": "No gifts to claim right now. Come back later!", "tts": "No gifts to claim right now. Come back later!", "key": "nogiftstoclaimrightnowcomebacklater", "g": ""}, {"id": "e0356_nina", "role": "nina", "text": "Help it defend itself! Use the TOWERS to protect the trail!", "tts": "Help it defend itself! Use the TOWERS to protect the trail!", "key": "helpitdefenditselfusethetowerstoprotectthetrail", "g": ""}, {"id": "e0357_nina", "role": "nina", "text": "It's still in danger! Try again, please!", "tts": "It's still in danger! Try again, please!", "key": "itsstillindangertryagainplease", "g": ""}, {"id": "e0358_nina", "role": "nina", "text": "I drew you and your partner! It looks beautiful!", "tts": "I drew you and your partner! It looks beautiful!", "key": "idrewyouandyourpartneritlooksbeautiful", "g": ""}, {"id": "e0359_nina", "role": "nina", "text": "I want to meet ALL the monsters in the Valley!", "tts": "I want to meet ALL the monsters in the Valley!", "key": "iwanttomeetallthemonstersinthevalley", "g": ""}, {"id": "e0360_nina", "role": "nina", "text": "I'm drawing ALL the monsters in the Valley in my notebook!", "tts": "I'm drawing ALL the monsters in the Valley in my notebook!", "key": "imdrawingallthemonstersinthevalleyinmynotebook", "g": ""}, {"id": "e0361_nina", "role": "nina", "text": "Will you show me 8 different monsters you caught?", "tts": "Will you show me 8 different monsters you caught?", "key": "willyoushowmedifferentmonstersyoucaught", "g": ""}, {"id": "e0362_nina", "role": "nina", "text": "When I grow up I want to be just like you!", "tts": "When I grow up I want to be just like you!", "key": "whenigrowupiwanttobejustlikeyou", "g": ""}, {"id": "e0363_nina", "role": "nina", "text": "Did you know Pipiu sleeps with one eye open? It's true!", "tts": "Did you know Pipiu sleeps with one eye open? It's true!", "key": "didyouknowpipiusleepswithoneeyeopenitstrue", "g": ""}, {"id": "e0364_nina", "role": "nina", "text": "Help! A hurt Ratonga is being surrounded by angry monsters!", "tts": "Help! A hurt Ratonga is being surrounded by angry monsters!", "key": "helpahurtratongaisbeingsurroundedbyangrymonsters", "g": ""}, {"id": "e0365_nina", "role": "nina", "text": "Wow! Now my notebook is beautiful! Here, to catch more.", "tts": "Wow! Now my notebook is beautiful! Here, to catch more.", "key": "wownowmynotebookisbeautifulheretocatchmore", "g": ""}, {"id": "e0366_nina", "role": "nina", "text": "You did it! The Ratonga is so grateful it wants to go with you!", "tts": "You did it! The Ratonga is so grateful it wants to go with you!", "key": "youdidittheratongaissogratefulitwantstogowithyou", "g": ""}, {"id": "e0367_nina", "role": "nina", "text": "Did you see t
