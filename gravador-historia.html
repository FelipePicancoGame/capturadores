<style>
:root{--bg:#f6f1e6;--card:#fff;--ink:#2b2418;--mut:#6d6250;--ac:#2f7a36;--bd:#ddd2bd;--err:#b3261e}
@media (prefers-color-scheme:dark){:root{--bg:#1c1a16;--card:#27241f;--ink:#f1eadb;--mut:#b3a88f;--ac:#6cc070;--bd:#3d382f;--err:#ff8a80}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,sans-serif}
main{max-width:760px;margin:0 auto;padding:16px}
h1{font-size:22px;margin:4px 0 2px}p.s{margin:0 0 14px;color:var(--mut)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin:0 0 14px}
.card h2{font-size:16px;margin:0 0 10px}
input,select,button{font:inherit}input[type=password],input[type=text]{width:100%;padding:10px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--ink)}
button{padding:10px 14px;border:0;border-radius:10px;background:var(--ac);color:#fff;font-weight:600;cursor:pointer}
button.sec{background:transparent;color:var(--ink);border:1px solid var(--bd)}button:disabled{opacity:.45}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:8px 0}
.role{display:grid;grid-template-columns:90px 1fr auto;gap:8px;align-items:center;padding:6px 0;border-top:1px solid var(--bd)}
.role:first-of-type{border-top:0}.role b{font-size:14px}.role select{width:100%;padding:8px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--ink);min-width:0}
.mini{padding:6px 10px;font-size:14px}
#st{white-space:pre-wrap;color:var(--mut);font-size:14px}.err{color:var(--err)}
.ln{display:grid;grid-template-columns:22px 1fr auto;gap:8px;align-items:start;padding:7px 0;border-top:1px solid var(--bd);font-size:14px}
.ln small{color:var(--mut);display:block}.ok{color:var(--ac)}
progress{width:100%;height:14px}
</style></head><body><main>

basdomaroloumahordademonstrinhosestasaindodomar", "g": ""}, {"id": "461_capitao", "role": "capitao", "text": "Quase! Respire e tente de novo.", "tts": "Quase! Respire e tente de novo.", "key": "quaserespireetentedenovo", "g": ""}, {"id": "462_capitao", "role": "capitao", "text": "Recuar não é desistir! Prepare-se e volte.", "tts": "Recuar não é desistir! Prepare-se e volte.", "key": "recuarnaoedesistirprepareseevolte", "g": ""}, {"id": "463_capitao", "role": "capitao", "text": "Vitória! Achei isso num barco do Bando: um mapa do Bosque Sombrio...", "tts": "Vitória! Achei isso num barco do Bando: um mapa do Bosque Sombrio...", "key": "vitoriaacheiissonumbarcodobandoummapadobosquesombrio", "g": ""}, {"id": "464_capitao", "role": "capitao", "text": "Volte amanhã pra revanche, marujo!", "tts": "Volte amanhã pra revanche, marujo!", "key": "volteamanhaprarevanchemarujo", "g": ""}, {"id": "465_celeste", "role": "celeste", "text": "As estrelas já sabiam que você ia vencer.", "tts": "As estrelas já sabiam que você ia vencer.", "key": "asestrelasjasabiamquevoceiavencer", "g": ""}, {"id": "466_celeste", "role": "celeste", "text": "As estrelas me disseram que você viria...", "tts": "As estrelas me disseram que você viria...", "key": "asestrelasmedisseramquevoceviria", "g": ""}, {"id": "467_celeste", "role": "celeste", "text": "As sombras têm medo de você agora.", "tts": "As sombras têm medo de você agora.", "key": "assombrastemmedodevoceagora", "g": ""}, {"id": "468_celeste", "role": "celeste", "text": "Nossas estrelas estão ligadas para sempre.", "tts": "Nossas estrelas estão ligadas para sempre.", "key": "nossasestrelasestaoligadasparasempre", "g": ""}, {"id": "469_celeste", "role": "celeste", "text": "Obrigada! Ele gostou tanto de você que quer te acompanhar.", "tts": "Obrigada! Ele gostou tanto de você que quer te acompanhar.", "key": "obrigadaelegostoutantodevocequequerteacompanhar", "g": ""}, {"id": "470_celeste", "role": "celeste", "text": "Os fantasmas do bosque não são maus. Só estão perdidos.", "tts": "Os fantasmas do bosque não são maus. Só estão perdidos.", "key": "osfantasmasdobosquenaosaomaussoestaoperdidos", "g": ""}, {"id": "471_celeste", "role": "celeste", "text": "Sinto uma luz forte em você. Parecida com a do Aurorion.", "tts": "Sinto uma luz forte em você. Parecida com a do Aurorion.", "key": "sintoumaluzforteemvoceparecidacomadoaurorion", "g": ""}, {"id": "472_celeste", "role": "celeste", "text": "Um pequeno Assombro se perdeu da família e está chorando no sul do bosque.", "tts": "Um pequeno Assombro se perdeu da família e está chorando no sul do bosque.", "key": "umpequenoassombroseperdeudafamiliaeestachorandonosuldobosque", "g": ""}, {"id": "473_celeste", "role": "celeste", "text": "Você ilumina até o Bosque Sombrio.", "tts": "Você ilumina até o Bosque Sombrio.", "key": "voceiluminaateobosquesombrio", "g": ""}, {"id": "474_corvo", "role": "corvo", "text": "Com o fogo deste vulcão vou acordar o Aurorion e prender a aurora pra sempre! O Vale será do BANDO SOMBRA!", "tts": "Com o fogo deste vulcão vou acordar o Aurorion e prender a aurora pra sempre! O Vale será do BANDO SOMBRA!", "key": "comofogodestevulcaovouacordaroaurorioneprenderaauroraprasempreovaleseradobandosombra", "g": ""}, {"id": "475_corvo", "role": "corvo", "text": "Então você é o famoso treinador que derrotou meus capangas.", "tts": "Então você é o famoso treinador que derrotou meus capangas.", "key": "entaovoceeofamosotreinadorquederrotoumeuscapangas", "g": ""}, {"id": "476_corvo", "role": "corvo", "text": "Impossível... meus cristais...!", "tts": "Impossível... meus cristais...!", "key": "impossivelmeuscristais", "g": ""}, {"id": "477_corvo", "role": "corvo", "text": "Não! Os cristais estão rachando!", "tts": "Não! Os cristais estão rachando!", "key": "naooscristaisestaorachando", "g": ""}, {"id": "478_corvo", "role": "corvo", "text": "Não... não pode ser!", "tts": "Não... não pode ser!", "key": "naonaopodeser", "g": ""}, {"id": "479_corvo", "role": "corvo", "text": "Os cristais já estão prendendo o Aurorion. Com a luz dele, o Bando Sombra vai mandar no Vale pra sempre!", "tts": "Os cristais já estão prendendo o Aurorion. Com a luz dele, o Bando Sombra vai mandar no Vale pra sempre!", "key": "oscristaisjaestaoprendendooaurorioncomaluzdeleobandosombravaimandarnovaleprasempre", "g": ""}, {"id": "480_corvo", "role": "corvo", "text": "Se quer ele de volta... venha pegar!", "tts": "Se quer ele de volta... venha pegar!", "key": "sequereledevoltavenhapegar", "g": ""}, {"id": "481_corvo", "role": "corvo", "text": "Você de novo?! Chegou tarde, guardião.", "tts": "Você de novo?! Chegou tarde, guardião.", "key": "vocedenovochegoutardeguardiao", "g": ""}, {"id": "482_corvo", "role": "corvo", "text": "Você venceu... mas já é tarde! Eu acordei o vulcão! Ha ha ha!", "tts": "Você venceu... mas já é tarde! Eu acordei o vulcão! Ha ha ha!", "key": "vocevenceumasjaetardeeuacordeiovulcaohahaha", "g": ""}, {"id": "483_davi", "role": "davi", "text": "...Tá bom, admito: você é bom. Mas eu vou ser melhor!", "tts": "...Tá bom, admito: você é bom. Mas eu vou ser melhor!", "key": "tabomadmitovoceebommaseuvousermelhor", "g": ""}, {"id": "484_davi", "role": "davi", "text": "...Tá. Você venceu. O Bando Sombra foi visto no Bosque Sombrio. Vai lá, eu cuido do porto.", "tts": "...Tá. Você venceu. O Bando Sombra foi visto no Bosque Sombrio. Vai lá, eu cuido do porto.", "key": "tavocevenceuobandosombrafoivistonobosquesombriovailaeucuidodoporto", "g": ""}, {"id": "485_davi", "role": "davi", "text": "...Você tá pronto. Vai lá e mostra pra eles!", "tts": "...Você tá pronto. Vai lá e mostra pra eles!", "key": "vocetaprontovailaemostrapraeles", "g": ""}, {"id": "486_davi", "role": "davi", "text": "...Você é demais. Vai na frente. Eu cuido da vila!", "tts": "...Você é demais. Vai na frente. Eu cuido da vila!", "key": "voceedemaisvainafrenteeucuidodavila", "g": ""}, {"id": "487_davi", "role": "davi", "text": "Achou que ia salvar o Aurorion sozinho? Eu também quero ajudar!", "tts": "Achou que ia salvar o Aurorion sozinho? Eu também quero ajudar!", "key": "achouqueiasalvaroaurorionsozinhoeutambemqueroajudar", "g": ""}, {"id": "488_davi", "role": "davi", "text": "Cheguei antes de você dessa vez! Antes de enfrentar o Corvo, quero uma última batalha.", "tts": "Cheguei antes de você dessa vez! Antes de enfrentar o Corvo, quero uma última batalha.", "key": "chegueiantesdevocedessavezantesdeenfrentarocorvoqueroumaultimabatalha", "g": ""}, {"id": "489_davi", "role": "davi", "text": "De novo?! Como você ficou tão forte?", "tts": "De novo?! Como você ficou tão forte?", "key": "denovocomovoceficoutaoforte", "g": ""}, {"id": "490_davi", "role": "davi", "text": "Então é você que anda salvando a vila? Eu sou o Davi.", "tts": "Então é você que anda salvando a vila? Eu sou o Davi.", "key": "entaoevocequeandasalvandoavilaeusouodavi", "g": ""}, {"id": "491_davi", "role": "davi", "text": "Hmpf. Ainda acha que consegue me alcançar?", "tts": "Hmpf. Ainda acha que consegue me alcançar?", "key": "hmpfaindaachaqueconseguemealcancar", "g": ""}, {"id": "492_davi", "role": "davi", "text": "Hmpf... tá bom, você é bom. Mas eu vou treinar e te alcançar!", "tts": "Hmpf... tá bom, você é bom. Mas eu vou treinar e te alcançar!", "key": "hmpftabomvoceebommaseuvoutreinaretealcancar", "g": ""}, {"id": "493_davi", "role": "davi", "text": "Mas antes... a última batalha. Quem ganhar vai na frente!", "tts": "Mas antes... a última batalha. Quem ganhar vai na frente!", "key": "masantesaultimabatalhaquemganharvainafrente", "g": ""}, {"id": "494_davi", "role": "davi", "text": "O quê?! Foi sorte! Na próxima eu ganho!", "tts": "O quê?! Foi sorte! Na próxima eu ganho!", "key": "oquefoisortenaproximaeuganho", "g": ""}, {"id": "495_davi", "role": "davi", "text": "Quero ser o Campeão do Vale. E você vai ser meu maior rival, ouviu?", "tts": "Quero ser o Campeão do Vale. E você vai ser meu maior rival, ouviu?", "key": "queroserocampeaodovaleevocevaisermeumaiorrivalouviu", "g": ""}, {"id": "496_davi", "role": "davi", "text": "Revanche! Agora é pra valer!", "tts": "Revanche! Agora é pra valer!", "key": "revancheagoraepravaler", "g": ""}, {"id": "497_davi", "role": "davi", "text": "Se o Bando Sombra mexer com você, me chama. A gente acaba com eles juntos!", "tts": "Se o Bando Sombra mexer com você, me chama. A gente acaba com eles juntos!", "key": "seobandosombramexercomvocemechamaagenteacabacomelesjuntos", "g": ""}, {"id": "498_davi", "role": "davi", "text": "Se você não ganhar de mim, não tem chance contra ele!", "tts": "Se você não ganhar de mim, não tem chance contra ele!", "key": "sevocenaoganhardemimnaotemchancecontraele", "g": ""}, {"id": "499_davi", "role": "davi", "text": "Soube que você salvou o porto. Grande coisa! Eu também treinei muito.", "tts": "Soube que você salvou o porto. Grande coisa! Eu também treinei muito.", "key": "soubequevocesalvouoportograndecoisaeutambemtreineimuito", "g": ""}, {"id": "500_davi", "role": "davi", "text": "Também ganhei monstrinhos e treinei bastante. Vou ser o melhor treinador do Vale. Vamos ver quem é mais forte!", "tts": "Também ganhei monstrinhos e treinei bastante. Vou ser o melhor treinador do Vale. Vamos ver quem é mais forte!", "key": "tambemganheimonstrinhosetreineibastantevouseromelhortreinadordovalevamosverquememaisforte", "g": ""}, {"id": "501_davi", "role": "davi", "text": "Toma, leva isso. E volta inteiro, viu? Senão eu fico sem rival!", "tts": "Toma, leva isso. E volta inteiro, viu? Senão eu fico sem rival!", "key": "tomalevaissoevoltainteiroviusenaoeuficosemrival", "g": ""}, {"id": "502_davi", "role": "davi", "text": "Toma, o melhor que eu tenho. Agora vai lá no Templo e acaba com o Corvo!", "tts": "Toma, o melhor que eu tenho. Agora vai lá no Templo e acaba com o Corvo!", "key": "tomaomelhorqueeutenhoagoravailanotemploeacabacomocorvo", "g": ""}, {"id": "503_davi", "role": "davi", "text": "Treinei a noite toda. Hoje eu ganho de você!", "tts": "Treinei a noite toda. Hoje eu ganho de você!", "key": "treineianoitetodahojeeuganhodevoce", "g": ""}, {"id": "504_davi", "role": "davi", "text": "Você é meu melhor amigo... mas não conta pra ninguém!", "tts": "Você é meu melhor amigo... mas não conta pra ninguém!", "key": "voceemeumelhoramigomasnaocontapraninguem", "g": ""}, {"id": "505_lu", "role": "lu", "text": "Casa boa é casa com quintal pros monstrinhos, meu bem!", "tts": "Casa boa é casa com quintal pros monstrinhos, meu bem!", "key": "casaboaecasacomquintalprosmonstrinhosmeubem", "g": ""}, {"id": "506_lu", "role": "lu", "text": "Já viu o pôr do sol daqui? Valoriza qualquer imóvel!", "tts": "Já viu o pôr do sol daqui? Valoriza qualquer imóvel!", "key": "javiuopordosoldaquivalorizaqualquerimovel", "g": ""}, {"id": "507_lu", "role": "lu", "text": "Meu Florina cuida das plantas da vila inteira.", "tts": "Meu Florina cuida das plantas da vila inteira.", "key": "meuflorinacuidadasplantasdavilainteira", "g": ""}, {"id": "508_lu", "role": "lu", "text": "Olá, meu bem! Sou a Dona Lu, corretora da vila. Tenho uma CASINHA com quintal perfeita pra montar uma CRECHE de monstrinhos!", "tts": "Olá, meu bem! Sou a Dona Lu, corretora da vila. Tenho uma CASINHA com quintal perfeita pra montar uma CRECHE de monstrinhos!", "key": "olameubemsouadonalucorretoradavilatenhoumacasinhacomquintalperfeitapramontarumacrechedemonstrinhos", "g": ""}, {"id": "509_lu", "role": "lu", "text": "Parabéns! A casa é SUA! A Vovó Lina já está arrumando o quintal pra creche.", "tts": "Parabéns! A casa é SUA! A Vovó Lina já está arrumando o quintal pra creche.", "key": "parabensacasaesuaavovolinajaestaarrumandooquintalpracreche", "g": ""}, {"id": "510_lu", "role": "lu", "text": "Pode passar aqui pra um cafezinho quando quiser.", "tts": "Pode passar aqui pra um cafezinho quando quiser.", "key": "podepassaraquipraumcafezinhoquandoquiser", "g": ""}, {"id": "511_lu", "role": "lu", "text": "Se eu tivesse um neto, queria que fosse igualzinho a você!", "tts": "Se eu tivesse um neto, queria que fosse igualzinho a você!", "key": "seeutivesseumnetoqueriaquefosseigualzinhoavoce", "g": ""}, {"id": "512_lu", "role": "lu", "text": "Você é o cliente mais simpático que eu já tive!", "tts": "Você é o cliente mais simpático que eu já tive!", "key": "voceeoclientemaissimpaticoqueeujative", "g": ""}, {"id": "513_enf", "role": "enf", "text": "Bem-vinda a Porto Brisa! Deixa eu cuidar da sua equipe.", "tts": "Bem-vinda a Porto Brisa! Deixa eu cuidar da sua equipe.", "key": "bemvindaaportobrisadeixaeucuidardasuaequipe", "g": ""}, {"id": "514_enf", "role": "enf", "text": "Bem-vindo à Vila Lunária! A luz da lua cura qualquer cansaço.", "tts": "Bem-vindo à Vila Lunária! A luz da lua cura qualquer cansaço.", "key": "bemvindoavilalunariaaluzdaluacuraqualquercansaco", "g": ""}, {"id": "515_enf", "role": "enf", "text": "Pronto, todos recuperados. Tome cuidado lá fora!", "tts": "Pronto, todos recuperados. Tome cuidado lá fora!", "key": "prontotodosrecuperadostomecuidadolafora", "g": ""}, {"id": "516_enf", "role": "enf", "text": "Que frio! Deixa eu aquecer sua equipe.", "tts": "Que frio! Deixa eu aquecer sua equipe.", "key": "quefriodeixaeuaquecersuaequipe", "g": ""}, {"id": "517_iara", "role": "iara", "text": "Achei pegadas de um monstrinho ANTIGO aqui nas dunas!", "tts": "Achei pegadas de um monstrinho ANTIGO aqui nas dunas!", "key": "acheipegadasdeummonstrinhoantigoaquinasdunas", "g": ""}, {"id": "518_fe", "role": "fe", "text": "Agachamento deixa as pernas fortes pra correr atrás de monstrinho!", "tts": "Agachamento deixa as pernas fortes pra correr atrás de monstrinho!", "key": "agachamentodeixaaspernasfortespracorreratrasdemonstrinho", "g": ""}, {"id": "519_fe", "role": "fe", "text": "Bora mexer esse corpo! Monstrinho forte, treinador forte!", "tts": "Bora mexer esse corpo! Monstrinho forte, treinador forte!", "key": "boramexeressecorpomonstrinhofortetreinadorforte", "g": ""}, {"id": "520_fe", "role": "fe", "text": "E aí, campeão! Quanto tempo de EXERCÍCIO você fez hoje de verdade? Caminhada, corrida, academia, bicicleta, dança... tudo conta!", "tts": "E aí, campeão! Quanto tempo de EXERCÍCIO você fez hoje de verdade? Caminhada, corrida, academia, bicicleta, dança... tudo conta!", "key": "eaicampeaoquantotempodeexerciciovocefezhojedeverdadecaminhadacorridaacademiabicicletadancatudoconta", "g": ""}, {"id": "521_fe", "role": "fe", "text": "Hidratação é tudo! Até o Marolo concorda.", "tts": "Hidratação é tudo! Até o Marolo concorda.", "key": "hidratacaoetudoateomaroloconcorda", "g": ""}, {"id": "522_fe", "role": "fe", "text": "Já registramos seu treino hoje! Descansa que o músculo cresce no descanso. Volta amanhã!", "tts": "Já registramos seu treino hoje! Descansa que o músculo cresce no descanso. Volta amanhã!", "key": "jaregistramosseutreinohojedescansaqueomusculocrescenodescansovoltaamanha", "g": ""}, {"id": "523_fe", "role": "fe", "text": "Lembra: o importante é a constância. Um pouquinho todo dia!", "tts": "Lembra: o importante é a constância. Um pouquinho todo dia!", "key": "lembraoimportanteeaconstanciaumpouquinhotododia", "g": ""}, {"id": "524_fe", "role": "fe", "text": "Melhor aluno da academia do Vale! Toca aqui!", "tts": "Melhor aluno da academia do Vale! Toca aqui!", "key": "melhoralunodaacademiadovaletocaaqui", "g": ""}, {"id": "525_fe", "role": "fe", "text": "Sem problema! Bora fazer pelo menos 15 minutinhos? Depois volta aqui que eu te dou um bônus!", "tts": "Sem problema! Bora fazer pelo menos 15 minutinhos? Depois volta aqui que eu te dou um bônus!", "key": "semproblemaborafazerpelomenosminutinhosdepoisvoltaaquiqueeutedouumbonus", "g": ""}, {"id": "526_fe", "role": "fe", "text": "Você tá ficando firme, hein! Tô orgulhoso.", "tts": "Você tá ficando firme, hein! Tô orgulhoso.", "key": "vocetaficandofirmeheintoorgulhoso", "g": ""}, {"id": "527_garra", "role": "garra", "text": "E eu não vou deixar você atrapalhar. Dessa vez eu trouxe meus melhores monstrinhos!", "tts": "E eu não vou deixar você atrapalhar. Dessa vez eu trouxe meus melhores monstrinhos!", "key": "eeunaovoudeixarvoceatrapalhardessavezeutrouxemeusmelhoresmonstrinhos", "g": ""}, {"id": "528_garra", "role": "garra", "text": "Então você é a pestinha que anda atrapalhando o Bando Sombra.", "tts": "Então você é a pestinha que anda atrapalhando o Bando Sombra.", "key": "entaovoceeapestinhaqueandaatrapalhandoobandosombra", "g": ""}, {"id": "529_garra", "role": "garra", "text": "Eu sou a Garra, braço direito do Corvo. Vou te ensinar uma lição!", "tts": "Eu sou a Garra, braço direito do Corvo. Vou te ensinar uma lição!", "key": "eusouagarrabracodireitodocorvovouteensinarumalicao", "g": ""}, {"id": "530_garra", "role": "garra", "text": "Grr... Não importa! O Corvo já está indo pra Cratera do Vulcão buscar o fogo da aurora!", "tts": "Grr... Não importa! O Corvo já está indo pra Cratera do Vulcão buscar o fogo da aurora!", "key": "grrnaoimportaocorvojaestaindopracrateradovulcaobuscarofogodaaurora", "g": ""}, {"id": "531_garra", "role": "garra", "text": "Hmpf! De novo?! O Corvo não vai gostar nada disso...", "tts": "Hmpf! De novo?! O Corvo não vai gostar nada disso...", "key": "hmpfdenovoocorvonaovaigostarnadadisso", "g": ""}, {"id": "532_garra", "role": "garra", "text": "O Corvo escapou da Cratera e foi pro norte. Ele quer os CRISTAIS DA AURORA!", "tts": "O Corvo escapou da Cratera e foi pro norte. Ele quer os CRISTAIS DA AURORA!", "key": "ocorvoescapoudacrateraefoipronorteelequeroscristaisdaaurora", "g": ""}, {"id": "533_garra", "role": "garra", "text": "Ora, ora... o guardião do Vale de novo.", "tts": "Ora, ora... o guardião do Vale de novo.", "key": "oraoraoguardiaodovaledenovo", "g": ""}, {"id": "534_garra", "role": "garra", "text": "Tá bom, tá bom... Vai lá. Mas a Vila Lunária já deve estar cercada pelo Bando!", "tts": "Tá bom, tá bom... Vai lá. Mas a Vila Lunária já deve estar cercada pelo Bando!", "key": "tabomtabomvailamasavilalunariajadeveestarcercadapelobando", "g": ""}, {"id": "535_bento", "role": "bento", "text": "Com você por perto eu até durmo melhor.", "tts": "Com você por perto eu até durmo melhor.", "key": "comvoceporpertoeuatedurmomelhor", "g": ""}, {"id": "536_bento", "role": "bento", "text": "Desde que o Aurorion sumiu, os monstrinhos andam agitados.", "tts": "Desde que o Aurorion sumiu, os monstrinhos andam agitados.", "key": "desdequeoaurorionsumiuosmonstrinhosandamagitados", "g": ""}, {"id": "537_bento", "role": "bento", "text": "Se um dia quiser ser guarda, a vaga é sua!", "tts": "Se um dia quiser ser guarda, a vaga é sua!", "key": "seumdiaquiserserguardaavagaesua", "g": ""}, {"id": "538_bento", "role": "bento", "text": "Tudo tranquilo na vila. Por enquanto...", "tts": "Tudo tranquilo na vila. Por enquanto...", "key": "tudotranquilonavilaporenquanto", "g": ""}, {"id": "539_bento", "role": "bento", "text": "Você é um herói de verdade. A vila inteira fala de você!", "tts": "Você é um herói de verdade. A vila inteira fala de você!", "key": "voceeumheroideverdadeavilainteirafaladevoce", "g": ""}, {"id": "540_bento", "role": "bento", "text": "Alto lá! A Rota 1 está cheia de monstrinhos agitados.", "tts": "Alto lá! A Rota 1 está cheia de monstrinhos agitados.", "key": "altolaarotaestacheiademonstrinhosagitados", "g": ""}, {"id": "541_bento", "role": "bento", "text": "Essa trilha pro Lago Escondido é perigosa. Mostre que é forte vencendo o Davi primeiro!", "tts": "Essa trilha pro Lago Escondido é perigosa. Mostre que é forte vencendo o Davi primeiro!", "key": "essatrilhaprolagoescondidoeperigosamostrequeefortevencendoodaviprimeiro", "g": ""}, {"id": "542_bento", "role": "bento", "text": "O Guarda Bento precisa de ajuda aqui na vila. Fale com ele primeiro!", "tts": "O Guarda Bento precisa de ajuda aqui na vila. Fale com ele primeiro!", "key": "oguardabentoprecisadeajudaaquinavilafalecomeleprimeiro", "g": ""}, {"id": "543_iara", "role": "iara", "text": "Acho que tem um fóssil enterrado lá no canto sudeste, perto das pedras. Procura o brilho na areia?", "tts": "Acho que tem um fóssil enterrado lá no canto sudeste, perto das pedras. Procura o brilho na areia?", "key": "achoquetemumfossilenterradolanocantosudestepertodaspedrasprocuraobrilhonaareia", "g": ""}, {"id": "544_iara", "role": "iara", "text": "O deserto guarda muitos segredos. Um dia eu acho a Gruta do Eco!", "tts": "O deserto guarda muitos segredos. Um dia eu acho a Gruta do Eco!", "key": "odesertoguardamuitossegredosumdiaeuachoagrutadoeco", "g": ""}, {"id": "545_iara", "role": "iara", "text": "Uau! Isso é de um monstrinho de Pedra de milhares de anos atrás! Toma, pela ajuda.", "tts": "Uau! Isso é de um monstrinho de Pedra de milhares de anos atrás! Toma, pela ajuda.", "key": "uauissoedeummonstrinhodepedrademilharesdeanosatrastomapelaajuda", "g": ""}, {"id": "546_juca", "role": "juca", "text": "Ai, minha bicicleta quebrou bem no meio da trilha da floresta!", "tts": "Ai, minha bicicleta quebrou bem no meio da trilha da floresta!", "key": "aiminhabicicletaquebroubemnomeiodatrilhadafloresta", "g": ""}, {"id": "547_juca", "role": "juca", "text": "Brrr... você venceu. Toma um chá quente!", "tts": "Brrr... você venceu. Toma um chá quente!", "key": "brrrvocevenceutomaumchaquente", "g": ""}, {"id": "548_juca", "role": "juca", "text": "Perdi minha CHAVE DE BOCA no mato alto da Rota 1. Sem ela não consigo tirar a bike daqui.", "tts": "Perdi minha CHAVE DE BOCA no mato alto da Rota 1. Sem ela não consigo tirar a bike daqui.", "key": "perdiminhachavedebocanomatoaltodarotasemelanaoconsigotirarabikedaqui", "g": ""}, {"id": "549_juca", "role": "juca", "text": "Subi essa trilha mil vezes. Vamos ver se você aguenta o frio!", "tts": "Subi essa trilha mil vezes. Vamos ver se você aguenta o frio!", "key": "subiessatrilhamilvezesvamosversevoceaguentaofrio", "g": ""}, {"id": "550_juca", "role": "juca", "text": "Vrum vrum! A bike tá voando!", "tts": "Vrum vrum! A bike tá voando!", "key": "vrumvrumabiketavoando", "g": ""}, {"id": "551_kai", "role": "kai", "text": "Ele ainda tá lá! Tenta de novo, por favor!", "tts": "Ele ainda tá lá! Tenta de novo, por favor!", "key": "eleaindatalatentadenovoporfavor", "g": ""}, {"id": "552_kai", "role": "kai", "text": "Meu Pinguinho ficou forte! Batalha comigo? Eu quero ser guardião igual você!", "tts": "Meu Pinguinho ficou forte! Batalha comigo? Eu quero ser guardião igual você!", "key": "meupinguinhoficoufortebatalhacomigoeuqueroserguardiaoigualvoce", "g": ""}, {"id": "553_kai", "role": "kai", "text": "Meu pinguinho adora escorregar no gelo!", "tts": "Meu pinguinho adora escorregar no gelo!", "key": "meupinguinhoadoraescorregarnogelo", "g": ""}, {"id": "554_kai", "role": "kai", "text": "Protege ele com a MURALHA, por favor!", "tts": "Protege ele com a MURALHA, por favor!", "key": "protegeelecomamuralhaporfavor", "g": ""}, {"id": "555_kai", "role": "kai", "text": "Socorro! Uns monstrinhos bravos cercaram meu amigo pinguim no lago!", "tts": "Socorro! Uns monstrinhos bravos cercaram meu amigo pinguim no lago!", "key": "socorrounsmonstrinhosbravoscercarammeuamigopinguimnolago", "g": ""}, {"id": "556_kai", "role": "kai", "text": "Um dia eu ganho de você!", "tts": "Um dia eu ganho de você!", "key": "umdiaeuganhodevoce", "g": ""}, {"id": "557_kai", "role": "kai", "text": "Um dia eu vou ser guardião igual você!", "tts": "Um dia eu vou ser guardião igual você!", "key": "umdiaeuvouserguardiaoigualvoce", "g": ""}, {"id": "558_kai", "role": "kai", "text": "Você salvou ele! Olha... tem outro pinguim aqui que quer ir com você!", "tts": "Você salvou ele! Olha... tem outro pinguim aqui que quer ir com você!", "key": "vocesalvoueleolhatemoutropinguimaquiquequerircomvoce", "g": ""}, {"id": "559_kai", "role": "kai", "text": "Você é meu herói. Toma!", "tts": "Você é meu herói. Toma!", "key": "voceemeuheroitoma", "g": ""}, {"id": "560_treinador", "role": "treinador", "text": "A última fronteira. Ninguém nunca chegou tão longe!", "tts": "A última fronteira. Ninguém nunca chegou tão longe!", "key": "aultimafronteiraninguemnuncachegoutaolonge", "g": ""}, {"id": "561_treinador", "role": "treinador", "text": "Aqui os fantasmas e corujas saem do mato alto. Os monstrinhos daqui são bem mais fortes, hein!", "tts": "Aqui os fantasmas e corujas saem do mato alto. Os monstrinhos daqui são bem mais fortes, hein!", "key": "aquiosfantasmasecorujassaemdomatoaltoosmonstrinhosdaquisaobemmaisforteshein", "g": ""}, {"id": "562_treinador", "role": "treinador", "text": "Bora explorar? Sua equipe anda sozinha e luta sozinha.", "tts": "Bora explorar? Sua equipe anda sozinha e luta sozinha.", "key": "boraexplorarsuaequipeandasozinhaelutasozinha", "g": ""}, {"id": "563_treinador", "role": "treinador", "text": "Começou o Mundo 2! Os monstrinhos daqui são muito mais fortes.", "tts": "Começou o Mundo 2! Os monstrinhos daqui são muito mais fortes.", "key": "comecouomundoosmonstrinhosdaquisaomuitomaisfortes", "g": ""}, {"id": "564_treinador", "role": "treinador", "text": "Daqui pra frente aparecem monstrinhos de fogo, água e raio.", "tts": "Daqui pra frente aparecem monstrinhos de fogo, água e raio.", "key": "daquiprafrenteaparecemmonstrinhosdefogoaguaeraio", "g": ""}, {"id": "565_treinador", "role": "treinador", "text": "Deixe sua equipe forte e passe por ele!", "tts": "Deixe sua equipe forte e passe por ele!", "key": "deixesuaequipeforteepasseporele", "g": ""}, {"id": "566_treinador", "role": "treinador", "text": "Dizem que existe um vale perdido depois da fase 10...", "tts": "Dizem que existe um vale perdido depois da fase 10...", "key": "dizemqueexisteumvaleperdidodepoisdafase", "g": ""}, {"id": "567_treinador", "role": "treinador", "text": "Ei! Treinador novo por aqui? Vamos ver do que você é capaz!", "tts": "Ei! Treinador novo por aqui? Vamos ver do que você é capaz!", "key": "eitreinadornovoporaquivamosverdoquevoceecapaz", "g": ""}, {"id": "568_treinador", "role": "treinador", "text": "Na fase 5 tem um chefe enorme esperando.", "tts": "Na fase 5 tem um chefe enorme esperando.", "key": "nafasetemumchefeenormeesperando", "g": ""}, {"id": "569_treinador", "role": "treinador", "text": "Neblina, veneno e chefes enormes. Leve monstrinhos de fogo!", "tts": "Neblina, veneno e chefes enormes. Leve monstrinhos de fogo!", "key": "neblinavenenoechefesenormeslevemonstrinhosdefogo", "g": ""}, {"id": "570_treinador", "role": "treinador", "text": "No deserto o sol castiga e os inimigos andam em bando.", "tts": "No deserto o sol castiga e os inimigos andam em bando.", "key": "nodesertoosolcastigaeosinimigosandamembando", "g": ""}, {"id": "571_treinador", "role": "treinador", "text": "Perdi! Você é bom de verdade.", "tts": "Perdi! Você é bom de verdade.", "key": "perdivoceebomdeverdade", "g": ""}, {"id": "572_treinador", "role": "treinador", "text": "Raios por todo lado! Monstrinhos de pedra ajudam muito.", "tts": "Raios por todo lado! Monstrinhos de pedra ajudam muito.", "key": "raiosportodoladomonstrinhosdepedraajudammuito", "g": ""}, {"id": "573_treinador", "role": "treinador", "text": "Só os maiores exploradores chegaram tão longe. Vai lá!", "tts": "Só os maiores exploradores chegaram tão longe. Vai lá!", "key": "soosmaioresexploradoreschegaramtaolongevaila", "g": ""}, {"id": "574_treinador", "role": "treinador", "text": "Troque a equipe tocando nos monstrinhos se precisar!", "tts": "Troque a equipe tocando nos monstrinhos se precisar!", "key": "troqueaequipetocandonosmonstrinhosseprecisar", "g": ""}, {"id": "575_treinador", "role": "treinador", "text": "Use as melhorias da Expedição e as Cartas de Poder.", "tts": "Use as melhorias da Expedição e as Cartas de Poder.", "key": "useasmelhoriasdaexpedicaoeascartasdepoder", "g": ""}, {"id": "576_treinador", "role": "treinador", "text": "Você leva jeito mesmo! Treina mais um pouco e vai desafiar a Bruna.", "tts": "Você leva jeito mesmo! Treina mais um pouco e vai desafiar a Bruna.", "key": "vocelevajeitomesmotreinamaisumpoucoevaidesafiarabruna", "g": ""}, {"id": "577_treinador", "role": "treinador", "text": "Volte de vez em quando pra ver o progresso. Conclua 2 fases!", "tts": "Volte de vez em quando pra ver o progresso. Conclua 2 fases!", "key": "voltedevezemquandopraveroprogressoconcluafases", "g": ""}, {"id": "578_lia", "role": "lia", "text": "As sombras me contaram que você viria... Prepare-se!", "tts": "As sombras me contaram que você viria... Prepare-se!", "key": "assombrasmecontaramquevoceviriapreparese", "g": ""}, {"id": "579_lia", "role": "lia", "text": "As sombras se enganaram. Você é forte!", "tts": "As sombras se enganaram. Você é forte!", "key": "assombrasseenganaramvoceeforte", "g": ""}, {"id": "580_lia", "role": "lia", "text": "Buáá! Um bandido do Bando Sombra ROUBOU minha bicicleta!", "tts": "Buáá! Um bandido do Bando Sombra ROUBOU minha bicicleta!", "key": "buaaumbandidodobandosombraroubouminhabicicleta", "g": ""}, {"id": "581_lia", "role": "lia", "text": "Eu fico aqui vigiando a ponte pra ele não fugir. Fala comigo quando puder ajudar!", "tts": "Eu fico aqui vigiando a ponte pra ele não fugir. Fala comigo quando puder ajudar!", "key": "euficoaquivigiandoapontepraelenaofugirfalacomigoquandopuderajudar", "g": ""}, {"id": "582_lia", "role": "lia", "text": "Minha bicicleta tá novinha de novo, olha!", "tts": "Minha bicicleta tá novinha de novo, olha!", "key": "minhabicicletatanovinhadenovoolha", "g": ""}, {"id": "583_loja", "role": "loja", "text": "Bem-vindo à Loja da Maré! Dá uma olhada.", "tts": "Bem-vindo à Loja da Maré! Dá uma olhada.", "key": "bemvindoalojadamaredaumaolhada", "g": ""}, {"id": "584_capitao", "role": "capitao", "text": "Enquanto o lago não ficar limpo, os caixotes do porto ficam aqui na estrada.", "tts": "Enquanto o lago não ficar limpo, os caixotes do porto ficam aqui na estrada.", "key": "enquantoolagonaoficarlimpooscaixotesdoportoficamaquinaestrada", "g": ""}, {"id": "585_capitao", "role": "capitao", "text": "Ninguém passa! Uns bandidos sujaram o Lago Azul e espantaram os peixes...", "tts": "Ninguém passa! Uns bandidos sujaram o Lago Azul e espantaram os peixes...", "key": "ninguempassaunsbandidossujaramolagoazuleespantaramospeixes", "g": ""}, {"id": "586_loja", "role": "loja", "text": "Bem-vindo ao Oásis do Sol! Tenho de tudo pra sua viagem.", "tts": "Bem-vindo ao Oásis do Sol! Tenho de tudo pra sua viagem.", "key": "bemvindoaooasisdosoltenhodetudoprasuaviagem", "g": ""}, {"id": "587_loja", "role": "loja", "text": "Água fresca! Ops, quer dizer... itens fresquinhos!", "tts": "Água fresca! Ops, quer dizer... itens fresquinhos!", "key": "aguafrescaopsquerdizeritensfresquinhos", "g": ""}, {"id": "588_brasa", "role": "brasa", "text": "Conseguimos! O vulcão se acalmou.", "tts": "Conseguimos! O vulcão se acalmou.", "key": "conseguimosovulcaoseacalmou", "g": ""}, {"id": "589_brasa", "role": "brasa", "text": "Guardião do Vale, eu me curvo a você.", "tts": "Guardião do Vale, eu me curvo a você.", "key": "guardiaodovaleeumecurvoavoce", "g": ""}, {"id": "590_brasa", "role": "brasa", "text": "O Aurorion sentiu sua coragem. Ele ainda está por aí, em algum lugar do Vale.", "tts": "O Aurorion sentiu sua coragem. Ele ainda está por aí, em algum lugar do Vale.", "key": "oaurorionsentiusuacoragemeleaindaestaporaiemalgumlugardovale", "g": ""}, {"id": "591_brasa", "role": "brasa", "text": "O fogo ainda queima. Fortaleça sua equipe e volte!", "tts": "O fogo ainda queima. Fortaleça sua equipe e volte!", "key": "ofogoaindaqueimafortalecasuaequipeevolte", "g": ""}, {"id": "592_brasa", "role": "brasa", "text": "O fogo do vulcão é a força do Vale. Não pode cair em mãos erradas.", "tts": "O fogo do vulcão é a força do Vale. Não pode cair em mãos erradas.", "key": "ofogodovulcaoeaforcadovalenaopodecairemmaoserradas", "g": ""}, {"id": "593_brasa", "role": "brasa", "text": "O vulcão está acordando e uma horda de monstrinhos de fogo está saindo da lava!", "tts": "O vulcão está acordando e uma horda de monstrinhos de fogo está saindo da lava!", "key": "ovulcaoestaacordandoeumahordademonstrinhosdefogoestasaindodalava", "g": ""}, {"id": "594_brasa", "role": "brasa", "text": "Poucos aguentam o calor da cratera como você.", "tts": "Poucos aguentam o calor da cratera como você.", "key": "poucosaguentamocalordacrateracomovoce", "g": ""}, {"id": "595_brasa", "role": "brasa", "text": "Te considero meu discípulo.", "tts": "Te considero meu discípulo.", "key": "teconsideromeudiscipulo", "g": ""}, {"id": "596_brasa", "role": "brasa", "text": "Treinar perto da lava deixa a coragem quente!", "tts": "Treinar perto da lava deixa a coragem quente!", "key": "treinarpertodalavadeixaacoragemquente", "g": ""}, {"id": "597_brasa", "role": "brasa", "text": "Você tem o coração de um verdadeiro guardião.", "tts": "Você tem o coração de um verdadeiro guardião.", "key": "vocetemocoracaodeumverdadeiroguardiao", "g": ""}, {"id": "598_brasa", "role": "brasa", "text": "É agora, guardião! Defenda o Vale na MURALHA!", "tts": "É agora, guardião! Defenda o Vale na MURALHA!", "key": "eagoraguardiaodefendaovalenamuralha", "g": ""}, {"id": "599_enf", "role": "enf", "text": "Descansa um pouquinho aqui.", "tts": "Descansa um pouquinho aqui.", "key": "descansaumpouquinhoaqui", "g": ""}, {"id": "600_enf", "role": "enf", "text": "Vai começar sua jornada? Leva essas 3 Poções, por via das dúvidas.", "tts": "Vai começar sua jornada? Leva essas 3 Poções, por via das dúvidas.", "key": "vaicomecarsuajornadalevaessaspocoesporviadasduvidas", "g": ""}, {"id": "601_nina", "role": "nina", "text": "Eu desenhei você e seu parceiro! Ficou lindo!", "tts": "Eu desenhei você e seu parceiro! Ficou lindo!", "key": "eudesenheivoceeseuparceiroficoulindo", "g": ""}, {"id": "602_nina", "role": "nina", "text": "Eu quero conhecer TODOS os monstrinhos do Vale!", "tts": "Eu quero conhecer TODOS os monstrinhos do Vale!", "key": "euqueroconhecertodososmonstrinhosdovale", "g": ""}, {"id": "603_nina", "role": "nina", "text": "Quando eu crescer quero ser igual a você!", "tts": "Quando eu crescer quero ser igual a você!", "key": "quandoeucrescerqueroserigualavoce", "g": ""}, {"id": "604_nina", "role": "nina", "text": "Sabia que o Pipiu dorme com um olho aberto? É verdade!", "tts": "Sabia que o Pipiu dorme com um olho aberto? É verdade!", "key": "sabiaqueopipiudormecomumolhoabertoeverdade", "g": ""}, {"id": "605_nina", "role": "nina", "text": "Você viu aquela Ratonga? Ela tá bem agora graças a você!", "tts": "Você viu aquela Ratonga? Ela tá bem agora graças a você!", "key": "voceviuaquelaratongaelatabemagoragracasavoce", "g": ""}, {"id": "606_nina", "role": "nina", "text": "Você é meu herói favorito!", "tts": "Você é meu herói favorito!", "key": "voceemeuheroifavorito", "g": ""}, {"id": "607_rui", "role": "rui", "text": "Dica: jogue perto das sombras de peixe e pesque várias vezes seguidas pra achar BRILHANTES.", "tts": "Dica: jogue perto das sombras de peixe e pesque várias vezes seguidas pra achar BRILHANTES.", "key": "dicajoguepertodassombrasdepeixeepesquevariasvezesseguidaspraacharbrilhantes", "g": ""}, {"id": "608_rui", "role": "rui", "text": "Ei! Toma uma VARA DE PESCAR de presente!", "tts": "Ei! Toma uma VARA DE PESCAR de presente!", "key": "eitomaumavaradepescardepresente", "g": ""}, {"id": "609_rui", "role": "rui", "text": "Ei, você! Meus monstrinhos pescados estão doidos pra lutar!", "tts": "Ei, você! Meus monstrinhos pescados estão doidos pra lutar!", "key": "eivocemeusmonstrinhospescadosestaodoidospralutar", "g": ""}, {"id": "610_rui", "role": "rui", "text": "Puxa, que pescaria ruim... você venceu!", "tts": "Puxa, que pescaria ruim... você venceu!", "key": "puxaquepescariaruimvocevenceu", "g": ""}, {"id": "611_rui", "role": "rui", "text": "Toque na água pra jogar a linha. Quando aparecer o \"!\", toque RÁPIDO. Se puxar cedo, o peixe foge!", "tts": "Toque na água pra jogar a linha. Quando aparecer o \"!\", toque RÁPIDO. Se puxar cedo, o peixe foge!", "key": "toquenaaguaprajogaralinhaquandoaparecerotoquerapidosepuxarcedoopeixefoge", "g": ""}, {"id": "612_bira", "role": "bira", "text": "Empurrar pedra é bom pros braços! Mas cuidado pra não prender ela na parede.", "tts": "Empurrar pedra é bom pros braços! Mas cuidado pra não prender ela na parede.", "key": "empurrarpedraebomprosbracosmascuidadopranaoprenderelanaparede", "g": ""}, {"id": "613_ze", "role": "ze", "text": "Acho que caiu lá pro sul da Rota 2, perto da saída. Procura pra mim? Vai ter um brilho no chão.", "tts": "Acho que caiu lá pro sul da Rota 2, perto da saída. Procura pra mim? Vai ter um brilho no chão.", "key": "achoquecaiulaprosuldarotapertodasaidaprocurapramimvaiterumbrilhonochao", "g": ""}, {"id": "614_ze", "role": "ze", "text": "Ai, ai... perdi minha vara de pesca da sorte!", "tts": "Ai, ai... perdi minha vara de pesca da sorte!", "key": "aiaiperdiminhavaradepescadasorte", "g": ""}, {"id": "615_ze", "role": "ze", "text": "Campeão do torneio! Toma o prêmio.", "tts": "Campeão do torneio! Toma o prêmio.", "key": "campeaodotorneiotomaopremio", "g": ""}, {"id": "616_ze", "role": "ze", "text": "Com a minha vara de volta, lembrei de uma lenda: no LAGO ESCONDIDO, a oeste da Rota 2, aparece uma luz embaixo d\\'água.", "tts": "Com a minha vara de volta, lembrei de uma lenda: no LAGO ESCONDIDO, a oeste da Rota 2, aparece uma luz embaixo d\\'água.", "key": "comaminhavaradevoltalembreideumalendanolagoescondidoaoestedarotaapareceumaluzembaixodagua", "g": ""}, {"id": "617_ze", "role": "ze", "text": "Eu sabia! Guarde bem, isso dá sorte na pescaria.", "tts": "Eu sabia! Guarde bem, isso dá sorte na pescaria.", "key": "eusabiaguardebemissodasortenapescaria", "g": ""}, {"id": "618_ze", "role": "ze", "text": "Meu melhor amigo de pescaria!", "tts": "Meu melhor amigo de pescaria!", "key": "meumelhoramigodepescaria", "g": ""}, {"id": "619_ze", "role": "ze", "text": "Minha vara! Muito obrigado, meu jovem. Toma, leva isso.", "tts": "Minha vara! Muito obrigado, meu jovem. Toma, leva isso.", "key": "minhavaramuitoobrigadomeujovemtomalevaisso", "g": ""}, {"id": "620_ze", "role": "ze", "text": "Na minha época os Marolos eram desse tamanho!", "tts": "Na minha época os Marolos eram desse tamanho!", "key": "naminhaepocaosmaroloseramdessetamanho", "g": ""}, {"id": "621_ze", "role": "ze", "text": "Paciência é o segredo da pesca... e da vida.", "tts": "Paciência é o segredo da pesca... e da vida.", "key": "pacienciaeosegredodapescaedavida", "g": ""}, {"id": "622_ze", "role": "ze", "text": "Peixe bom é peixe que a gente devolve pro lago!", "tts": "Peixe bom é peixe que a gente devolve pro lago!", "key": "peixebomepeixequeagentedevolveprolago", "g": ""}, {"id": "623_ze", "role": "ze", "text": "Peixe escorregadio, né? Planta e Elétrico ajudam!", "tts": "Peixe escorregadio, né? Planta e Elétrico ajudam!", "key": "peixeescorregadioneplantaeeletricoajudam", "g": ""}, {"id": "624_ze", "role": "ze", "text": "Rapaz... você pescou a vitória!", "tts": "Rapaz... você pescou a vitória!", "key": "rapazvocepescouavitoria", "g": ""}, {"id": "625_ze", "role": "ze", "text": "Todo ano tem o Torneio de Pesca do Vale. Esse ano o desafio é batalhar com os meus peixes!", "tts": "Todo ano tem o Torneio de Pesca do Vale. Esse ano o desafio é batalhar com os meus peixes!", "key": "todoanotemotorneiodepescadovaleesseanoodesafioebatalharcomosmeuspeixes", "g": ""}, {"id": "626_ze", "role": "ze", "text": "Vai lá conferir pra mim? Procure o brilho na beira do lago.", "tts": "Vai lá conferir pra mim? Procure o brilho na beira do lago.", "key": "vailaconferirpramimprocureobrilhonabeiradolago", "g": ""}, {"id": "627_ze", "role": "ze", "text": "Vamos ver se você aguenta!", "tts": "Vamos ver se você aguenta!", "key": "vamosversevoceaguenta", "g": ""}, {"id": "628_ze", "role": "ze", "text": "Você é gente boa, sabia?", "tts": "Você é gente boa, sabia?", "key": "voceegenteboasabia", "g": ""}, {"id": "629_ze", "role": "ze", "text": "Vou te ensinar meu ponto secreto de pesca. Shhh!", "tts": "Vou te ensinar meu ponto secreto de pesca. Shhh!", "key": "vouteensinarmeupontosecretodepescashhh", "g": ""}, {"id": "630_areia", "role": "areia", "text": "O deserto é meu lar! Vamos ver se você aguenta o calor!", "tts": "O deserto é meu lar! Vamos ver se você aguenta o calor!", "key": "odesertoemeularvamosversevoceaguentaocalor", "g": ""}, {"id": "631_areia", "role": "areia", "text": "Ufa... você é mais quente que o deserto!", "tts": "Ufa... você é mais quente que o deserto!", "key": "ufavoceemaisquentequeodeserto", "g": ""}, {"id": "632_luna", "role": "luna", "text": "A escuridão ainda é forte. Fortaleça sua equipe e volte!", "tts": "A escuridão ainda é forte. Fortaleça sua equipe e volte!", "key": "aescuridaoaindaefortefortalecasuaequipeevolte", "g": ""}, {"id": "633_luna", "role": "luna", "text": "A lua ainda está escondida. Descanse e tente de novo.", "tts": "A lua ainda está escondida. Descanse e tente de novo.", "key": "aluaaindaestaescondidadescanseetentedenovo", "g": ""}, {"id": "634_luna", "role": "luna", "text": "A lua conta histórias pra quem sabe ouvir.", "tts": "A lua conta histórias pra quem sabe ouvir.", "key": "aluacontahistoriaspraquemsabeouvir", "g": ""}, {"id": "635_luna", "role": "luna", "text": "A vila está salva! Obrigada, guardião.", "tts": "A vila está salva! Obrigada, guardião.", "key": "avilaestasalvaobrigadaguardiao", "g": ""}, {"id": "636_luna", "role": "luna", "text": "Ele escolheu você, guardião.", "tts": "Ele escolheu você, guardião.", "key": "eleescolheuvoceguardiao", "g": ""}, {"id": "637_luna", "role": "luna", "text": "Então você é o guardião que acalmou o vulcão. Eu sonhei com você.", "tts": "Então você é o guardião que acalmou o vulcão. Eu sonhei com você.", "key": "entaovoceeoguardiaoqueacalmouovulcaoeusonheicomvoce", "g": ""}, {"id": "638_luna", "role": "luna", "text": "Mas primeiro... o Bando Sombra está atacando a vila! Defenda o portão com as TORRES!", "tts": "Mas primeiro... o Bando Sombra está atacando a vila! Defenda o portão com as TORRES!", "key": "masprimeiroobandosombraestaatacandoaviladefendaoportaocomastorres", "g": ""}, {"id": "639_luna", "role": "luna", "text": "Monstrinhos sombrios vão atacar o Aurorion antes que ele acorde. Defenda ele na MURALHA!", "tts": "Monstrinhos sombrios vão atacar o Aurorion antes que ele acorde. Defenda ele na MURALHA!", "key": "monstrinhossombriosvaoatacaroaurorionantesqueeleacordedefendaelenamuralha", "g": ""}, {"id": "640_luna", "role": "luna", "text": "O Aurorion está preso no Templo da Aurora, aqui em cima. O Corvo usou cristais pra prender a luz dele.", "tts": "O Aurorion está preso no Templo da Aurora, aqui em cima. O Corvo usou cristais pra prender a luz dele.", "key": "oaurorionestapresonotemplodaauroraaquiemcimaocorvousoucristaispraprenderaluzdele", "g": ""}, {"id": "641_luna", "role": "luna", "text": "O Aurorion não é só um monstrinho. Ele é a luz do Vale.", "tts": "O Aurorion não é só um monstrinho. Ele é a luz do Vale.", "key": "oaurorionnaoesoummonstrinhoeleealuzdovale", "g": ""}, {"id": "642_luna", "role": "luna", "text": "O caminho pro Templo fica ao norte da vila. Mas tem alguém te esperando antes...", "tts": "O caminho pro Templo fica ao norte da vila. Mas tem alguém te esperando antes...", "key": "ocaminhoprotemploficaaonortedavilamastemalguemteesperandoantes", "g": ""}, {"id": "643_luna", "role": "luna", "text": "Os cristais quebraram, mas a energia escura está saindo deles!", "tts": "Os cristais quebraram, mas a energia escura está saindo deles!", "key": "oscristaisquebrarammasaenergiaescuraestasaindodeles", "g": ""}, {"id": "644_luna", "role": "luna", "text": "Você tem um coração corajoso, pequeno guardião.", "tts": "Você tem um coração corajoso, pequeno guardião.", "key": "vocetemumcoracaocorajosopequenoguardiao", "g": ""}, {"id": "645_tonho", "role": "tonho", "text": "A montanha não perdoa! Volta mais forte.", "tts": "A montanha não perdoa! Volta mais forte.", "key": "amontanhanaoperdoavoltamaisforte", "g": ""}, {"id": "646_tonho", "role": "tonho", "text": "Agora que você viu o Vale lá de cima, quero ver se é forte que nem a montanha!", "tts": "Agora que você viu o Vale lá de cima, quero ver se é forte que nem a montanha!", "key": "agoraquevoceviuovaleladecimaqueroverseefortequenemamontanha", "g": ""}, {"id": "647_tonho", "role": "tonho", "text": "Amigo pra todas as trilhas!", "tts": "Amigo pra todas as trilhas!", "key": "amigopratodasastrilhas", "g": ""}, {"id": "648_tonho", "role": "tonho", "text": "Conseguiu! Olha só, ele não sai do seu lado.", "tts": "Conseguiu! Olha só, ele não sai do seu lado.", "key": "conseguiuolhasoelenaosaidoseulado", "g": ""}, {"id": "649_tonho", "role": "tonho", "text": "Ei, cuidado! O Bando Sombra assustou os monstrinhos da montanha e eles estão descendo todos de uma vez!", "tts": "Ei, cuidado! O Bando Sombra assustou os monstrinhos da montanha e eles estão descendo todos de uma vez!", "key": "eicuidadoobandosombraassustouosmonstrinhosdamontanhaeelesestaodescendotodosdeumavez", "g": ""}, {"id": "650_tonho", "role": "tonho", "text": "Já subiu no MIRANTE DA SERRA? A leste daqui! De lá dá pra ver o Vale inteiro.", "tts": "Já subiu no MIRANTE DA SERRA? A leste daqui! De lá dá pra ver o Vale inteiro.", "key": "jasubiunomirantedaserraalestedaquideladapraverovaleinteiro", "g": ""}, {"id": "651_tonho", "role": "tonho", "text": "Já viu o nascer do sol lá do Pico? É de chorar!", "tts": "Já viu o nascer do sol lá do Pico? É de chorar!", "key": "javiuonascerdosolladopicoedechorar", "g": ""}, {"id": "652_tonho", "role": "tonho", "text": "Lindo, né? É por isso que vale a pena proteger o Vale.", "tts": "Lindo, né? É por isso que vale a pena proteger o Vale.", "key": "lindoneeporissoquevaleapenaprotegerovale", "g": ""}, {"id": "653_tonho", "role": "tonho", "text": "Os monstrinhos de lá são fortes. Chegue até a placa do mirante e veja com seus olhos!", "tts": "Os monstrinhos de lá são fortes. Chegue até a placa do mirante e veja com seus olhos!", "key": "osmonstrinhosdelasaoforteschegueateaplacadomiranteevejacomseusolhos", "g": ""}, {"id": "654_tonho", "role": "tonho", "text": "Parceiro de trilha bom é você!", "tts": "Parceiro de trilha bom é você!", "key": "parceirodetrilhabom     for(const r of ROLES){CAND[r.id]=[];
      if(r.mine){const v=MINE.find(v=>v.name.toLowerCase().startsWith(r.mine.toLowerCase()));if(v)CAND[r.id].push({id:v.voice_id,name:v.name,prev:v.preview_url,mine:1});}
      if(r.q){const tries=[...(r.s||[]).map(w=>({language:'pt',gender:r.q.gender,search:w})),...(r.kid?(r.q.gender==='male'?['menino','criança','infantil','child','boy','kid']:['menina','criança','infantil','child','girl','kid']).map(w=>({language:'pt',gender:r.q.gender,search:w})):[]),{language:'pt',locale:'pt-BR',...r.q},{language:'pt',...r.q},{language:'pt',gender:r.q.gender,age:r.q.age},{language:'pt',gender:r.q.gender}];const seen=new Set();
        for(const t of tries){if(CAND[r.id].filter(c=>!c.mine).length>=8)break;const q=new URLSearchParams({page_size:'20',sort:'usage_character_count_1y',...t});
          try{let vs=(await (await api('/v1/shared-voices?'+q)).json()).voices||[];
            vs=vs.filter(v=>/bra[sz]il|pt-br/i.test((v.accent||'')+' '+(v.locale||'')+' '+(v.verified_languages||[]).map(x=>(x.accent||'')+' '+(x.locale||'')).join(' '))&&!/indian|hindi|india|african|nigeria|american|british|spanish|mexic/i.test((v.accent||'')+' '+(v.description||'')+' '+v.name));
            vs.sort((a,b)=>(/bra[sz]il|pt-br/i.test((b.accent||'')+(b.locale||''))?1:0)-(/bra[sz]il|pt-br/i.test((a.accent||'')+(a.locale||''))?1:0));
            for(const v of vs){if(seen.has(v.voice_id))continue;seen.add(v.voice_id);CAND[r.id].push({id:v.voice_id,owner:v.public_owner_id,name:v.name.split(' - ')[0]+' · '+(v.accent||v.locale||'pt')+(v.description?' — '+v.description.slice(0,40):''),prev:v.preview_url});}}catch(e){console.warn(e);}}}
      {const ex=MINE.filter(v=>!CAND[r.id].some(c=>c.id===v.voice_id)&&!/premade/i.test(v.category||'')).map(v=>({id:v.voice_id,name:'(minha) '+v.name,prev:v.preview_url,mine:1,extra:1}));const k=CAND[r.id].findIndex(c=>!c.mine);CAND[r.id].splice(k<0?CAND[r.id].length:k,0,...ex);}
    }
    drawCast();drawLines();credits();$('bRec').disabled=false;st('Pronto. Escute as vozes (▶), troque se quiser e toque em Gravar tudo.');
  }catch(e){st('Não consegui entrar: '+e.message,1);}};
function drawCast(){const saved=JSON.parse(ls.get('cv_el_cast')||'{}');const used=new Set();const box=$('cast');box.innerHTML='';
  for(const r of ROLES){const c=CAND[r.id]||[];let pick=c.find(x=>x.id===saved[r.id])||(r.mine&&c.find(x=>x.mine&&x.name.replace(/^\(minha\) /,'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').startsWith(r.mine.toLowerCase())))||c.find(x=>!x.extra&&!used.has(x.id))||c.find(x=>!x.extra)||c[0];
    if(pick)used.add(pick.id);CAST[r.id]=pick;
    const d=document.createElement('div');d.className='role';d.innerHTML='<b>'+r.nome+'</b>';const s=document.createElement('select');
    c.forEach((x,i)=>{const o=document.createElement('option');o.value=i;o.textContent=x.name;if(x===pick)o.selected=true;s.append(o);});
    s.onchange=()=>{CAST[r.id]=c[s.value];const sv=JSON.parse(ls.get('cv_el_cast')||'{}');sv[r.id]=CAST[r.id].id;ls.set('cv_el_cast',JSON.stringify(sv));};
    const p=document.createElement('button');p.className='sec mini';p.textContent='▶';p.onclick=()=>{const x=CAST[r.id];if(x&&x.prev)new Audio(x.prev).play();};
    d.append(s,p);box.append(d);}}
function drawLines(){const box=$('lines');box.innerHTML='';for(const l of LINES){const d=document.createElement('div');d.className='ln';d.id='l_'+l.id;
  d.innerHTML='<span class="ic">'+(AUD[l.id]?'<span class="ok">✓</span>':'·')+'</span><div><small>'+(ROLES.find(r=>r.id===l.role)||{}).nome+'</small>'+l.text.replace(/</g,'&lt;')+'</div>';
  const bt=document.createElement('div');bt.className='row';bt.style.margin='0';const p=document.createElement('button');p.className='sec mini';p.textContent='▶';p.onclick=()=>{if(AUD[l.id])new Audio(URL.createObjectURL(AUD[l.id])).play();};
  const r=document.createElement('button');r.className='sec mini';r.textContent='↻';r.title='Gravar de novo';r.onclick=async()=>{r.disabled=true;try{await gen(l);credits();}catch(e){st(e.message,1);}r.disabled=false;};
  bt.append(p,r);d.append(bt);box.append(d);}}
async function ensure(v){if(!v||v.mine||!v.owner||added[v.id])return;try{await api('/v1/voices/add/'+v.owner+'/'+v.id,{method:'POST',body:JSON.stringify({new_name:v.name.split(' — ')[0]})});}catch(e){console.warn('add',e.message);}added[v.id]=1;}
let MODEL='eleven_v3';
async function gen(l){const v=CAST[l.role];if(!v)throw new Error('Sem voz para '+l.role);await ensure(v);
  let text=l.tts;if(MODEL!=='eleven_v3')text=text.replace(/\[[^\]]*\]\s*/g,'');
  let r;try{r=await api('/v1/text-to-speech/'+v.id+'?output_format=mp3_44100_64',{method:'POST',body:JSON.stringify({text,model_id:MODEL})});}
  catch(e){if(MODEL==='eleven_v3'&&/model/i.test(e.message)){MODEL='eleven_multilingual_v2';return gen(l);}throw e;}
  AUD[l.id]=await r.blob();const ic=document.querySelector('#l_'+l.id+' .ic');if(ic)ic.innerHTML='<span class="ok">✓</span>';$('bZip').disabled=false;}
$('bRec').onclick=async()=>{stop=false;$('bRec').disabled=true;$('bStop').disabled=false;const todo=LINES.filter(l=>!AUD[l.id]);$('pg').max=LINES.length;
  for(const l of todo){if(stop)break;st('Gravando '+(Object.keys(AUD).length+1)+' de '+LINES.length+'...');
    let ok=0;for(let t=0;t<3&&!ok;t++){try{await gen(l);ok=1;}catch(e){if(t===2){st('Erro na fala "'+l.text.slice(0,40)+'": '+e.message,1);stop=true;}else await new Promise(r=>setTimeout(r,2000*(t+1)));}}
    $('pg').value=Object.keys(AUD).length;}
  $('bRec').disabled=false;$('bStop').disabled=true;credits();
  if(Object.keys(AUD).length===LINES.length)st('Pronto! Toque em Baixar ZIP e mande o arquivo para o Claude.');};
$('bStop').onclick=()=>{stop=true;};
$('bZip').onclick=async()=>{const z=new JSZip();const man=[];for(const l of LINES){if(!AUD[l.id])continue;z.file(l.id+'.mp3',AUD[l.id]);man.push({...l,voz:(CAST[l.role]||{}).name,modelo:MODEL});}
  z.file('manifest.json',JSON.stringify(man,null,1));const b=await z.generateAsync({type:'blob'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='vozes_historia_2.zip';document.body.append(a);a.click();a.remove();};
</script></body></html>
